<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flag Rush — Top 40 Countries</title>
<style>
:root{--bg:#070b16;--card:#10182a;--line:#24324d;--text:#f6f8ff;--muted:#9aa8c2;--accent:#6d5dfc;--good:#22c55e;--bad:#ef4444}
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 50% -10%,#25305c 0,#070b16 48%);display:flex;justify-content:center}
.app{width:min(760px,100%);padding:24px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.logo{font-weight:900;font-size:20px}.stats{display:flex;gap:8px}.pill{border:1px solid var(--line);background:#0d1424;border-radius:999px;padding:8px 12px;font-size:13px}.card{background:rgba(16,24,42,.92);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 20px 60px #0007}h1{font-size:clamp(26px,6vw,42px);margin:4px 0 8px}.sub{color:var(--muted);margin:0 0 20px}.flag-wrap{height:250px;border-radius:18px;background:#050812;border:1px solid #34425e;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.flag{width:min(520px,86%);height:180px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:120px;filter:blur(7px);transform:scale(1.06);user-select:none}.reveal-window{position:absolute;border:2px solid #fff;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.28),0 0 30px #fff8;width:46%;height:48%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#0002}.reveal-window .flag{filter:none;width:100%;height:100%;font-size:92px;transform:none}.timer{height:10px;background:#1c2942;border-radius:20px;margin:18px 0;overflow:hidden}.timer>i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transition:width .1s linear}.question{display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px}.question b{font-size:16px}.hint{font-size:12px;color:var(--muted)}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{padding:15px;border:1px solid #30405e;background:#121d32;color:var(--text);border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s}.option:hover{border-color:#6677a1;transform:translateY(-1px)}.option:disabled{cursor:default;opacity:.9}.correct{background:#0e3a22;border-color:var(--good)!important}.wrong{background:#40171b;border-color:var(--bad)!important}.feedback{min-height:25px;text-align:center;font-weight:800;margin-top:14px}.good{color:var(--good)}.bad{color:var(--bad)}.next{display:none;width:100%;margin-top:10px;padding:14px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:900;cursor:pointer}.start,.result{text-align:center;padding:30px 10px}.start button,.restart{border:0;border-radius:14px;background:var(--accent);color:white;font-weight:900;padding:15px 28px;cursor:pointer;font-size:16px}.small{font-size:12px;color:var(--muted);margin-top:15px}.hidden{display:none!important}@media(max-width:520px){.card{padding:15px}.flag-wrap{height:205px}.flag{font-size:92px}.reveal-window .flag{font-size:68px}.options{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app"><div class="top"><div class="logo">🚩 FLAG RUSH</div><div class="stats"><span class="pill">🏆 <b id="score">0</b></span><span class="pill"><b id="count">1</b>/40</span></div></div><section class="card" id="game"><div id="intro" class="start"><h1>Guess the Flag</h1><p class="sub">A blurred piece of a country's flag appears. Pick the correct country before the <b>20-second</b> timer ends.</p><button onclick="startGame()">Start Game</button><div class="small">40 rounds • 4 choices • 20 seconds each</div></div><div id="play" class="hidden"><div class="flag-wrap" id="flagArea"></div><div class="timer"><i id="timerBar"></i></div><div class="question"><b>Which country is this?</b><span class="hint">Look closely 👀</span></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next" onclick="nextRound()">Next Flag →</button></div><div id="result" class="result hidden"><h1>Game Complete 🎉</h1><p class="sub">You scored <b id="finalScore"></b> out of 40.</p><button class="restart" onclick="location.reload()">Play Again</button></div></section></main>
<script>
const countries=[["India","🇮🇳"],["China","🇨🇳"],["United States","🇺🇸"],["Indonesia","🇮🇩"],["Pakistan","🇵🇰"],["Nigeria","🇳🇬"],["Brazil","🇧🇷"],["Bangladesh","🇧🇩"],["Russia","🇷🇺"],["Ethiopia","🇪🇹"],["Mexico","🇲🇽"],["Japan","🇯🇵"],["Egypt","🇪🇬"],["Philippines","🇵🇭"],["DR Congo","🇨🇩"],["Vietnam","🇻🇳"],["Iran","🇮🇷"],["Turkey","🇹🇷"],["Germany","🇩🇪"],["Thailand","🇹🇭"],["Tanzania","🇹🇿"],["United Kingdom","🇬🇧"],["France","🇫🇷"],["South Africa","🇿🇦"],["Italy","🇮🇹"],["Kenya","🇰🇪"],["Myanmar","🇲🇲"],["Colombia","🇨🇴"],["South Korea","🇰🇷"],["Sudan","🇸🇩"],["Uganda","🇺🇬"],["Spain","🇪🇸"],["Algeria","🇩🇿"],["Iraq","🇮🇶"],["Argentina","🇦🇷"],["Afghanistan","🇦🇫"],["Poland","🇵🇱"],["Canada","🇨🇦"],["Morocco","🇲🇦"],["Saudi Arabia","🇸🇦"]];
let round=0,score=0,current=null,timer=null,locked=false;const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function startGame(){$("intro").classList.add("hidden");$("play").classList.remove("hidden");round=0;score=0;nextRound()}function nextRound(){if(round>=countries.length){finish();return}locked=false;$("next").style.display="none";$("feedback").textContent="";$("score").textContent=score;$("count").textContent=round+1;current=countries[round];const others=shuffle(countries.filter(x=>x!==current)).slice(0,3),choices=shuffle([current,...others]),flag=current[1],posX=25+Math.random()*50,posY=25+Math.random()*45;$("flagArea").innerHTML=`<div class="flag">${flag}</div><div class="reveal-window" style="left:${posX-23}%;top:${posY-24}%"><div class="flag">${flag}</div></div>`;$("options").innerHTML=choices.map(([name])=>`<button class="option" onclick="answer('${name.replace(/'/g,"\\'")}',this)">${name}</button>`).join("");startTimer()}function startTimer(){clearInterval(timer);let left=20;$("timerBar").style.width="100%";timer=setInterval(()=>{left-=.1;$("timerBar").style.width=Math.max(0,left/20*100)+"%";if(left<=0){clearInterval(timer);if(!locked)answer(null,null)}},100)}function answer(name,btn){if(locked)return;locked=true;clearInterval(timer);document.querySelectorAll(".option").forEach(b=>b.disabled=true);const ok=name===current[0];if(ok){score++;btn?.classList.add("correct");$("feedback").innerHTML=`<span class="good">✓ Correct! ${current[0]}</span>`}else{btn?.classList.add("wrong");$("feedback").innerHTML=`<span class="bad">✕ ${name?"Wrong":"Time's up!"} — ${current[0]}</span>`;document.querySelectorAll(".option").forEach(b=>{if(b.textContent===current[0])b.classList.add("correct")})}$("score").textContent=score;$("next").style.display="block";round++}function finish(){$("play").classList.add("hidden");$("result").classList.remove("hidden");$("finalScore").textContent=score}
</script></body></html>
