<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Football Spin Duel — Ronaldo vs Messi</title>
<style>
:root{
  --bg:#07110d; --panel:rgba(10,22,18,.86); --line:rgba(255,255,255,.14);
  --gold:#ffd54a; --blue:#4db7ff; --red:#ff5964; --green:#50e3a4;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,Arial,sans-serif;background:#020604;color:#fff;overflow:hidden}
body{display:flex;justify-content:center}
.game{width:100%;max-width:540px;height:100dvh;min-height:100dvh;margin:0 auto;padding:10px;position:relative;overflow:hidden;background:linear-gradient(180deg,#07110d,#0a2116);}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:7px;min-width:0}.topbar>*{min-width:0}
.brand{font-weight:1000;letter-spacing:.6px;font-size:16px}
.badge{font-size:8px;border:1px solid var(--line);padding:5px 7px;border-radius:999px;background:#ffffff08;color:#cfe7dc}
.scoreboard{display:grid;grid-template-columns:minmax(0,1fr) 54px minmax(0,1fr);gap:7px;align-items:stretch;width:100%;min-width:0}
.card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 35px #0007;backdrop-filter:blur(10px)}
.player-card{padding:12px;text-align:center;position:relative;overflow:hidden;transition:.35s}
.player-card.active{transform:translateY(-4px);box-shadow:0 0 0 2px var(--gold),0 15px 40px #0009}
.player-card.ronaldo{--accent:var(--blue)}
.player-card.messi{--accent:var(--red)}
.avatar{height:105px;display:flex;justify-content:center;align-items:flex-end;position:relative}.real-avatar{width:100%;height:105px;display:flex;justify-content:center;align-items:center;overflow:hidden;border-radius:14px}.real-avatar img{height:100%;width:88px;object-fit:cover;object-position:50% 20%;border-radius:14px;filter:saturate(1.08) contrast(1.05);box-shadow:0 8px 20px #0008}
.body{width:62px;height:72px;border-radius:24px 24px 12px 12px;background:var(--accent);position:relative;box-shadow:inset 0 -12px #0002}
.head{width:48px;height:48px;border-radius:50%;background:#b97852;position:absolute;top:-34px;left:7px;border:3px solid #24170f}
.hair{position:absolute;top:-3px;left:4px;width:40px;height:18px;background:#211710;border-radius:60% 60% 30% 30%}
.arm{position:absolute;width:14px;height:54px;background:#b97852;border-radius:10px;top:8px}
.arm.a{left:-10px;transform:rotate(13deg)} .arm.b{right:-10px;transform:rotate(-13deg)}
.ball{position:absolute;width:25px;height:25px;border-radius:50%;background:#fff;right:-31px;bottom:4px;border:2px solid #222;box-shadow:0 0 0 3px #fff2}
.name{font-size:16px;font-weight:900;margin-top:4px}
.role{font-size:10px;color:#a9bdb4;text-transform:uppercase;letter-spacing:1px}
.score{font-size:clamp(38px,9vw,62px);font-weight:1000;line-height:1;margin:5px 0;color:var(--accent);text-shadow:0 0 22px color-mix(in srgb,var(--accent),transparent 55%)}
.vs{display:flex;flex-direction:column;justify-content:center;align-items:center;font-weight:1000;font-size:26px;color:#fff8}
.round{font-size:10px;color:#9db4aa;letter-spacing:1px;margin-top:4px}
.field{margin-top:7px;height:54vh;min-height:0;position:relative;overflow:hidden;border-radius:24px;border:1px solid #fff2;background:
radial-gradient(ellipse at center,#238047 0,#176437 44%,#0c4527 72%,#07301d 100%);
box-shadow:inset 0 0 90px #001b0b,0 20px 50px #0008}
.field:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#fff0 0 10%,#fff0 10% 20%,#ffffff08 20% 30%);opacity:.55}
.field-lines{position:absolute;inset:5%;border:2px solid #fff6;border-radius:5px}
.centerline{position:absolute;top:0;bottom:0;left:50%;border-left:2px solid #fff6}
.circle{position:absolute;width:120px;height:120px;border:2px solid #fff6;border-radius:50%;left:calc(50% - 60px);top:calc(50% - 60px)}
.center-dot{position:absolute;width:8px;height:8px;background:#fff;border-radius:50%;left:calc(50% - 4px);top:calc(50% - 4px)}
.goal{position:absolute;top:38%;width:48px;height:24%;border:3px solid #fff8}
.goal.left{left:5%;border-left:0}.goal.right{right:5%;border-right:0}
.player-zone{position:absolute;top:18%;width:27%;height:62%;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:.4s}
.player-zone.left{left:3%}.player-zone.right{right:3%}
.player-label{font-size:12px;font-weight:900;margin-top:10px;background:#0007;padding:5px 9px;border-radius:99px}
.celebrate{animation:celebrate .75s ease}
@keyframes celebrate{0%,100%{transform:scale(1)}35%{transform:scale(1.15) rotate(-3deg)}70%{transform:scale(1.08) rotate(3deg)}}
.spinner-wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:190px;height:190px;z-index:4}
.spinner{width:100%;height:100%;border-radius:50%;background:conic-gradient(var(--blue) 0 45deg,var(--red) 45deg 90deg,var(--blue) 90deg 135deg,var(--red) 135deg 180deg,var(--blue) 180deg 225deg,var(--red) 225deg 270deg,var(--blue) 270deg 315deg,var(--red) 315deg 360deg);border:10px solid #07110d;box-shadow:0 0 0 3px #fff5,0 0 45px #0009;transition:transform 4s cubic-bezier(.1,.75,.1,1);position:relative}
.spinner:after{content:"";position:absolute;inset:32%;border-radius:50%;background:#0a1811;border:4px solid #fff;box-shadow:inset 0 0 18px #000}
.arrow{position:absolute;z-index:7;left:50%;top:-21px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:32px solid var(--gold);filter:drop-shadow(0 4px 4px #000); }
.spin-center{position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:1000;letter-spacing:1px;pointer-events:none}
.controls{display:flex;gap:10px;justify-content:center;margin:14px 0}
button{border:0;border-radius:14px;padding:13px 22px;font-weight:900;cursor:pointer;color:#06100b;background:linear-gradient(135deg,#ffe477,#ffb928);box-shadow:0 7px 20px #0006;font-size:14px}
button.secondary{background:#ffffff12;color:#fff;border:1px solid #fff2}
button:disabled{opacity:.45;cursor:not-allowed}
.status{text-align:center;min-height:27px;color:#dff6ea;font-weight:800;font-size:14px}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.mini{padding:10px;text-align:center}.mini b{display:block;font-size:18px}.mini span{font-size:10px;color:#9db4aa;text-transform:uppercase}
.pulse{animation:pulse .5s ease infinite alternate}@keyframes pulse{to{box-shadow:0 0 35px #ffd54a}}
.confetti{position:absolute;width:8px;height:15px;top:45%;left:50%;pointer-events:none;animation:fall 1.1s linear forwards}
@keyframes fall{to{transform:translate(var(--x),var(--y)) rotate(720deg);opacity:0}}
.note{font-size:10px;color:#789087;text-align:center;margin-top:10px}
@media(max-width:650px){
 .topbar{margin-bottom:5px}.brand{font-size:13px;white-space:nowrap}.badge{display:none}.scoreboard{grid-template-columns:minmax(0,1fr) 38px minmax(0,1fr);gap:5px}.player-card{padding:6px}.avatar{height:72px}.real-avatar{height:72px}.real-avatar img{width:58px}
 .name{font-size:12px}.role{font-size:8px}.score{font-size:34px}.vs{font-size:17px}.field{height:52dvh;min-height:0}
 .player-zone{width:24%;top:25%}.player-zone .real-avatar{height:118px}.player-zone .real-avatar img{width:82px;height:118px}
 .spinner-wrap{width:min(46vw,170px);height:min(46vw,170px)}.goal{display:none}.mini-grid{grid-template-columns:1fr 1fr 1fr}.mini{padding:7px}
}
</style>
</head>
<body>
<div class="game">
  <div class="topbar">
    <div class="brand">⚽ FOOTBALL SPIN DUEL</div>
    <div class="badge">NEUTRAL • RANDOM • 1 SPIN / ROUND</div>
  </div>

  <section class="scoreboard">
    <div class="card player-card ronaldo" id="cardR">
      <div class="real-avatar"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Cristiano_Ronaldo_playing_for_Al-Nassr_FC_against_Persepolis,_September_2023_(cropped).jpg" alt="Cristiano Ronaldo"></div>
      <div class="name">RONALDO</div><div class="role">Player A</div><div class="score" id="scoreR">0</div>
    </div>
    <div class="card vs"><div>VS</div><div class="round" id="round">ROUND 1</div></div>
    <div class="card player-card messi" id="cardM">
      <div class="real-avatar"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Lionel_Messi_2025.jpg" alt="Lionel Messi"></div>
      <div class="name">MESSI</div><div class="role">Player B</div><div class="score" id="scoreM">0</div>
    </div>
  </section>

  <section class="field" id="field">
    <div class="field-lines"></div><div class="centerline"></div><div class="circle"></div><div class="center-dot"></div>
    <div class="goal left"></div><div class="goal right"></div>
    <div class="player-zone left" id="zoneR"><div class="real-avatar"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Cristiano_Ronaldo_playing_for_Al-Nassr_FC_against_Persepolis,_September_2023_(cropped).jpg" alt="Cristiano Ronaldo"></div><div class="player-label">RONALDO</div></div>
    <div class="player-zone right" id="zoneM"><div class="real-avatar"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Lionel_Messi_2025.jpg" alt="Lionel Messi"></div><div class="player-label">MESSI</div></div></div>

    <div class="spinner-wrap">
      <div class="arrow"></div>
      <div class="spinner" id="spinner"></div>
      <div class="spin-center">SPIN</div>
    </div>
  </section>

  <div class="status" id="status">AUTO SPINNING…</div>
  <div class="controls">
    <button id="spinBtn">🎯 SPIN</button>
    <button class="secondary" id="soundBtn">🔊 SOUND</button>
    <button class="secondary" id="resetBtn">↻ RESET</button>
  </div>

  <div class="mini-grid">
    <div class="card mini"><b id="total">0</b><span>Total Rounds</span></div>
    <div class="card mini"><b id="last">—</b><span>Last Winner</span></div>
    <div class="card mini"><b id="streak">0</b><span>Streak</span></div>
  </div>
  <div class="note">Neutral random draw • Auto-play • 9:16 vertical</div>
</div>

<script>
(() => {
  const spinner = document.getElementById('spinner');
  const spinBtn = document.getElementById('spinBtn');
  const soundBtn = document.getElementById('soundBtn');
  const resetBtn = document.getElementById('resetBtn');
  const status = document.getElementById('status');
  const scoreR = document.getElementById('scoreR'), scoreM = document.getElementById('scoreM');
  const roundEl = document.getElementById('round'), totalEl = document.getElementById('total');
  const lastEl = document.getElementById('last'), streakEl = document.getElementById('streak');
  const cardR = document.getElementById('cardR'), cardM = document.getElementById('cardM');
  const zoneR = document.getElementById('zoneR'), zoneM = document.getElementById('zoneM');
  let r=0,m=0,round=1,turns=0,streak=0,last='',rotation=0,sound=true,locked=false;

  let ctx, musicTimer=null;
  function audio(){
    if(!sound) return;
    ctx ||= new (window.AudioContext || window.webkitAudioContext)();
    if(ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq,dur,type='sine',gain=.035,delay=0){
    if(!sound) return;
    const c=audio(), o=c.createOscillator(), g=c.createGain();
    o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0,c.currentTime+delay);
    g.gain.linearRampToValueAtTime(gain,c.currentTime+delay+.01);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+delay+dur);
    o.connect(g);g.connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+dur+.02);
  }
  function tick(){tone(850,.035,'square',.018)}
  function startMusic(){
    if(!sound || musicTimer) return;
    audio();
    const notes=[196,220,247,294,330,294,247,220];
    let i=0;
    musicTimer=setInterval(()=>{tone(notes[i++%notes.length],.42,'sine',.012);},360);
  }
  function winSound(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'sine',.05,i*.07))}
  function speak(text){
    if(!sound || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const voices=speechSynthesis.getVoices();
    const v=voices.find(x=>/female|zira|samantha|google uk english female|google us english/i.test(x.name)) || voices.find(x=>/^en/i.test(x.lang));
    if(v) u.voice=v;
    u.rate=.95;u.pitch=1.12;u.volume=.85;
    speechSynthesis.speak(u);
  }
  function confetti(){
    const f=document.getElementById('field');
    for(let i=0;i<42;i++){
      const e=document.createElement('i');e.className='confetti';
      e.style.setProperty('--x',(Math.random()*520-260)+'px');
      e.style.setProperty('--y',(Math.random()*340+100)+'px');
      e.style.background=`hsl(${Math.random()*360},85%,65%)`;
      e.style.transform=`rotate(${Math.random()*360}deg)`;
      f.appendChild(e);setTimeout(()=>e.remove(),1200);
    }
  }
  function setActive(w){
    cardR.classList.toggle('active',w==='RONALDO');cardM.classList.toggle('active',w==='MESSI');
    zoneR.classList.remove('celebrate');zoneM.classList.remove('celebrate');
    (w==='RONALDO'?zoneR:zoneM).classList.add('celebrate');
  }
  function spin(){
    if(locked) return;
    locked=true;spinBtn.disabled=true;cardR.classList.remove('active');cardM.classList.remove('active');
    status.textContent='Spinning… the result is randomized.';
    speak('Round '+round+'. The wheel is spinning. Let the neutral draw decide.');
    const sector=Math.floor(Math.random()*8);
    const winner=(sector%2===0)?'RONALDO':'MESSI';
    const sectorCenter=22.5+sector*45;
    const target=(360-sectorCenter)%360;
    const extra=360*(5+Math.floor(Math.random()*3));
    const delta=(target-(rotation%360)+360)%360;
    rotation += extra+delta;
    spinner.style.transform=`rotate(${rotation}deg)`;

    let n=0; const timer=setInterval(()=>{tick(); if(++n>=24)clearInterval(timer)},155);

    setTimeout(()=>{
      if(winner==='RONALDO') r++; else m++;
      turns++; round++;
      if(last===winner) streak++; else streak=1;
      last=winner;
      scoreR.textContent=r;scoreM.textContent=m;totalEl.textContent=turns;lastEl.textContent=winner;streakEl.textContent=streak;roundEl.textContent='ROUND '+round;
      setActive(winner);confetti();winSound();
      status.innerHTML=`🏆 <strong>${winner}</strong> gets the point — random draw complete!`;
      speak(winner+' gets the point. New round coming up.');
      locked=false;spinBtn.disabled=false;
      setTimeout(()=>{ if(!locked) spin(); },1800);
    },4200);
  }
  function reset(){
    r=m=turns=streak=0;round=1;last='';rotation=0;spinner.style.transform='rotate(0deg)';
    scoreR.textContent=scoreM.textContent=totalEl.textContent='0';lastEl.textContent='—';streakEl.textContent='0';roundEl.textContent='ROUND 1';
    cardR.classList.remove('active');cardM.classList.remove('active');
    status.textContent='Press SPIN to start the neutral draw.';
    if('speechSynthesis' in window) speechSynthesis.cancel();
  }
  spinBtn.addEventListener('click',()=>{startMusic();spin()});
  // Visual autoplay. Browsers may require a first tap before WebAudio/speech can play.
  setTimeout(()=>{ if(!locked) { startMusic(); spin(); } },1200);
  resetBtn.addEventListener('click',()=>{tone(300,.08);reset();setTimeout(()=>spin(),900)});
  soundBtn.addEventListener('click',()=>{
    sound=!sound;soundBtn.textContent=sound?'🔊 SOUND ON':'🔇 SOUND OFF';
    if(sound){tone(660,.1);speak('Sound on');}
    else if('speechSynthesis' in window) speechSynthesis.cancel();
  });
  if('speechSynthesis' in window) speechSynthesis.onvoiceschanged=()=>{};
})();
</script>
</body>
</html>
