<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080b12"><title>RONALDO vs MESSI — Gravity Battle</title><style>*{box-sizing:border-box}html,body{margin:0;background:#08090c;font-family:Arial,sans-serif}body{display:flex;justify-content:center}.game{position:relative;width:min(100vw,560px);height:100vh;max-height:1000px;overflow:hidden;background:#f5f5f4;color:#111}.top{height:5.5%;display:flex;align-items:center;justify-content:center;font-size:clamp(17px,5vw,28px);font-weight:1000}.vs{position:absolute;z-index:20;top:1.3%;left:50%;transform:translateX(-50%);background:#111;color:#fff;border:3px solid #fff;border-radius:50%;padding:9px 7px;font-weight:1000}.live{position:absolute;right:9px;top:9px;z-index:21;background:#e32335;color:#fff;border-radius:12px;padding:5px 8px;font-size:10px;font-weight:900}.players{height:23%;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:0 4px}.p{position:relative;text-align:center;overflow:hidden;padding-top:3px;font-weight:1000}.p.r{background:linear-gradient(160deg,#ef2b79,#d81367)}.p.m{background:linear-gradient(160deg,#ffd629,#f0ad00)}.pic{width:min(29vw,155px);height:min(29vw,155px);min-width:78px;min-height:78px;border-radius:50%;object-fit:cover;background:#fff;border:5px solid #fff;box-shadow:0 5px 18px #0004}.name{font-size:clamp(14px,4vw,22px);margin-top:2px;color:#fff;text-shadow:0 2px 3px #0005}.pill{display:inline-block;margin-top:3px;border-radius:16px;padding:5px 12px;background:#111d;color:#fff;font-size:10px;font-weight:900}.scores{height:14%;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:0 5px}.box{display:flex;align-items:center;justify-content:center;position:relative}.box.r{background:#ed2472}.box.m{background:#f4c21b}.num{font-size:clamp(48px,15vw,88px);font-weight:1000;color:#fff;line-height:1;text-shadow:0 3px 4px #0003}.num.m{color:#111}.num.bump{animation:bump .22s ease}@keyframes bump{50%{transform:scale(1.2)}}.tag{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:900;background:#111b;color:#fff;padding:3px 8px;border-radius:9px}.arena{position:absolute;top:42.5%;left:0;right:0;bottom:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#fff 0,#f7f7f6 43%,#d5d5d2 78%,#aaa 100%)}.arena:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 54%,transparent 0 47%,#0001 67%,#0004 100%);pointer-events:none}.rim{position:absolute;left:-8%;right:-8%;bottom:-16%;height:82%;border:12px solid #d0d0cc;border-radius:50% 50% 0 0/18% 18% 0 0;box-shadow:inset 0 15px 30px #0002,0 -5px 18px #0002;pointer-events:none}.hole{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:clamp(82px,20vw,120px);height:clamp(82px,20vw,120px);border-radius:50%;background:radial-gradient(circle at 42% 38%,#333 0,#090909 40%,#000 67%,#000 100%);box-shadow:0 8px 18px #0007,inset 0 7px 13px #fff1,inset 0 -12px 22px #000;z-index:2}.hole:after{content:"";position:absolute;inset:12%;border-radius:50%;border:2px solid #fff1;box-shadow:inset 0 0 14px #000}.ball{position:absolute;width:clamp(48px,11.5vw,72px);height:clamp(48px,11.5vw,72px);border-radius:50%;z-index:6;will-change:transform,left,top;box-shadow:inset -9px -11px 14px #0004,inset 7px 6px 10px #fff9,0 9px 10px #0005}.ball:after{content:"";position:absolute;width:35%;height:25%;left:18%;top:13%;border-radius:50%;background:#fff9;filter:blur(3px)}.rb{background:radial-gradient(circle at 35% 30%,#ff70ad 0,#ff2c84 38%,#df075d 72%,#a90048 100%)}.mb{background:radial-gradient(circle at 35% 30%,#fff56a 0,#ffe41b 38%,#f0b800 72%,#c78600 100%)}.shadow{position:absolute;width:65px;height:20px;border-radius:50%;background:#0004;filter:blur(8px);z-index:1}.flash{position:absolute;left:50%;top:48%;width:100px;height:100px;border:4px solid #fff;border-radius:50%;opacity:0;z-index:9}.flash.on{animation:pop .45s ease-out}@keyframes pop{from{transform:translate(-50%,-50%) scale(.2);opacity:.9}to{transform:translate(-50%,-50%) scale(1.8);opacity:0}}.msg{position:absolute;left:50%;top:7%;transform:translateX(-50%);z-index:25;background:#111e;color:#fff;border-radius:18px;padding:7px 13px;font-size:12px;font-weight:900;opacity:0;white-space:nowrap}.msg.on{animation:msg .8s ease}@keyframes msg{20%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,8px)}}.credit{position:absolute;bottom:4px;left:0;right:0;text-align:center;color:#fff9;font-size:8px;text-shadow:0 1px 2px #000;z-index:30}</style></head><body><main class="game"><div class="top">MESSI <span style="margin:0 10px">VS</span> RONALDO</div><div class="vs">VS</div><div class="live">● LIVE</div><section class="players"><div class="p r"><img class="pic" alt="Messi" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Lionel_Messi_NYCFC_Miami_24_Sep_2025-096.jpg"><div class="name">MESSI</div><span class="pill">⚽ GOAL</span></div><div class="p m"><img class="pic" alt="Ronaldo" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Cristiano_Ronaldo_2275_(cropped).jpg"><div class="name">RONALDO</div><span class="pill">⚽ GOAL</span></div></section><section class="scores"><div class="box r"><div id="ms" class="num">0</div><div class="tag">AUTO PLAY</div></div><div class="box m"><div id="rs" class="num m">0</div><div class="tag">AUTO PLAY</div></div></section><section id="arena" class="arena"><div class="rim"></div><div class="hole"></div><div id="msd" class="shadow"></div><div id="rsd" class="shadow"></div><div id="mb" class="ball rb"></div><div id="rb" class="ball mb"></div><div id="flash" class="flash"></div><div id="msg" class="msg"></div></section><div class="credit">Black circle = centre of gravity • Auto physics battle</div></main><script>(()=>{const A=document.getElementById('arena'),M=document.getElementById('mb'),R=document.getElementById('rb'),MS=document.getElementById('ms'),RS=document.getElementById('rs'),MSD=document.getElementById('msd'),RSD=document.getElementById('rsd'),F=document.getElementById('flash'),MSG=document.getElementById('msg');let score={m:0,r:0},q,last=performance.now();const C=()=>({x:A.clientWidth/2,y:A.clientHeight*.48});function make(side){let c=C(),spread=Math.min(A.clientWidth*.43,230),x=c.x+(side==='m'?-spread:spread),y=16;let dx=c.x-x,dy=c.y-y,d=Math.hypot(dx,dy),speed=255;return{x,y,vx:dx/d*speed,vy:-145,side,spin:0}}function start(){q={m:make('m'),r:make('r'),done:false}}function draw(e,p){e.style.left=p.x+'px';e.style.top=p.y+'px';e.style.transform='translate(-50%,-50%) rotate('+p.spin+'rad)'}function shadow(e,p){e.style.left=p.x+'px';e.style.top=(p.y+12)+'px';e.style.transform='translate(-50%,-50%)'}function goal(side){if(q.done)return;q.done=true;score[side]++;let n=side==='m'?MS:RS;n.textContent=score[side];n.classList.remove('bump');void n.offsetWidth;n.classList.add('bump');MSG.textContent='⚽ '+(side==='m'?'MESSI':'RONALDO')+' SCORES!';MSG.classList.remove('on');void MSG.offsetWidth;MSG.classList.add('on');F.classList.remove('on');void F.offsetWidth;F.classList.add('on');setTimeout(start,700)}function frame(t){let dt=Math.min(.02,(t-last)/1000);last=t;if(q&&!q.done){let w=A.clientWidth,h=A.clientHeight,c=C(),goalR=Math.min(w*.09,56),a=q.m,b=q.r;[a,b].forEach(p=>{/* The black circle is the sole gravity source. */let dx=c.x-p.x,dy=c.y-p.y,r2=dx*dx+dy*dy,r=Math.sqrt(r2)||1;let G=390000,soft=420;let accel=G/(r2+soft);p.vx+=(dx/r)*accel*dt;p.vy+=(dy/r)*accel*dt;p.vx*=Math.pow(.9985,dt*60);p.vy*=Math.pow(.9985,dt*60);p.x+=p.vx*dt;p.y+=p.vy*dt;p.spin+=Math.hypot(p.vx,p.vy)*dt/.075;if(p.y>h-34){p.y=h-34;p.vy=-Math.abs(p.vy)*.64;p.vx*=.9}if(p.y<24){p.y=24;p.vy=Math.abs(p.vy)*.72}if(p.x<24){p.x=24;p.vx=Math.abs(p.vx)*.72}if(p.x>w-24){p.x=w-24;p.vx=-Math.abs(p.vx)*.72}});let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,min=Math.max(50,w*.105);if(d<min){let nx=dx/d,ny=dy/d,rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){let j=-rv*.95;a.vx-=j*nx;a.vy-=j*ny;b.vx+=j*nx;b.vy+=j*ny}let push=(min-d)/2;a.x-=nx*push;a.y-=ny*push;b.x+=nx*push;b.y+=ny*push}if(Math.hypot(a.x-c.x,a.y-c.y)<goalR)goal('m');if(Math.hypot(b.x-c.x,b.y-c.y)<goalR)goal('r');draw(M,a);draw(R,b);shadow(MSD,a);shadow(RSD,b)}requestAnimationFrame(frame)}start();requestAnimationFrame(frame)})();</script></body></html>
