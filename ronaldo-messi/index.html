<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307111f'/%3E%3Ccircle cx='22' cy='32' r='14' fill='%23ff3458'/%3E%3Ccircle cx='42' cy='32' r='14' fill='%2321d4ff'/%3E%3Cpath d='M22 18v28M42 18v28' stroke='white' stroke-width='5'/%3E%3C/svg%3E">
  <title>Ronaldo vs Messi Live Arena</title>
  <style>
    *{box-sizing:border-box}
    :root{
      --ronaldo:#ff3458;
      --messi:#21d4ff;
      --gold:#ffd84d;
      --ink:#06101d;
      --panel:rgba(7,17,31,.72);
      --line:rgba(255,255,255,.22);
    }
    html,body{height:100%;margin:0}
    body{
      display:grid;
      place-items:center;
      overflow:hidden;
      background:#02060c;
      color:#fff;
      font-family:Inter,Arial,Helvetica,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button{font:inherit}
    .game{
      position:relative;
      width:min(100vw,540px);
      height:min(100vh,960px);
      aspect-ratio:9/16;
      overflow:hidden;
      isolation:isolate;
      background:
        radial-gradient(circle at 50% 18%,rgba(255,216,77,.26),transparent 18%),
        linear-gradient(180deg,#091321 0%,#0a1830 22%,#0d3d3b 55%,#0b261b 100%);
      box-shadow:0 0 0 1px rgba(255,255,255,.12),0 30px 70px rgba(0,0,0,.7);
    }
    .game:before{
      content:"";
      position:absolute;
      inset:0;
      z-index:-2;
      background:
        linear-gradient(90deg,transparent 0 8%,rgba(255,255,255,.055) 8.2% 8.6%,transparent 8.8% 91.2%,rgba(255,255,255,.055) 91.4% 91.8%,transparent 92%),
        repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 34px);
      opacity:.9;
    }
    .game:after{
      content:"";
      position:absolute;
      inset:0;
      z-index:20;
      pointer-events:none;
      background:linear-gradient(180deg,rgba(0,0,0,.36),transparent 18%,transparent 72%,rgba(0,0,0,.44));
    }
    .hud{
      position:absolute;
      inset:0;
      z-index:7;
      display:grid;
      grid-template-rows:9.5% 20% 1fr 16%;
      pointer-events:none;
    }
    .bar{
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:8px;
      padding:10px 12px 4px;
    }
    .brand{
      justify-self:start;
      font-weight:1000;
      font-size:clamp(16px,4.3vw,24px);
      line-height:.95;
      text-transform:uppercase;
      text-shadow:0 3px 12px rgba(0,0,0,.65);
    }
    .brand span{display:block;color:var(--gold)}
    .live{
      justify-self:end;
      display:flex;
      align-items:center;
      gap:6px;
      min-width:76px;
      justify-content:center;
      border:1px solid rgba(255,255,255,.45);
      border-radius:999px;
      background:rgba(255,52,88,.88);
      padding:7px 10px;
      font-size:12px;
      font-weight:1000;
      letter-spacing:.08em;
      box-shadow:0 0 24px rgba(255,52,88,.55);
    }
    .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1s infinite}
    @keyframes blink{50%{opacity:.35}}
    .round{
      min-width:88px;
      text-align:center;
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--panel);
      padding:6px 10px;
      box-shadow:0 8px 24px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.16);
    }
    .round small{display:block;color:#a9d9ff;font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
    .round strong{display:block;margin-top:1px;font-size:18px}
    .players{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      padding:4px 12px;
    }
    .player{
      position:relative;
      display:grid;
      grid-template-rows:auto auto auto;
      justify-items:center;
      align-content:start;
      min-width:0;
      border:1px solid var(--line);
      border-radius:8px;
      background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));
      box-shadow:0 14px 32px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.18);
      overflow:hidden;
      padding:8px 8px 10px;
    }
    .player:before{
      content:"";
      position:absolute;
      inset:0;
      background:radial-gradient(circle at 50% 0,var(--accent),transparent 48%);
      opacity:.34;
      pointer-events:none;
    }
    .avatar{
      position:relative;
      width:clamp(72px,22vw,122px);
      aspect-ratio:1;
      border-radius:50%;
      overflow:hidden;
      border:4px solid #fff;
      background:#111;
      box-shadow:0 0 0 4px var(--accent),0 0 30px color-mix(in srgb,var(--accent),transparent 36%);
    }
    .avatar img{width:100%;height:100%;object-fit:cover}
    .name{
      position:relative;
      margin-top:7px;
      max-width:100%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:clamp(15px,4.2vw,23px);
      font-weight:1000;
      text-transform:uppercase;
      text-shadow:0 2px 8px rgba(0,0,0,.8);
    }
    .score{
      position:relative;
      font-size:clamp(44px,12vw,74px);
      line-height:.9;
      font-weight:1000;
      color:#fff;
      text-shadow:0 4px 0 rgba(0,0,0,.3),0 0 22px var(--accent);
    }
    .meter{
      position:relative;
      width:100%;
      height:9px;
      margin-top:8px;
      border-radius:99px;
      overflow:hidden;
      background:rgba(255,255,255,.18);
      border:1px solid rgba(255,255,255,.22);
    }
    .meter span{
      display:block;
      height:100%;
      width:50%;
      border-radius:inherit;
      background:linear-gradient(90deg,#fff,var(--accent));
      box-shadow:0 0 18px var(--accent);
      transition:width .4s ease;
    }
    .center-banner{
      position:absolute;
      left:50%;
      top:29%;
      z-index:9;
      transform:translate(-50%,-50%);
      display:grid;
      gap:4px;
      justify-items:center;
      width:min(88%,420px);
      text-align:center;
      pointer-events:none;
    }
    .headline{
      min-height:34px;
      border:1px solid rgba(255,255,255,.34);
      border-radius:999px;
      background:rgba(6,16,29,.82);
      padding:9px 16px;
      font-size:clamp(13px,3.4vw,18px);
      font-weight:1000;
      text-transform:uppercase;
      box-shadow:0 12px 30px rgba(0,0,0,.36);
    }
    .subline{display:none}
    .arena{
      position:absolute;
      left:0;
      right:0;
      top:29%;
      bottom:14%;
      z-index:1;
      overflow:hidden;
      perspective:900px;
    }
    .stands{
      position:absolute;
      left:-8%;
      right:-8%;
      top:0;
      height:29%;
      background:
        radial-gradient(circle at 13% 38%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 47% 26%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 76% 42%,#fff 0 1px,transparent 2px),
        repeating-linear-gradient(90deg,#173a5f 0 20px,#0e2746 20px 40px);
      opacity:.72;
      clip-path:polygon(0 0,100% 0,92% 100%,8% 100%);
    }
    .pitch{
      position:absolute;
      left:-22%;
      right:-22%;
      bottom:-18%;
      height:78%;
      transform:rotateX(57deg);
      transform-origin:bottom;
      background:
        linear-gradient(90deg,transparent 49.65%,rgba(255,255,255,.75) 49.8% 50.2%,transparent 50.35%),
        radial-gradient(ellipse at 50% 44%,transparent 0 18%,rgba(255,255,255,.7) 18.2% 18.8%,transparent 19%),
        repeating-linear-gradient(90deg,rgba(36,185,99,.92) 0 56px,rgba(22,151,82,.92) 56px 112px);
      border-top:5px solid rgba(255,255,255,.7);
      box-shadow:inset 0 0 0 5px rgba(255,255,255,.42),0 -16px 42px rgba(0,0,0,.38);
    }
    .goal{
      position:absolute;
      left:50%;
      top:43%;
      transform:translate(-50%,-50%);
      width:clamp(116px,31vw,172px);
      height:clamp(96px,25vw,144px);
      border:6px solid #fff;
      border-bottom-width:9px;
      border-radius:14px 14px 4px 4px;
      background:
        linear-gradient(90deg,transparent 0 47%,rgba(255,255,255,.42) 47.5% 52.5%,transparent 53%),
        repeating-linear-gradient(0deg,rgba(255,255,255,.2) 0 2px,transparent 2px 14px),
        repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 2px,transparent 2px 16px),
        rgba(0,0,0,.22);
      box-shadow:0 0 35px rgba(255,255,255,.38),inset 0 0 34px rgba(0,0,0,.45);
    }
    .goal:before{
      content:"TARGET";
      position:absolute;
      left:50%;
      top:-28px;
      transform:translateX(-50%);
      color:var(--gold);
      font-size:10px;
      font-weight:1000;
      letter-spacing:.18em;
      text-shadow:0 2px 10px #000;
    }
    .ball{
      position:absolute;
      z-index:5;
      width:clamp(44px,10.5vw,62px);
      aspect-ratio:1;
      border-radius:50%;
      display:grid;
      place-items:center;
      color:#fff;
      font-size:clamp(19px,5vw,29px);
      font-weight:1000;
      border:3px solid #fff;
      transform:translate(-50%,-50%);
      box-shadow:0 12px 16px rgba(0,0,0,.5),0 0 30px var(--accent);
      will-change:transform,left,top;
    }
    .ball:before{
      content:"";
      position:absolute;
      inset:7px;
      border-radius:50%;
      border:2px dashed rgba(255,255,255,.78);
    }
    .ball.r{background:radial-gradient(circle at 30% 25%,#ff9aa9,var(--ronaldo) 45%,#8b0e26)}
    .ball.m{background:radial-gradient(circle at 30% 25%,#d3f5ff,var(--messi) 45%,#07528f)}
    .shadow{
      position:absolute;
      z-index:2;
      width:58px;
      height:18px;
      border-radius:50%;
      background:rgba(0,0,0,.45);
      filter:blur(7px);
      transform:translate(-50%,-50%);
    }
    .particle{
      position:absolute;
      z-index:10;
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--c);
      box-shadow:0 0 12px var(--c);
      animation:burst .75s ease-out forwards;
    }
    @keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
    .big-text{
      position:absolute;
      left:50%;
      top:48%;
      z-index:13;
      transform:translate(-50%,-50%) scale(.84);
      opacity:0;
      width:100%;
      text-align:center;
      color:#fff;
      font-size:clamp(54px,16vw,96px);
      line-height:.85;
      font-weight:1000;
      text-transform:uppercase;
      text-shadow:0 5px 0 rgba(0,0,0,.3),0 0 38px var(--gold);
      pointer-events:none;
    }
    .big-text.show{animation:goalText 1.05s ease both}
    @keyframes goalText{
      18%,78%{opacity:1;transform:translate(-50%,-50%) scale(1)}
      100%{opacity:0;transform:translate(-50%,-50%) scale(1.18)}
    }
    .countdown{
      position:absolute;
      left:50%;
      top:50%;
      z-index:14;
      transform:translate(-50%,-50%);
      width:116px;
      height:116px;
      display:grid;
      place-items:center;
      border-radius:50%;
      border:4px solid #fff;
      background:rgba(6,16,29,.82);
      font-size:56px;
      font-weight:1000;
      opacity:0;
      pointer-events:none;
      box-shadow:0 0 40px rgba(255,216,77,.42),inset 0 1px rgba(255,255,255,.18);
    }
    .countdown.show{animation:countPop .7s ease both}
    @keyframes countPop{
      0%{opacity:0;transform:translate(-50%,-50%) scale(.65)}
      25%,80%{opacity:1;transform:translate(-50%,-50%) scale(1)}
      100%{opacity:0;transform:translate(-50%,-50%) scale(1.18)}
    }
    .lower{
      align-self:end;
      display:grid;
      gap:8px;
      padding:0 12px 12px;
    }
    .stats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }
    .stat{
      min-width:0;
      border:1px solid var(--line);
      border-radius:8px;
      background:rgba(6,16,29,.78);
      padding:8px 6px;
      text-align:center;
      box-shadow:0 8px 24px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.12);
    }
    .stat small{
      display:block;
      color:#acd9ff;
      font-size:9px;
      font-weight:900;
      letter-spacing:.1em;
      text-transform:uppercase;
      white-space:nowrap;
    }
    .stat strong{display:block;margin-top:2px;font-size:clamp(15px,4vw,22px);font-weight:1000}
    .ticker{
      min-height:36px;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid rgba(255,255,255,.24);
      border-radius:8px;
      background:rgba(255,255,255,.1);
      padding:8px 12px;
      color:#fff;
      font-size:clamp(12px,3.2vw,15px);
      font-weight:900;
      text-align:center;
      text-shadow:0 2px 10px #000;
    }
    .controls{
      position:absolute;
      left:12px;
      right:12px;
      bottom:12px;
      z-index:30;
      display:grid;
      grid-template-columns:1fr auto auto;
      gap:8px;
      pointer-events:auto;
      opacity:1;
      transform:translateY(0);
      transition:opacity .28s ease,transform .28s ease;
    }
    .game.live-mode .controls{
      opacity:0;
      transform:translateY(16px);
      pointer-events:none;
    }
    .game.live-mode.show-controls .controls,
    .game.live-mode:focus-within .controls{
      opacity:1;
      transform:translateY(0);
      pointer-events:auto;
    }
    .btn{
      min-height:46px;
      border:1px solid rgba(255,255,255,.38);
      border-radius:8px;
      color:#fff;
      background:rgba(6,16,29,.86);
      font-size:13px;
      font-weight:1000;
      text-transform:uppercase;
      box-shadow:0 10px 28px rgba(0,0,0,.32),inset 0 1px rgba(255,255,255,.16);
      cursor:pointer;
    }
    .btn.primary{
      background:linear-gradient(135deg,var(--ronaldo),#8a5cff 48%,var(--messi));
      box-shadow:0 0 30px rgba(33,212,255,.22),0 12px 32px rgba(0,0,0,.35);
    }
    .btn.icon{width:50px;font-size:18px}
    .btn:active{transform:translateY(1px)}
    .overlay{
      position:absolute;
      inset:0;
      z-index:40;
      display:grid;
      place-items:center;
      padding:24px;
      background:linear-gradient(180deg,rgba(2,6,12,.52),rgba(2,6,12,.84));
      text-align:center;
    }
    .start-card{
      width:min(100%,390px);
      border:1px solid rgba(255,255,255,.28);
      border-radius:8px;
      background:rgba(7,17,31,.83);
      padding:22px;
      box-shadow:0 30px 70px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.14);
    }
    .start-card h1{
      margin:0;
      font-size:clamp(38px,11vw,64px);
      line-height:.86;
      text-transform:uppercase;
      letter-spacing:0;
      text-shadow:0 5px 0 rgba(0,0,0,.24),0 0 32px rgba(255,216,77,.5);
    }
    .start-card p{
      margin:14px 0 18px;
      color:#d7f2ff;
      font-size:14px;
      line-height:1.45;
      font-weight:800;
    }
    .hidden{display:none}
    @media (max-height:720px){
      .hud{grid-template-rows:8.5% 18% 1fr 15%}
      .arena{top:27%;bottom:13%}
      .controls{bottom:8px}
      .btn{min-height:40px}
    }
  </style>
</head>
<body>
  <main class="game" aria-label="Ronaldo vs Messi vertical live game">
    <section class="hud" aria-hidden="true">
      <div class="bar">
        <div class="brand">Ronaldo <span>vs Messi</span></div>
        <div class="round"><small>Round</small><strong id="round">1</strong></div>
        <div class="live"><span class="dot"></span>LIVE</div>
      </div>
      <div class="players">
        <article class="player" style="--accent:var(--ronaldo)">
          <div class="avatar"><img alt="" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Cristiano_Ronaldo_2275_(cropped).jpg"></div>
          <div class="name">Ronaldo</div>
          <div id="rScore" class="score">0</div>
          <div class="meter"><span id="rMeter"></span></div>
        </article>
        <article class="player" style="--accent:var(--messi)">
          <div class="avatar"><img alt="" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Lionel_Messi_NYCFC_Miami_24_Sep_2025-096.jpg"></div>
          <div class="name">Messi</div>
          <div id="mScore" class="score">0</div>
          <div class="meter"><span id="mMeter"></span></div>
        </article>
      </div>
      <div></div>
      <div class="lower">
        <div class="stats">
          <div class="stat"><small>Leader</small><strong id="leader">Even</strong></div>
          <div class="stat"><small>Streak</small><strong id="streak">0</strong></div>
          <div class="stat"><small>Heat</small><strong id="heat">50%</strong></div>
        </div>
        <div id="ticker" class="ticker">Tonight's rivalry is ready.</div>
      </div>
    </section>

    <div class="center-banner">
      <div id="headline" class="headline">First to 10 wins the stream match</div>
      <div class="subline">Live rivalry arena</div>
    </div>

    <section id="arena" class="arena" aria-hidden="true">
      <div class="stands"></div>
      <div class="pitch"></div>
      <div class="goal"></div>
      <div id="rShadow" class="shadow"></div>
      <div id="mShadow" class="shadow"></div>
      <div id="rBall" class="ball r" style="--accent:var(--ronaldo)">CR7</div>
      <div id="mBall" class="ball m" style="--accent:var(--messi)">LM</div>
    </section>

    <div id="bigText" class="big-text">GOAL</div>
    <div id="countdown" class="countdown">3</div>

    <div class="controls">
      <button id="startBtn" class="btn primary" type="button">Start Match</button>
      <button id="soundBtn" class="btn icon" type="button" aria-label="Sound">🔊</button>
      <button id="resetBtn" class="btn icon" type="button" aria-label="Reset">↻</button>
    </div>

    <div id="overlay" class="overlay">
      <div class="start-card">
        <h1>Live Arena</h1>
        <p>A fast football battle with bright score swings, momentum shifts, and big goal moments for the live crowd.</p>
        <button id="overlayStart" class="btn primary" type="button">Go Live</button>
      </div>
    </div>
  </main>

  <script>
    (() => {
      const arena = document.getElementById('arena');
      const game = document.querySelector('.game');
      const rBall = document.getElementById('rBall');
      const mBall = document.getElementById('mBall');
      const rShadow = document.getElementById('rShadow');
      const mShadow = document.getElementById('mShadow');
      const rScore = document.getElementById('rScore');
      const mScore = document.getElementById('mScore');
      const rMeter = document.getElementById('rMeter');
      const mMeter = document.getElementById('mMeter');
      const roundEl = document.getElementById('round');
      const leaderEl = document.getElementById('leader');
      const streakEl = document.getElementById('streak');
      const heatEl = document.getElementById('heat');
      const ticker = document.getElementById('ticker');
      const headline = document.getElementById('headline');
      const bigText = document.getElementById('bigText');
      const countdown = document.getElementById('countdown');
      const overlay = document.getElementById('overlay');
      const startBtn = document.getElementById('startBtn');
      const overlayStart = document.getElementById('overlayStart');
      const soundBtn = document.getElementById('soundBtn');
      const resetBtn = document.getElementById('resetBtn');

      const state = {
        started:false,
        sound:true,
        locked:false,
        round:1,
        heat:50,
        scores:{r:0,m:0},
        streak:{side:null,count:0},
        last:performance.now(),
        roundStart:0,
        q:null,
        audio:null,
        beatTimer:null,
        controlsTimer:null
      };

      const comments = {
        r:['Ronaldo launches one into the lights.','CR7 is heating up. Chat is going wild.','Ronaldo smashes it home with power.'],
        m:['Messi curls it home. Pure control.','Messi answers with magic.','That was a calm Messi finish.']
      };

      function center(){
        return {x:arena.clientWidth / 2, y:arena.clientHeight * .43};
      }

      function makeBall(side){
        const c = center();
        const lane = Math.min(arena.clientWidth * .38, 190);
        const y = arena.clientHeight * (.79 + Math.random() * .07);
        const angle = side === 'r' ? -1.36 + Math.random() * .24 : -1.78 - Math.random() * .24;
        const boost = 420 + Math.random() * 105 + state.heat * 1.1;
        return {
          x:c.x + (side === 'r' ? -lane : lane),
          y,
          vx:Math.cos(angle) * boost,
          vy:Math.sin(angle) * boost,
          spin:0
        };
      }

      function setMessage(text){
        ticker.textContent = text;
        headline.textContent = text;
      }

      function drawBall(el, p){
        el.style.left = p.x + 'px';
        el.style.top = p.y + 'px';
        el.style.transform = `translate(-50%,-50%) rotate(${p.spin}rad)`;
      }

      function drawShadow(el, p){
        el.style.left = p.x + 'px';
        el.style.top = (p.y + 18) + 'px';
      }

      function updateHud(){
        rScore.textContent = state.scores.r;
        mScore.textContent = state.scores.m;
        roundEl.textContent = state.round;
        const total = Math.max(1, state.scores.r + state.scores.m);
        const rPct = Math.max(8, Math.round((state.scores.r / total) * 100));
        const mPct = Math.max(8, Math.round((state.scores.m / total) * 100));
        rMeter.style.width = rPct + '%';
        mMeter.style.width = mPct + '%';
        leaderEl.textContent = state.scores.r === state.scores.m ? 'Even' : state.scores.r > state.scores.m ? 'CR7' : 'Messi';
        streakEl.textContent = state.streak.count ? `${state.streak.side === 'r' ? 'CR7' : 'LM'} x${state.streak.count}` : '0';
        heatEl.textContent = Math.round(state.heat) + '%';
      }

      function speak(text, onEnd){
        if (!state.sound || !('speechSynthesis' in window)) {
          if (onEnd) setTimeout(onEnd, 120);
          return;
        }
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-IN';
        u.rate = 1.03;
        u.pitch = 1.02;
        u.volume = .95;
        u.onend = () => onEnd && onEnd();
        u.onerror = () => onEnd && onEnd();
        speechSynthesis.speak(u);
      }

      function audio(){
        if (!state.audio) state.audio = new (window.AudioContext || window.webkitAudioContext)();
        state.audio.resume();
        return state.audio;
      }

      function pulse(freq, gain, duration, type='triangle'){
        if (!state.sound) return;
        const ac = audio();
        const now = ac.currentTime;
        const o = ac.createOscillator();
        const g = ac.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, now);
        g.gain.setValueAtTime(.0001, now);
        g.gain.exponentialRampToValueAtTime(gain, now + .02);
        g.gain.exponentialRampToValueAtTime(.0001, now + duration);
        o.connect(g);
        g.connect(ac.destination);
        o.start(now);
        o.stop(now + duration + .02);
      }

      function cheer(){
        if (!state.sound) return;
        pulse(164,.12,.28,'sawtooth');
        setTimeout(() => pulse(246,.08,.24,'triangle'), 80);
        setTimeout(() => pulse(329,.07,.26,'triangle'), 145);
        const ac = audio();
        const now = ac.currentTime;
        const buffer = ac.createBuffer(1, Math.floor(ac.sampleRate * .55), ac.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
        const src = ac.createBufferSource();
        const g = ac.createGain();
        g.gain.value = .06;
        src.buffer = buffer;
        src.connect(g);
        g.connect(ac.destination);
        src.start(now);
      }

      function startBeat(){
        clearTimeout(state.beatTimer);
        if (!state.sound || !state.started) return;
        let step = 0;
        const notes = [82,98,110,147,123,110,98,73];
        const loop = () => {
          if (!state.sound || !state.started) return;
          pulse(notes[step % notes.length], .025, .08, 'triangle');
          step++;
          state.beatTimer = setTimeout(loop, 285);
        };
        loop();
      }

      function particles(side){
        const c = center();
        const color = side === 'r' ? 'var(--ronaldo)' : 'var(--messi)';
        for (let i = 0; i < 28; i++) {
          const p = document.createElement('i');
          const angle = Math.random() * Math.PI * 2;
          const distance = 42 + Math.random() * 118;
          p.className = 'particle';
          p.style.left = c.x + 'px';
          p.style.top = c.y + 'px';
          p.style.setProperty('--c', color);
          p.style.setProperty('--x', Math.cos(angle) * distance + 'px');
          p.style.setProperty('--y', Math.sin(angle) * distance + 'px');
          arena.appendChild(p);
          setTimeout(() => p.remove(), 820);
        }
      }

      function flashGoal(side){
        bigText.textContent = side === 'r' ? 'CR7 GOAL' : 'MESSI GOAL';
        bigText.classList.remove('show');
        void bigText.offsetWidth;
        bigText.classList.add('show');
      }

      function updateStreak(side){
        if (state.streak.side === side) state.streak.count++;
        else state.streak = {side, count:1};
      }

      function finish(side){
        if (!state.q || state.q.done || state.locked) return;
        state.q.done = true;
        state.locked = true;
        state.scores[side]++;
        updateStreak(side);
        state.heat = Math.min(99, state.heat + 7 + state.streak.count * 2);
        updateHud();
        cheer();
        particles(side);
        flashGoal(side);
        const player = side === 'r' ? 'Ronaldo' : 'Messi';
        const text = comments[side][Math.floor(Math.random() * comments[side].length)];
        setMessage(text);
        const winner = state.scores[side] >= 10;
        const call = winner ? `${player} wins the stream match. What a final score.` : `${player} scores. ${text}`;
        speak(call, () => {
          setTimeout(() => {
            if (winner) {
              setMessage(`${player} wins! Tap reset for a rematch.`);
              state.locked = false;
              return;
            }
            state.round++;
            countdownRound();
          }, 450);
        });
      }

      function countdownRound(){
        state.locked = true;
        let n = 3;
        const tick = () => {
          countdown.textContent = n > 0 ? n : 'GO';
          countdown.classList.remove('show');
          void countdown.offsetWidth;
          countdown.classList.add('show');
          pulse(n > 0 ? 220 + n * 80 : 520, .045, .12);
          if (n-- > 0) setTimeout(tick, 720);
          else setTimeout(() => {
            state.locked = false;
            launch();
          }, 540);
        };
        tick();
      }

      function launch(){
        if (!state.started) return;
        state.heat = Math.max(35, state.heat - 3);
        state.q = {r:makeBall('r'), m:makeBall('m'), done:false};
        state.roundStart = performance.now();
        updateHud();
        setMessage('Vote in chat: CR7 or Messi?');
      }

      function physics(p, dt){
        const c = center();
        const dx = c.x - p.x;
        const dy = c.y - p.y;
        const d2 = dx * dx + dy * dy;
        const d = Math.sqrt(d2) || 1;
        const pull = 148000 / (d2 + 1800);
        p.vx += (dx / d) * pull * dt;
        p.vy += (dy / d) * pull * dt;
        p.vy += 24 * dt;
        const drag = Math.pow(.995, dt * 60);
        p.vx *= drag;
        p.vy *= drag;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.spin += Math.hypot(p.vx, p.vy) * dt * .038;
      }

      function collide(a,b){
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const d = Math.hypot(dx,dy) || 1;
        const min = Math.max(48, arena.clientWidth * .105);
        if (d >= min) return;
        const nx = dx / d;
        const ny = dy / d;
        const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rel < 0) {
          const impulse = rel * .92;
          a.vx += impulse * nx;
          a.vy += impulse * ny;
          b.vx -= impulse * nx;
          b.vy -= impulse * ny;
          state.heat = Math.min(99, state.heat + .6);
        }
        const overlap = min - d;
        a.x -= nx * overlap / 2;
        a.y -= ny * overlap / 2;
        b.x += nx * overlap / 2;
        b.y += ny * overlap / 2;
      }

      function walls(p){
        const w = arena.clientWidth;
        const h = arena.clientHeight;
        const r = Math.max(25, w * .055);
        const bounce = .72;
        if (p.x < r) { p.x = r; p.vx = Math.abs(p.vx) * bounce; }
        if (p.x > w - r) { p.x = w - r; p.vx = -Math.abs(p.vx) * bounce; }
        if (p.y < r) { p.y = r; p.vy = Math.abs(p.vy) * bounce; }
        if (p.y > h - r) { p.y = h - r; p.vy = -Math.abs(p.vy) * bounce; }
      }

      function frame(t){
        const elapsed = Math.min(.04, (t - state.last) / 1000);
        state.last = t;
        if (state.q) {
          const a = state.q.r;
          const b = state.q.m;
          const steps = Math.max(1, Math.ceil(elapsed / .006));
          const dt = elapsed / steps;
          for (let i = 0; i < steps; i++) {
            physics(a,dt);
            physics(b,dt);
            collide(a,b);
            walls(a);
            walls(b);
          }
          if (state.started && !state.q.done && !state.locked) {
            const c = center();
            const target = Math.min(arena.clientWidth * .125, 62);
            const ar = Math.hypot(a.x - c.x, a.y - c.y);
            const br = Math.hypot(b.x - c.x, b.y - c.y);
            if (ar < target || br < target) finish(ar <= br ? 'r' : 'm');
            else if (state.roundStart && t - state.roundStart > 9000) finish(ar <= br ? 'r' : 'm');
          }
          drawBall(rBall,a);
          drawBall(mBall,b);
          drawShadow(rShadow,a);
          drawShadow(mShadow,b);
        }
        requestAnimationFrame(frame);
      }

      function start(){
        if (state.started) return;
        state.started = true;
        state.locked = true;
        state.q = null;
        game.classList.add('live-mode');
        overlay.classList.add('hidden');
        startBtn.textContent = 'Running';
        revealControls();
        startBeat();
        setMessage('Match starting. Keep the arena centered on stream.');
        speak('Ronaldo versus Messi. The live arena starts now.', countdownRound);
      }

      function reset(){
        if ('speechSynthesis' in window) speechSynthesis.cancel();
        state.locked = false;
        state.round = 1;
        state.heat = 50;
        state.scores = {r:0,m:0};
        state.streak = {side:null,count:0};
        state.q = null;
        updateHud();
        setMessage('Fresh match. First to 10 wins.');
        if (state.started) countdownRound();
      }

      function toggleSound(){
        state.sound = !state.sound;
        soundBtn.textContent = state.sound ? '🔊' : '🔇';
        if (state.sound) startBeat();
        else {
          clearTimeout(state.beatTimer);
          if ('speechSynthesis' in window) speechSynthesis.cancel();
        }
      }

      function revealControls(){
        if (!state.started) return;
        game.classList.add('show-controls');
        clearTimeout(state.controlsTimer);
        state.controlsTimer = setTimeout(() => game.classList.remove('show-controls'), 2200);
      }

      startBtn.addEventListener('click', start);
      overlayStart.addEventListener('click', start);
      resetBtn.addEventListener('click', reset);
      soundBtn.addEventListener('click', toggleSound);
      game.addEventListener('pointermove', revealControls);
      game.addEventListener('pointerdown', revealControls);
      arena.addEventListener('click', () => state.started ? null : start());
      document.addEventListener('keydown', event => {
        if (event.key === ' ' && !state.started) start();
        if (event.key.toLowerCase() === 'm') toggleSound();
        if (event.key.toLowerCase() === 'r') reset();
      });
      window.addEventListener('resize', () => {
        if (!state.q) return;
        state.q.r = makeBall('r');
        state.q.m = makeBall('m');
      });
      updateHud();
      state.q = {r:makeBall('r'),m:makeBall('m'),done:false};
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
