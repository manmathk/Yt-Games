<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080b12"><title>RONALDO vs MESSI — Realistic Auto Battle</title><style>*{box-sizing:border-box}html,body{margin:0;background:#030507;font-family:Arial,sans-serif}body{display:flex;justify-content:center}.game{position:relative;width:min(100vw,560px);aspect-ratio:9/16;min-height:100vh;overflow:hidden;background:linear-gradient(#aeb5bb 0,#eef1f3 32%,#c8ced2 100%);color:#111}.top{height:7%;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,5vw,28px);font-weight:1000;letter-spacing:.5px;text-shadow:0 1px #fff}.vs{position:absolute;z-index:12;top:1.5%;left:50%;transform:translateX(-50%);background:#111;color:#fff;border:3px solid #fff;border-radius:50%;padding:11px 7px;font-weight:1000;box-shadow:0 3px 12px #0006}.live{position:absolute;right:10px;top:10px;z-index:14;background:#df2334;color:white;border-radius:12px;padding:5px 8px;font-size:10px;font-weight:900;box-shadow:0 2px 5px #0004}.players{height:20%;display:grid;grid-template-columns:1fr 1fr}.p{text-align:center;padding:2px 5px;font-weight:1000}.pic{width:min(28vw,150px);height:min(28vw,150px);min-width:82px;min-height:82px;border-radius:50%;object-fit:cover;background:#fff;border:7px solid currentColor;box-shadow:0 5px 16px #0004}.r{color:#d92738}.m{color:#206ddd}.name{font-size:clamp(14px,4vw,23px);margin-top:3px}.pill{display:inline-block;margin-top:4px;border-radius:20px;padding:6px 14px;color:#fff;font-size:clamp(10px,3vw,16px);box-shadow:0 2px 5px #0003}.red{background:#d92738}.green{background:#12ad55}.scores{height:14%;display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:0 8px}.box{background:#fff;border-radius:0 0 18px 18px;display:grid;place-items:center;position:relative;box-shadow:0 5px 14px #0002}.num{font-size:clamp(44px,12vw,82px);font-weight:1000;transition:transform .12s}.num.bump{transform:scale(1.18)}.tag{position:absolute;bottom:-24px;background:#4e555b;color:white;padding:4px 12px;border-radius:0 0 8px 8px;font-size:11px;font-weight:900}.arena{position:absolute;top:41%;left:0;right:0;bottom:0;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#ffffff 0,#edf0f2 45%,#b9c0c5 100%);perspective:650px}.arena:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.7%,#fff6 50%,transparent 50.3%),linear-gradient(#fff0 0 72%,#aeb5b9 100%);opacity:.7}.floor{position:absolute;left:-20%;right:-20%;bottom:-16%;height:55%;transform:rotateX(57deg);transform-origin:bottom;background:repeating-linear-gradient(0deg,transparent 0 45px,#ffffff38 46px 48px),repeating-linear-gradient(90deg,transparent 0 55px,#ffffff20 56px 58px);opacity:.65}.goal{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:clamp(118px,28vw,178px);height:clamp(118px,28vw,178px);border-radius:50%;background:radial-gradient(circle at 32% 25%,#3e3e3e 0,#090909 48%,#000 72%);border:6px solid #73777a;box-shadow:inset 0 10px 18px #fff2,inset 0 -12px 20px #000,0 12px 24px #0006;z-index:2}.goal:after{content:"";position:absolute;inset:9%;border-radius:50%;border:2px solid #fff1;box-shadow:inset 0 0 16px #000}.ball{position:absolute;width:clamp(44px,10.5vw,68px);height:clamp(44px,10.5vw,68px);border-radius:50%;z-index:5;background-image:url('https://commons.wikimedia.org/wiki/Special:Redirect/file/Soccerball1.png');background-size:cover;background-position:center;filter:drop-shadow(0 7px 5px #0008);will-change:transform,left,top}.ball:before{content:"";position:absolute;inset:-5px;border-radius:50%;opacity:.55;z-index:-1}.rb:before{box-shadow:0 0 16px 5px #e21d31}.mb:before{box-shadow:0 0 16px 5px #1976e8}.ball.motion:after{content:"";position:absolute;left:-30%;top:42%;width:65%;height:18%;border-radius:50%;background:currentColor;opacity:.22;filter:blur(5px)}.rb{color:#e21d31}.mb{color:#1976e8}.shadow{position:absolute;width:58px;height:18px;border-radius:50%;background:#0005;filter:blur(7px);transform:translate(-50%,-50%);z-index:1;pointer-events:none}.flash{position:absolute;left:50%;top:48%;width:100px;height:100px;border:4px solid white;border-radius:50%;opacity:0;pointer-events:none;z-index:8}.flash.on{animation:pop .55s ease-out}@keyframes pop{from{transform:translate(-50%,-50%) scale(.2);opacity:.95}to{transform:translate(-50%,-50%) scale(1.8);opacity:0}}.msg{position:absolute;left:50%;top:9%;transform:translateX(-50%);z-index:13;background:#111e;color:#fff;border:1px solid #fff4;border-radius:18px;padding:7px 13px;font-size:12px;font-weight:900;opacity:0;white-space:nowrap}.msg.on{animation:msg 1s ease}@keyframes msg{20%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,8px)}}.credit{position:absolute;bottom:5px;left:0;right:0;text-align:center;color:#fff9;font-size:8px;text-shadow:0 1px 2px #000;z-index:15}@media(max-width:360px){.pic{border-width:5px}.pill{padding:5px 10px}.box{border-radius:0 0 14px 14px}}</style></head><body><main class="game"><div class="top">RONALDO <span style="margin:0 8px">VS</span> MESSI</div><div class="vs">VS</div><div class="live">● LIVE</div><section class="players"><div class="p r"><img class="pic" alt="Cristiano Ronaldo" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Cristiano_Ronaldo_2275_(cropped).jpg"><div class="name">RONALDO</div><span class="pill red">⚽ GOAL</span></div><div class="p m"><img class="pic" alt="Lionel Messi" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Lionel_Messi_NYCFC_Miami_24_Sep_2025-096.jpg"><div class="name">MESSI</div><span class="pill green">⚽ GOAL</span></div></section><section class="scores"><div class="box"><div id="rs" class="num r">0</div><div class="tag">AUTO PLAY</div></div><div class="box"><div id="ms" class="num m">0</div><div class="tag">AUTO PLAY</div></div></section><section id="arena" class="arena"><div class="floor"></div><div class="goal"></div><div id="rsd" class="shadow"></div><div id="msd" class="shadow"></div><div id="rb" class="ball rb"></div><div id="mb" class="ball mb"></div><div id="flash" class="flash"></div><div id="msg" class="msg"></div></section><div class="credit">Ball: Wikimedia Commons, public domain • Player portraits: Wikimedia Commons</div></main><script>(()=>{const A=document.getElementById('arena'),R=document.getElementById('rb'),M=document.getElementById('mb'),RS=document.getElementById('rs'),MS=document.getElementById('ms'),RSD=document.getElementById('rsd'),MSD=document.getElementById('msd'),F=document.getElementById('flash'),MSG=document.getElementById('msg');let score={r:0,m:0},q=null,last=performance.now();const center=()=>({x:A.clientWidth/2,y:A.clientHeight*.48});const make=side=>{const c=center(),spread=Math.min(A.clientWidth*.43,240),x=c.x+(side==='r'?-spread:spread),y=c.y+(Math.random()-.5)*A.clientHeight*.12,dir=side==='r'?1:-1;return{x,y,vx:dir*(54+Math.random()*12),vy:(Math.random()-.5)*12,spin:Math.random()*6.28,phase:Math.random()*6.28,side}};const start=()=>{q={r:make('r'),m:make('m'),done:false,age:0};};const draw=(el,p)=>{el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.transform='translate(-50%,-50%) rotate('+p.spin+'rad)'};const shadow=(el,p)=>{el.style.left=p.x+'px';el.style.top=(p.y+Math.min(17,Math.max(5,p.y*.018)))+'px';el.style.transform='translate(-50%,-50%) scale('+Math.max(.65,1-p.y/A.clientHeight*.18)+')'};const bump=e=>{e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump')};const goal=side=>{if(q.done)return;q.done=true;score[side]++;let el=side==='r'?RS:MS;el.textContent=score[side];bump(el);MSG.textContent='⚽ '+(side==='r'?'RONALDO':'MESSI')+' SCORES!';MSG.classList.remove('on');void MSG.offsetWidth;MSG.classList.add('on');F.classList.remove('on');void F.offsetWidth;F.classList.add('on');setTimeout(start,1300)};const frame=t=>{const dt=Math.min(.025,(t-last)/1000);last=t;if(q){q.age+=dt;const w=A.clientWidth,h=A.clientHeight,c=center(),goalR=Math.min(w*.105,68);[q.r,q.m].forEach((p,i)=>{const dx=c.x-p.x,dy=c.y-p.y,d=Math.hypot(dx,dy)||1,dir=i===0?1:-1;const desiredY=c.y+Math.sin(q.age*1.35+p.phase)*Math.min(34,h*.045);p.vx+=((c.x-p.x)/d)*20*dt;p.vy+=(desiredY-p.y)*1.15*dt;p.vx*=Math.pow(.997,dt*60);p.vy*=Math.pow(.985,dt*60);const maxSpeed=82;p.vx=Math.max(-maxSpeed,Math.min(maxSpeed,p.vx));p.vy=Math.max(-42,Math.min(42,p.vy));p.x+=p.vx*dt;p.y+=p.vy*dt;p.spin+=(Math.hypot(p.vx,p.vy)*dt/.08)*dir;p.x=Math.max(24,Math.min(w-24,p.x));p.y=Math.max(24,Math.min(h-24,p.y));if(Math.hypot(p.x-c.x,p.y-c.y)<goalR){p.vx*=.55;p.vy*=.55;goal(i?'m':'r')}});let a=q.r,b=q.m,dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=Math.max(46,w*.09);if(d<min&&d>0){const nx=dx/d,ny=dy/d,over=min-d;a.x-=nx*over/2;a.y-=ny*over/2;b.x+=nx*over/2;b.y+=ny*over/2;const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){const impulse=-rel*.8;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny}}draw(R,q.r);draw(M,q.m);shadow(RSD,q.r);shadow(MSD,q.m);R.classList.toggle('motion',Math.hypot(q.r.vx,q.r.vy)>62);M.classList.toggle('motion',Math.hypot(q.m.vx,q.m.vy)>62)}requestAnimationFrame(frame)};start();requestAnimationFrame(frame)})();</script></body></html>
