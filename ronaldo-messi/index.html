<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080b12"><title>RONALDO vs MESSI — Auto Battle</title><style>*{box-sizing:border-box}html,body{margin:0;background:#030507;font-family:Arial,sans-serif}body{display:flex;justify-content:center}.game{position:relative;width:min(100vw,560px);aspect-ratio:9/16;min-height:100vh;overflow:hidden;background:linear-gradient(#aeb5bb 0,#eef1f3 32%,#c8ced2 100%);color:#111}.top{height:7%;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,5vw,28px);font-weight:1000}.vs{position:absolute;z-index:12;top:1.5%;left:50%;transform:translateX(-50%);background:#111;color:#fff;border:3px solid #fff;border-radius:50%;padding:11px 7px;font-weight:1000}.live{position:absolute;right:10px;top:10px;z-index:14;background:#df2334;color:white;border-radius:12px;padding:5px 8px;font-size:10px;font-weight:900}.players{height:20%;display:grid;grid-template-columns:1fr 1fr}.p{text-align:center;padding:2px 5px;font-weight:1000}.pic{width:min(28vw,150px);height:min(28vw,150px);min-width:82px;min-height:82px;border-radius:50%;object-fit:cover;background:#fff;border:7px solid currentColor;box-shadow:0 5px 16px #0004}.r{color:#d92738}.m{color:#206ddd}.name{font-size:clamp(14px,4vw,23px);margin-top:3px}.pill{display:inline-block;margin-top:4px;border-radius:20px;padding:6px 14px;color:#fff;font-size:clamp(10px,3vw,16px);box-shadow:0 2px 5px #0003}.red{background:#d92738}.green{background:#12ad55}.scores{height:14%;display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:0 8px}.box{background:#fff;border-radius:0 0 18px 18px;display:grid;place-items:center;position:relative;box-shadow:0 5px 14px #0002}.num{font-size:clamp(44px,12vw,82px);font-weight:1000}.num.bump{animation:bump .22s ease}@keyframes bump{50%{transform:scale(1.2)}}.tag{position:absolute;bottom:-24px;background:#4e555b;color:white;padding:4px 12px;border-radius:0 0 8px 8px;font-size:11px;font-weight:900}.arena{position:absolute;top:41%;left:0;right:0;bottom:0;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#fff 0,#edf0f2 45%,#b9c0c5 100%);perspective:650px}.arena:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.7%,#fff6 50%,transparent 50.3%);opacity:.7}.floor{position:absolute;left:-20%;right:-20%;bottom:-16%;height:55%;transform:rotateX(57deg);transform-origin:bottom;background:repeating-linear-gradient(0deg,transparent 0 45px,#ffffff38 46px 48px),repeating-linear-gradient(90deg,transparent 0 55px,#ffffff20 56px 58px);opacity:.65}.goal{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:clamp(118px,28vw,178px);height:clamp(118px,28vw,178px);border-radius:50%;background:radial-gradient(circle at 32% 25%,#3e3e3e 0,#090909 48%,#000 72%);border:6px solid #73777a;box-shadow:inset 0 10px 18px #fff2,inset 0 -12px 20px #000,0 12px 24px #0006;z-index:2}.goal:after{content:"";position:absolute;inset:9%;border-radius:50%;border:2px solid #fff1;box-shadow:inset 0 0 16px #000}.ball{position:absolute;width:clamp(44px,10.5vw,68px);height:clamp(44px,10.5vw,68px);border-radius:50%;z-index:5;background-image:url('https://commons.wikimedia.org/wiki/Special:Redirect/file/Soccerball1.png');background-size:cover;filter:drop-shadow(0 7px 5px #0008);will-change:transform,left,top}.ball:before{content:"";position:absolute;inset:-5px;border-radius:50%;z-index:-1}.rb:before{box-shadow:0 0 16px 5px #e21d31}.mb:before{box-shadow:0 0 16px 5px #1976e8}.shadow{position:absolute;width:58px;height:18px;border-radius:50%;background:#0005;filter:blur(7px);transform:translate(-50%,-50%);z-index:1}.flash{position:absolute;left:50%;top:48%;width:100px;height:100px;border:4px solid white;border-radius:50%;opacity:0;z-index:8}.flash.on{animation:pop .55s ease-out}@keyframes pop{from{transform:translate(-50%,-50%) scale(.2);opacity:.95}to{transform:translate(-50%,-50%) scale(1.8);opacity:0}}.msg{position:absolute;left:50%;top:9%;transform:translateX(-50%);z-index:13;background:#111e;color:#fff;border:1px solid #fff4;border-radius:18px;padding:7px 13px;font-size:12px;font-weight:900;opacity:0;white-space:nowrap}.msg.on{animation:msg 1s ease}@keyframes msg{20%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,8px)}}.credit{position:absolute;bottom:5px;left:0;right:0;text-align:center;color:#fff9;font-size:8px;text-shadow:0 1px 2px #000;z-index:15}</style></head><body><main class="game"><div class="top">RONALDO <span style="margin:0 8px">VS</span> MESSI</div><div class="vs">VS</div><div class="live">● LIVE</div><section class="players"><div class="p r"><img class="pic" alt="Ronaldo" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Cristiano_Ronaldo_2275_(cropped).jpg"><div class="name">RONALDO</div><span class="pill red">⚽ GOAL</span></div><div class="p m"><img class="pic" alt="Messi" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Lionel_Messi_NYCFC_Miami_24_Sep_2025-096.jpg"><div class="name">MESSI</div><span class="pill green">⚽ GOAL</span></div></section><section class="scores"><div class="box"><div id="rs" class="num r">0</div><div class="tag">AUTO PLAY</div></div><div class="box"><div id="ms" class="num m">0</div><div class="tag">AUTO PLAY</div></div></section><section id="arena" class="arena"><div class="floor"></div><div class="goal"></div><div id="rsd" class="shadow"></div><div id="msd" class="shadow"></div><div id="rb" class="ball rb"></div><div id="mb" class="ball mb"></div><div id="flash" class="flash"></div><div id="msg" class="msg"></div></section><div class="credit">Ball: Wikimedia Commons, public domain • Player portraits: Wikimedia Commons</div></main><script>(()=>{const A=document.getElementById('arena'),R=document.getElementById('rb'),M=document.getElementById('mb'),RS=document.getElementById('rs'),MS=document.getElementById('ms'),RSD=document.getElementById('rsd'),MSD=document.getElementById('msd'),F=document.getElementById('flash'),MSG=document.getElementById('msg');let score={r:0,m:0},q,last=performance.now();const C=()=>({x:A.clientWidth/2,y:A.clientHeight*.48});function make(s){let c=C(),spread=Math.min(A.clientWidth*.43,240),x=c.x+(s==='r'?-spread:spread),y=10,vx=(c.x-x)*.34,vy=-118;return{x,y,vx,vy,spin:0,side:s,stun:0,phase:Math.random()*6.28,launched:false}}function start(){q={r:make('r'),m:make('m'),age:0,done:false}}function draw(e,p){e.style.left=p.x+'px';e.style.top=p.y+'px';e.style.transform='translate(-50%,-50%) rotate('+p.spin+'rad)'}function sh(e,p){e.style.left=p.x+'px';e.style.top=(p.y+10)+'px';e.style.transform='translate(-50%,-50%) scale(.9)'}function goal(s){if(q.done)return;q.done=true;score[s]++;let n=s==='r'?RS:MS;n.textContent=score[s];n.classList.remove('bump');void n.offsetWidth;n.classList.add('bump');MSG.textContent='⚽ '+(s==='r'?'RONALDO':'MESSI')+' SCORES!';MSG.classList.remove('on');void MSG.offsetWidth;MSG.classList.add('on');F.classList.remove('on');void F.offsetWidth;F.classList.add('on');setTimeout(start,1300)}function frame(t){let dt=Math.min(.022,(t-last)/1000);last=t;if(q){q.age+=dt;let w=A.clientWidth,h=A.clientHeight,c=C(),goalR=Math.min(w*.105,68),a=q.r,b=q.m,players=[a,b];players.forEach((p,i)=>{let o=i?a:b;/* Real thrown-ball physics: strong launch toward the centre, upward release, then gravity takes over. No homing/AI steering. */const gravity=235;p.vy+=gravity*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.997,dt*60);p.spin+=Math.hypot(p.vx,p.vy)*dt/.08;if(p.y>h-28){p.y=h-28;p.vy*=-.55;p.vx*=.82}p.x=Math.max(24,Math.min(w-24,p.x));/* A small amount of air drag only; trajectory is otherwise ballistic. */if(p.stun>0){p.stun-=dt;p.vx*=.985;p.vy*=.985}});let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,min=Math.max(48,w*.095);if(d<min){let nx=dx/d,ny=dy/d,rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){let impulse=-rel*1.25;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny;a.stun=.16;b.stun=.16}let push=(min-d)/2;a.x-=nx*push;a.y-=ny*push;b.x+=nx*push;b.y+=ny*push}players.forEach((p,i)=>{if(Math.hypot(p.x-c.x,p.y-c.y)<goalR)goal(i?'m':'r');draw(i?M:R,p);sh(i?MSD:RSD,p)})}requestAnimationFrame(frame)}start();requestAnimationFrame(frame)})();</script></body></html>
