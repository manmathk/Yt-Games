<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080b12"><title>RONALDO vs MESSI — Auto Battle</title><style>*{box-sizing:border-box}html,body{margin:0;background:#050811;font-family:Arial,sans-serif}body{display:flex;justify-content:center}.game{position:relative;width:min(100vw,560px);aspect-ratio:9/16;min-height:100vh;overflow:hidden;background:linear-gradient(#cbd1d7 0 22%,#f5f7f8 48%,#d4dbe0);color:#111}.top{height:7%;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,5vw,28px);font-weight:1000}.vs{position:absolute;z-index:5;top:1.5%;left:50%;transform:translateX(-50%);background:#111;color:#fff;border:3px solid #fff;border-radius:50%;padding:11px 7px;font-weight:1000}.live{position:absolute;right:10px;top:10px;z-index:8;background:#e32635;color:white;border-radius:12px;padding:5px 8px;font-size:10px;font-weight:900}.players{height:20%;display:grid;grid-template-columns:1fr 1fr}.p{text-align:center;padding:2px 5px;font-weight:1000}.pic{width:min(28vw,150px);height:min(28vw,150px);min-width:82px;min-height:82px;border-radius:50%;object-fit:cover;background:#fff;border:7px solid currentColor;box-shadow:0 4px 14px #0004}.r{color:#e52d3d}.m{color:#2478ed}.name{font-size:clamp(14px,4vw,23px);margin-top:3px}.pill{display:inline-block;margin-top:4px;border-radius:20px;padding:6px 14px;color:#fff;font-size:clamp(10px,3vw,16px)}.red{background:#e52d3d}.green{background:#16b75a}.scores{height:14%;display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:0 8px}.box{background:white;border-radius:0 0 18px 18px;display:grid;place-items:center;position:relative;box-shadow:0 4px 12px #0002}.num{font-size:clamp(44px,12vw,82px);font-weight:1000}.tag{position:absolute;bottom:-24px;background:#545b63;color:white;padding:4px 12px;border-radius:0 0 8px 8px;font-size:11px;font-weight:900}.arena{position:absolute;top:41%;left:0;right:0;bottom:0;overflow:hidden;background:radial-gradient(circle at 50% 42%,#fff,#eef2f4 48%,#ccd3d8)}.goal{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:clamp(115px,27vw,175px);height:clamp(115px,27vw,175px);border-radius:50%;background:radial-gradient(circle at 35% 25%,#333,#050505 62%,#000);border:5px solid #777;box-shadow:inset 0 8px 15px #fff3,0 10px 18px #0004}.ball{position:absolute;width:clamp(42px,10vw,66px);height:clamp(42px,10vw,66px);border-radius:50%;z-index:4;box-shadow:inset -9px -11px 15px #0004,inset 8px 8px 12px #fff6,0 7px 12px #0003}.ball:after{content:"";position:absolute;inset:28%;border-radius:50%;background:#fff8;filter:blur(2px)}.rb{background:radial-gradient(circle at 30% 25%,#ff8279,#e21e30 55%,#970815)}.mb{background:radial-gradient(circle at 30% 25%,#72b8ff,#1976e8 55%,#06388f)}.flash{position:absolute;left:50%;top:48%;width:90px;height:90px;border:4px solid white;border-radius:50%;opacity:0;pointer-events:none}.flash.on{animation:pop .55s ease-out}@keyframes pop{from{transform:translate(-50%,-50%) scale(.2);opacity:.9}to{transform:translate(-50%,-50%) scale(1.7);opacity:0}}.msg{position:absolute;left:50%;top:10%;transform:translateX(-50%);z-index:7;background:#111d;color:#fff;border-radius:18px;padding:6px 12px;font-size:12px;font-weight:900;opacity:0}.msg.on{animation:msg 1s ease}@keyframes msg{20%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,8px)}}.credit{position:absolute;bottom:5px;left:0;right:0;text-align:center;color:#fff9;font-size:8px;text-shadow:0 1px 2px #000;z-index:9}</style></head><body><main class="game"><div class="top">RONALDO <span style="margin:0 8px">VS</span> MESSI</div><div class="vs">VS</div><div class="live">● LIVE</div><section class="players"><div class="p r"><img class="pic" alt="Cristiano Ronaldo" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Cristiano_Ronaldo_2275_(cropped).jpg"><div class="name">RONALDO</div><span class="pill red">⚽ GOAL</span></div><div class="p m"><img class="pic" alt="Lionel Messi" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Lionel_Messi_NYCFC_Miami_24_Sep_2025-096.jpg"><div class="name">MESSI</div><span class="pill green">⚽ GOAL</span></div></section><section class="scores"><div class="box"><div id="rs" class="num r">0</div><div class="tag">AUTO PLAY</div></div><div class="box"><div id="ms" class="num m">0</div><div class="tag">AUTO PLAY</div></div></section><section id="arena" class="arena"><div class="goal"></div><div id="rb" class="ball rb"></div><div id="mb" class="ball mb"></div><div id="flash" class="flash"></div><div id="msg" class="msg"></div></section><div class="credit">Portraits: Wikimedia Commons • CC BY-SA 4.0 where applicable</div></main><script>(()=>{const A=document.getElementById('arena'),R=document.getElementById('rb'),M=document.getElementById('mb'),RS=document.getElementById('rs'),MS=document.getElementById('ms'),F=document.getElementById('flash'),MSG=document.getElementById('msg');let s={r:0,m:0},q=null,last=performance.now();const C=()=>({x:A.clientWidth/2,y:A.clientHeight*.48});const make=side=>{const c=C(),sp=Math.min(A.clientWidth*.27,150);return{x:c.x+(side==='r'?-sp:sp),y:c.y+(Math.random()-.5)*A.clientHeight*.22,vx:(side==='r'?1:-1)*(145+Math.random()*90),vy:(Math.random()-.5)*120,rot:Math.random()*6.28}};const start=()=>q={r:make('r'),m:make('m'),done:false};const draw=(e,p)=>{e.style.left=p.x+'px';e.style.top=p.y+'px';e.style.transform='translate(-50%,-50%) rotate('+p.rot+'rad)'};const goal=side=>{if(q.done)return;q.done=true;s[side]++;RS.textContent=s.r;MS.textContent=s.m;MSG.textContent='⚽ '+(side==='r'?'RONALDO':'MESSI')+' SCORES!';MSG.classList.remove('on');void MSG.offsetWidth;MSG.classList.add('on');F.classList.remove('on');void F.offsetWidth;F.classList.add('on');setTimeout(start,650)};const frame=t=>{let dt=Math.min(.035,(t-last)/1000);last=t;if(q){let w=A.clientWidth,h=A.clientHeight,c=C();[q.r,q.m].forEach((p,i)=>{p.vy+=Math.sin(t/600+i)*4*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=dt*3;let pad=25;if(p.x<pad){p.x=pad;p.vx=Math.abs(p.vx)}if(p.x>w-pad){p.x=w-pad;p.vx=-Math.abs(p.vx)}if(p.y<pad){p.y=pad;p.vy=Math.abs(p.vy)}if(p.y>h-pad){p.y=h-pad;p.vy=-Math.abs(p.vy)}if(Math.hypot(p.x-c.x,p.y-c.y)<Math.min(w*.135,86))goal(i?'m':'r')});let a=q.r,b=q.m,dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=Math.max(42,w*.08);if(d<min&&d>0){let nx=dx/d,ny=dy/d,o=min-d;a.x-=nx*o/2;a.y-=ny*o/2;b.x+=nx*o/2;b.y+=ny*o/2;let vx=a.vx,vy=a.vy;a.vx=b.vx;a.vy=b.vy;b.vx=vx;b.vy=vy}draw(R,q.r);draw(M,q.m)}requestAnimationFrame(frame)};start();requestAnimationFrame(frame)})();</script></body></html>
