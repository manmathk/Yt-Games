<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>RONALDO vs MESSI — Auto Battle</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050811;font-family:Arial,Helvetica,sans-serif;color:#fff}body{display:flex;justify-content:center;align-items:flex-start;overflow-x:hidden}.game{position:relative;width:min(100vw,560px);aspect-ratio:9/16;min-height:100vh;overflow:hidden;background:linear-gradient(#cbd1d7 0 22%,#eef2f5 42%,#dce2e7 100%);box-shadow:0 0 40px #0008}.topbar{height:7%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(16px,5vw,28px);letter-spacing:1px;color:#111;text-shadow:0 1px #fff}.vs{position:absolute;top:1.5%;left:50%;transform:translateX(-50%);width:48px;height:48px;border-radius:50%;background:conic-gradient(#e52b2b 0 50%,#1976ff 50%);display:grid;place-items:center;border:3px solid #fff;z-index:8;box-shadow:0 3px 10px #0005}.vs span{background:#111;border-radius:14px;padding:4px 6px;font-size:13px}.players{height:20%;display:grid;grid-template-columns:1fr 1fr;gap:4px}.player{position:relative;text-align:center;padding:3px 7px 0}.portrait{width:min(29vw,155px);height:min(29vw,155px);max-width:155px;max-height:155px;min-width:86px;min-height:86px;margin:auto;border-radius:50%;object-fit:cover;background:#fff;border:7px solid currentColor;box-shadow:0 4px 14px #0004}.ronaldo{color:#ef3d2f}.messi{color:#2878ff}.name{margin-top:4px;font-size:clamp(14px,4vw,24px);font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.action{display:inline-flex;align-items:center;justify-content:center;margin-top:5px;border-radius:25px;padding:6px 14px;font-size:clamp(11px,3.2vw,17px);font-weight:900;color:#fff;min-width:110px}.comment{background:#ef3d2f}.like{background:#20b95a}.score-row{height:14%;display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:0 8px}.scorebox{background:#fff;border-radius:0 0 18px 18px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 15px #0002;position:relative}.score{font-size:clamp(42px,12vw,82px);font-weight:1000;line-height:1}.rscore{color:#ef3d2f}.mscore{color:#19a955}.tap{position:absolute;bottom:-26px;background:#535b63;color:#fff;border-radius:0 0 9px 9px;padding:4px 15px;font-size:12px;font-weight:900;letter-spacing:.4px}.arena{position:absolute;left:0;right:0;top:41%;bottom:0;overflow:hidden;background:radial-gradient(circle at 50% 42%,#fff 0,#edf1f4 45%,#cdd4da 100%)}.arena:before{content:"";position:absolute;left:4%;right:4%;top:5%;height:2px;background:#ffffffaa;box-shadow:0 270px #ffffff35,0 540px #ffffff25}.goal{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:clamp(115px,27vw,175px);height:clamp(115px,27vw,175px);border-radius:50%;background:radial-gradient(circle at 35% 28%,#333,#050505 60%,#000);box-shadow:inset 0 8px 16px #fff3,0 12px 18px #0004;border:5px solid #777}.goal:after{content:"";position:absolute;inset:10%;border-radius:50%;border:2px solid #ffffff18}.ball{position:absolute;width:clamp(40px,10vw,66px);height:clamp(40px,10vw,66px);border-radius:50%;box-shadow:inset -9px -11px 15px #0004,inset 8px 8px 12px #fff5,0 7px 13px #0003;z-index:5}.ball:after{content:"";position:absolute;inset:28%;border-radius:50%;background:#fff8;filter:blur(2px)}.rball{background:radial-gradient(circle at 30% 25%,#ff7b6d,#e21d2d 55%,#9d0714)}.mball{background:radial-gradient(circle at 30% 25%,#74b7ff,#1976e8 55%,#083b9a)}.impact{position:absolute;width:100px;height:100px;border-radius:50%;border:4px solid #fff;opacity:0;pointer-events:none;z-index:4}.impact.show{animation:pop .5s ease-out}@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:.9}100%{transform:translate(-50%,-50%) scale(1.7);opacity:0}}.winner{position:absolute;left:50%;top:11%;transform:translateX(-50%);background:#111d;color:#fff;border:1px solid #fff5;border-radius:18px;padding:6px 13px;font-weight:900;font-size:12px;opacity:0;z-index:10;white-space:nowrap}.winner.show{animation:win 1s ease}@keyframes win{0%{opacity:0;transform:translate(-50%,-15px)}20%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,5px)}}.live{position:absolute;right:12px;top:10px;z-index:10;background:#e21d2d;color:#fff;border-radius:12px;padding:5px 8px;font-size:10px;font-weight:900;letter-spacing:1px}.credit{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:8px;color:#ffffffaa;z-index:9;text-shadow:0 1px 2px #000}
@media(max-width:360px){.portrait{border-width:5px}.action{min-width:94px;padding:5px 10px}.scorebox{border-radius:0 0 14px 14px}}
</style>
</head>
<body>
<main class="game" id="game" aria-label="Ronaldo versus Messi automatic ball battle">
  <div class="topbar">RONALDO <span style="margin:0 8px">VS</span> MESSI</div>
  <div class="vs"><span>VS</span></div>
  <div class="live">● LIVE</div>
  <section class="players">
    <div class="player ronaldo">
      <img class="portrait" alt="Cristiano Ronaldo" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Cristiano_Ronaldo_2275_(cropped).jpg">
      <div class="name">RONALDO</div><div class="action comment">⚽ GOAL</div>
    </div>
    <div class="player messi">
      <img class="portrait" alt="Lionel Messi" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Lionel_Messi_NYCFC_Miami_24_Sep_2025-096.jpg">
      <div class="name">MESSI</div><div class="action like">⚽ GOAL</div>
    </div>
  </section>
  <section class="score-row" aria-live="polite">
    <div class="scorebox"><div class="score rscore" id="rscore">0</div><div class="tap">AUTO PLAY</div></div>
    <div class="scorebox"><div class="score mscore" id="mscore">0</div><div class="tap">AUTO PLAY</div></div>
  </section>
  <section class="arena" id="arena">
    <div class="goal" aria-label="Goal"></div>
    <div class="ball rball" id="rball"></div>
    <div class="ball mball" id="mball"></div>
    <div class="impact" id="impact"></div>
    <div class="winner" id="winner"></div>
  </section>
  <div class="credit">Portraits: Wikimedia Commons • CC BY-SA 4.0 where applicable</div>
</main>
<script>
(() => {
  const arena = document.getElementById('arena');
  const rb = document.getElementById('rball');
  const mb = document.getElementById('mball');
  const rs = document.getElementById('rscore');
  const ms = document.getElementById('mscore');
  const impact = document.getElementById('impact');
  const winner = document.getElementById('winner');
  let scores = {r:0,m:0};
  let round = 0;
  let raf = 0;
  let last = performance.now();
  let state = null;

  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
  const center = () => ({x:arena.clientWidth/2,y:arena.clientHeight*.48});
  const reset = (side) => {
    const g=center(), spread=Math.min(arena.clientWidth*.27,150);
    const y=arena.clientHeight*.48 + (Math.random()-.5)*arena.clientHeight*.22;
    return {x:g.x+(side==='r'?-spread:spread),y,vx:(side==='r'?1:-1)*(150+Math.random()*80),vy:(Math.random()-.5)*100,spin:Math.random()*6.28,hit:0};
  };
  const launchRound = () => {
    state={r:reset('r'),m:reset('m'),winner:null,t:0};
    rb.style.transform='translate(-50%,-50%)'; mb.style.transform='translate(-50%,-50%)';
  };
  const score = (side) => {
    scores[side] += 1;
    rs.textContent=scores.r; ms.textContent=scores.m;
    const name=side==='r'?'RONALDO':'MESSI';
    winner.textContent='⚽ '+name+' SCORES!';
    winner.classList.remove('show'); void winner.offsetWidth; winner.classList.add('show');
    impact.style.left='50%'; impact.style.top='48%'; impact.classList.remove('show'); void impact.offsetWidth; impact.classList.add('show');
    round += 1;
    setTimeout(launchRound,650);
  };
  const draw=(el,p)=>{el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.transform='translate(-50%,-50%) rotate('+p.spin+'rad)';};
  const tick=(now)=>{
    const dt=Math.min(.035,(now-last)/1000); last=now;
    if(state){
      state.t += dt;
      const w=arena.clientWidth,h=arena.clientHeight, g=center();
      [state.r,state.m].forEach((p,i)=>{
        p.vy += Math.sin(state.t*2.1+i)*5*dt;
        p.x += p.vx*dt; p.y += p.vy*dt; p.spin += dt*3;
        const pad=Math.max(24,arena.clientWidth*.055);
        if(p.x<pad){p.x=pad;p.vx=Math.abs(p.vx)} if(p.x>w-pad){p.x=w-pad;p.vx=-Math.abs(p.vx)}
        if(p.y<pad){p.y=pad;p.vy=Math.abs(p.vy)} if(p.y>h-pad){p.y=h-pad;p.vy=-Math.abs(p.vy)}
        const dx=p.x-g.x,dy=p.y-g.y,d=Math.hypot(dx,dy),goalR=Math.min(w*.135,87);
        if(d<goalR && !state.winner){state.winner=i===0?'r':'m'; score(state.winner)}
      });
      // Gentle ball-to-ball deflection keeps the battle lively without deciding the winner directly.
      const a=state.r,b=state.m,dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),minD=Math.max(42,w*.08);
      if(d<minD && d>0){const nx=dx/d,ny=dy/d,over=minD-d;a.x-=nx*over/2;a.y-=ny*over/2;b.x+=nx*over/2;b.y+=ny*over/2;const rvx=a.vx,a vy=a.vy;a.vx=b.vx;a.vy=b.vy;b.vx=rvx;b.vy=avy;}
      draw(rb,state.r); draw(mb,state.m);
    }
    raf=requestAnimationFrame(tick);
  };
  launchRound();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
