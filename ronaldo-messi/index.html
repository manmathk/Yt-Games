</style></head><body><main class="game" id="game"><div class="hud"><header class="top"><div class="topline"><div class="brand">Ronaldo <i>vs Messi</i></div><div class="round"><small>Round</small><b id="round">1</b></div><div class="live">LIVE</div></div><div class="players"><div class="player" style="--accent:#ff3458"><div class="avatar"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Cristiano_Ronaldo_2275_(cropped).jpg"></div><div class="name">Ronaldo</div><div class="score" id="rs">0</div><div class="meter"><span id="rm"></span></div></div><div class="player" style="--accent:#21d4ff"><div class="avatar"><img class="messi" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Lionel_Messi_20180626_(cropped).jpg"></div><div class="name">Messi</div><div class="score" id="ms">0</div><div class="meter"><span id="mm"></span></div></div></div></header><div class="banner" id="banner">First to 10 — gravity decides</div><div class="bottom"><div class="stats"><div class="stat"><small>Leader</small><b id="leader">Even</b></div><div class="stat"><small>Streak</small><b id="streak">—</b></div><div class="stat"><small>Chaos</small><b id="chaos">50%</b></div></div><div class="ticker" id="ticker">Equal physics. No fixed winner.</div></div></div><section class="arena" id="arena"><div class="stadium"></div><div class="field"></div><div class="hole"></div><canvas id="fx"></canvas></section><div class="big" id="big">GOAL</div><div class="count" id="count">3</div><div class="controls"><button class="btn primary" id="start">Start Match</button><button class="btn icon" id="sound">🔊</button><button class="btn icon" id="reset">↻</button></div><div class="overlay" id="overlay"><div class="card"><h1>Gravity<br>Duel</h1><p>Both balls launch from the players, curve toward the black hole and fight each other. Entering the event horizon triggers the goal.</p><button class="btn primary" id="go">GO LIVE</button></div></div></main><audio id="music" preload="auto" loop pl (()=>{const $=id=>document.getElementById(id),g=$("game"),a=$("arena"),cv=$("fx"),ctx=cv.getContext("2d"),music=$("music");const S={started:false,locked:false,sound:true,round:1,r:0,m:0,streak:null,n:0,chaos:50,q:null,last:performance.now(),parts:[],seed:17,ac:null,ct:null};music.volume=.3;const rand=()=>{S.seed=(S.seed*1664525+1013904223)>>>0;return S.seed/4294967296},C=()=>({x:a.clientWidth/2,y:a.clientHeight*.43});function resize(){const d=devicePixelRatio||1;cv.width=a.clientWidth*d;cv.height=a.clientHeight*d;ctx.setTransform(d,0,0,d,0,0)}function hud(){const total=Math.max(1,S.r+S.m);$("rs").textContent=S.r;$("ms").textContent=S.m;$("round").textContent=S.round;$("rm").style.width=Math.max(4,S.r/10*100)+"%";$("mm").style.width=Math.max(4,S.m/10*100)+"%";$("leader").textContent=S.r===S.m?"Even":S.r>S.m?"CR7":"Messi";$("streak").textContent=S.n?((S.streak==='r'?'CR7':'LM')+" ×"+S.n):"—";$("chaos").textContent=Math.round(S.chaos)+"%"}function msg(t,flash=false){$("ticker").textContent=t;$("banner").textContent=t;if(flash){const b=$("banner");b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash')}}function tone(f,v=.05,d=.1,type='sine'){if(!S.sound)return;S.ac??=new(window.AudioContext||window.webkitAudioContext)();S.ac.resume();const o=S.ac.createOscillator(),q=S.ac.createGain(),n=S.ac.currentTime;o.type=type;o.frequency.value=f;q.gain.setValueAtTime(.001,n);q.gain.exponentialRampToValueAtTime(v,n+.01);q.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(q);q.connect(S.ac.destination);o.start(n);o.stop(n+d+.02)}function speak(t,end){if(!S.sound||!window.speechSynthesis){setTimeout(end,150);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-IN';u.rate=1.02;u.onend=end;u.onerror=end;speechSynthesis.speak(u)}function countdown(fn){S.locked=true;let n=3;const tick=()=>{$("count").textContent=n>0?n:'GO';$("count").classList.remove('show');void $("count").offsetWidth;$("count").classList.add('show');tone(n>0?300+n*70:6 function make(side){const c=C(),lane=Math.min(a.clientWidth*.35,175),ang=side==='r'?.2+rand()*.22:Math.PI-.2-rand()*.22,v=175+rand()*35;return{x:c.x+(side==='r'?-lane:lane),y:18+rand()*12,vx:Math.cos(ang)*v,vy:Math.sin(ang)*v,r:Math.max(21,a.clientWidth*.055),side,phase:rand()*6.28,stun:0,capture:0,trail:[]}}
function launch(){S.chaos=Math.max(25,S.chaos-4);S.q={r:make('r'),m:make('m'),start:performance.now(),done:false};msg('INTERCEPT! The gravity well is live.',true);burst(C().x,C().y,'#a76bff',14)}
function physics(p,o,dt){if(p.capture)return;const c=C(),dx=c.x-p.x,dy=c.y-p.y,dist=Math.hypot(dx,dy)||1;let d2=dx*dx+dy*dy+400,G=300000,ax=dx/dist*G/d2,ay=dy/dist*G/d2;const ox=o.x-p.x,oy=o.y-p.y,od=Math.hypot(ox,oy)||1;if(od<200&&(p.side==='r'?o.x>p.x:o.x<p.x)){const k=(1-od/200)*105;ax+=ox/od*k;ay+=oy/od*k}const tx=-dy/dist,ty=dx/dist,w=Math.sin(p.phase)*9;ax+=tx*w;ay+=ty*w;p.phase+=dt*2.3;p.vx+=ax*dt;p.vy+=ay*dt;p.vx*=Math.pow(.998,dt*60);p.vy*=Math.pow(.998,dt*60);const sp=Math.hypot(p.vx,p.vy),max=300;if(sp>max){p.vx=p.vx/sp*max;p.vy=p.vy/sp*max}p.x+=p.vx*dt;p.y+=p.vy*dt;p.trail.push([p.x,p.y]);if(p.trail.length>12)p.trail.shift()}
function collide(A,B){const dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1,min=A.r+B.r;if(d>=min)return;const nx=dx/d,ny=dy/d,rv=(B.vx-A.vx)*nx+(B.vy-A.vy)*ny;if(rv<0){const j=-rv*1.03;A.vx-=j*nx;A.vy-=j*ny;B.vx+=j*nx;B.vy+=j*ny;A.stun=B.stun=.035;S.chaos=Math.min(99,S.chaos+2);burst((A.x+B.x)/2,(A.y+B.y)/2,'#fff',10);tone(120,.06,.08,'square');msg('BLOCK! Perfect interception.',true)}const push=(min-d)*.52;A.x-=nx*push;A.y-=ny*push;B.x+=nx*push;B.y+=ny*push}

function burst(X,Y,col,n){for(let i=0;i<n;i++){const q=rand()*Math.PI*2,s=25+rand()*120;S.parts.push({x:X,y:Y,vx:Math.cos(q)*s,vy:Math.sin(q)*s,l:.45+rand()*.4,col})}}
function particles(dt){for(let i=S.parts.length-1;i>=0;i--){const p=S.parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.l-=dt;if(p.l<=0){S.parts.splice(i,1);continue}ctx.globalAlpha=Math.min(1,p.l*2);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,7);ctx.fill()}ctx.globalAlpha=1}
function draw(p){const col=p.side==='r'?'#ff3458':'#21d4ff';for(let i=0;i<p.trail.length;i++){const q=p.trail[i];ctx.globalAlpha=i/p.trail.length*.2;ctx.fillStyle=col;ctx.beginPath();ctx.arc(q[0],q[1],p.r*(.2+i/p.trail.length*.45),0,7);ctx.fill()}ctx.globalAlpha=1;ctx.save();ctx.translate(p.x,p.y);const gr=ctx.createRadialGradient(-p.r*.3,-p.r*.35,2,0,0,p.r);gr.addColorStop(0,'#fff');gr.addColorStop(.2,p.side==='r'?'#ff9baa':'#bff5ff');gr.addColorStop(.58,col);gr.addColorStop(1,p.side==='r'?'#720b20':'#075087');ctx.fillStyle=gr;ctx.shadowBlur=25;ctx.shadowColor=col;ctx.beginPath();ctx.arc(0,0,p.r,0,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.stroke();ctx.fillStyle='#fff';ctx.font='900 '+Math.max(11,p.r*.62)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.side==='r'?'CR7':'LM',0,1);ctx.restore()}
function captureTest(p,dt){if(p.capture||S.q.done)return false;const c=C(),R=Math.max(38,a.clientWidth*.09),prevX=p.x,prevY=p.y;const dx=c.x-p.x,dy=c.y-p.y,d=Math.hypot(dx,dy)||1;if(d<=R){p.capture=1;p.x=c.x;p.y=c.y;p.vx=0;p.vy=0;S.locked=true;msg((p.side==='r'?'CR7':'LM')+' ENTERED THE EVENT HORIZON!',true);tone(180,.09,.2,'sawtooth');burst(c.x,c.y,p.side==='r'?'#ff3458':'#21d4ff',24);setTimeout(()=>goal(p.side),360);return true}const nx=p.x+p.vx*dt,ny=p.y+p.vy*dt;const sx=p.x-c.x,sy=p.y-c.y,ex=nx-c.x,ey=ny-c.y;const vx=ex-sx,vy=ey-sy,L=vx*vx+vy*vy;let u=L?-(sx*vx+sy*vy)/L:0;u=Math.max(0,Math.min(1,u));const qx=sx+vx*u,qy=sy+vy*u;if(qx*qx+qy*qy<=R*R){p.capture=1;p.x=c.x;p.y=c.y;p.vx=0;p.vy=0;S.locked=true;msg((p.side==='r'?'CR7':'LM')+' crossed the event horizon!',true);tone(180,.09,.2,'sawtooth');burst(c.x,c.y,p.side==='r'?'#ff3458':'#21d4ff',24);setTimeout(()=>goal(p.side),360);return true}return false}
function goal(side){if(!S.q||S.q.done)return;S.q.done=true;S.r+=side==='r'?1:0;S.m+=side==='m'?1:0;S.streak===side?S.n++:(S.streak=side,S.n=1);S.chaos=Math.min(99,S.chaos+8+S.n);hud();const c=C(),col=side==='r'?'#ff3458':'#21d4ff';burst(c.x,c.y,col,50);$("big").textContent=side==='r'?'CR7 GOAL':'MESSI GOAL';$("big").classList.remove('show');void $("big").offsetWidth;$("big").classList.add('show');tone(520,.11,.4,'triangle');const who=side==='r'?'Ronaldo':'Messi';msg(who+' is swallowed by the black hole — GOAL!',true);speak(S[side]>=10?who+' wins the match.':who+' scores. Gravity takes another one.',()=>{if(S[side]>=10){S.locked=false;msg(who+' wins! Reset for a rematch.',true);return}S.round++;setTimeout(()=>countdown(launch),450)})}
function frame(t){const dt=Math.min(.028,(t-S.last)/1000);S.last=t;ctx.clearRect(0,0,a.clientWidth,a.clientHeight);if(S.q){const A=S.q.r,B=S.q.m;const steps=Math.max(1,Math.ceil(dt/.004)),h=dt/steps;if(!S.locked&&!S.q.done){for(let i=0;i<steps&&!S.q.done;i++){physics(A,B,h);physics(B,A,h);collide(A,B);walls(A);walls(B);captureTest(A,h);captureTest(B,h)}}draw(A);draw(B)}particles(dt);requestAnimationFrame(frame)}
