<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ronaldo vs Messi</title><style>*{box-sizing:border-box}html,body{margin:0;background:#030507;font-family:Arial}body{display:flex;justify-content:center}.game{width:min(100vw,560px);height:100vh;aspect-ratio:9/16;position:relative;overflow:hidden;background:linear-gradient(#aeb5bb,#eef1f3 32%,#c8ced2);color:#111}.top{height:7%;display:grid;place-items:center;font-size:clamp(18px,5vw,28px);font-weight:1000}.vs{position:absolute;z-index:12;top:1.5%;left:50%;transform:translateX(-50%);background:#111;color:#fff;border:3px solid #fff;border-radius:50%;padding:11px 7px;font-weight:1000}.live{position:absolute;right:10px;top:10px;background:#d23;color:#fff;border-radius:12px;padding:5px 8px;font-size:10px;font-weight:900}.players{height:20%;display:grid;grid-template-columns:1fr 1fr}.p{text-align:center;font-weight:1000}.pic{width:min(28vw,150px);height:min(28vw,150px);min-width:82px;min-height:82px;border-radius:50%;object-fit:cover;background:#fff;border:7px solid currentColor;box-shadow:0 5px 16px #0004}.r{color:#d92738}.m{color:#206ddd}.name{font-size:clamp(14px,4vw,23px);margin-top:3px}.pill{display:inline-block;margin-top:4px;border-radius:20px;padding:6px 14px;color:#fff;font-size:11px}.red{background:#d92738}.green{background:#12ad55}.scores{height:14%;display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:0 8px}.box{background:#fff;border-radius:0 0 18px 18px;display:grid;place-items:center;box-shadow:0 5px 14px #0002}.num{font-size:clamp(44px,12vw,82px);font-weight:1000}.arena{position:absolute;top:41%;left:0;right:0;bottom:0;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#fff,#edf0f2 45%,#b9c0c5);perspective:650px}.floor{position:absolute;left:-20%;right:-20%;bottom:-16%;height:55%;transform:rotateX(57deg);transform-origin:bottom;background:repeating-linear-gradient(0deg,transparent 0 45px,#fff3 46px 48px)}.goal{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:clamp(118px,28vw,178px);height:clamp(118px,28vw,178px);border-radius:50%;background:radial-gradient(circle at 32% 25%,#444,#090909 48%,#000 72%);border:6px solid #73777a;box-shadow:inset 0 10px 18px #fff2,inset 0 -12px 20px #000,0 12px 24px #0006;z-index:2}.ball{position:absolute;width:clamp(44px,10.5vw,68px);height:clamp(44px,10.5vw,68px);border-radius:50%;z-index:5;background:#111;box-shadow:0 7px 5px #0008}.ball:after{content:"";position:absolute;inset:7px;border-radius:50%;background:currentColor}.rb{color:#f21845;box-shadow:0 0 18px 5px #e21d31}.mb{color:#ffea00;box-shadow:0 0 18px 5px #ffd900}.shadow{position:absolute;width:58px;height:18px;border-radius:50%;background:#0005;filter:blur(7px);z-index:1}.flash{position:absolute;left:50%;top:48%;width:100px;height:100px;border:4px solid #fff;border-radius:50%;opacity:0;z-index:8}.flash.on{animation:pop .55s}@keyframes pop{from{transform:translate(-50%,-50%) scale(.2);opacity:.95}to{transform:translate(-50%,-50%) scale(1.8);opacity:0}}.msg{position:absolute;left:50%;top:9%;transform:translateX(-50%);z-index:13;background:#111e;color:#fff;border-radius:18px;padding:7px 13px;font-size:12px;font-weight:900;opacity:0}.msg.on{animation:msg 1s}@keyframes msg{20%,75%{opacity:1}100%{opacity:0}}.music{position:absolute;right:10px;bottom:10px;z-index:20;border:0;border-radius:50%;width:40px;height:40px;background:#111;color:#fff;font-size:18px}.credit{position:absolute;bottom:5px;left:0;right:0;text-align:center;color:#fff9;font-size:8px;z-index:15}</style></head><body><main class="game"><div class="top">RONALDO <span>VS</span> MESSI</div><div class="vs">VS</div><div class="live">● LIVE</div><section class="players"><div class="p r"><img class="pic" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Cristiano_Ronaldo_2275_(cropped).jpg"><div class="name">RONALDO</div><span class="pill red">⚽ GOAL</span></div><div class="p m"><img class="pic" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Lionel_Messi_NYCFC_Miami_24_Sep_2025-096.jpg"><div class="name">MESSI</div><span class="pill green">⚽ GOAL</span></div></section><section class="scores"><div class="box"><div id="rs" class="num r">0</div></div><div class="box"><div id="ms" class="num m">0</div></div></section><section id="arena" class="arena"><div class="floor"></div><div class="goal"></div><div id="rsd" class="shadow"></div><div id="msd" class="shadow"></div><div id="rb" class="ball rb"></div><div id="mb" class="ball mb"></div><div id="flash" class="flash"></div><div id="msg" class="msg"></div></section><button id="music" class="music">🔇</button><div class="credit">Ball: public domain • Player portraits: Wikimedia Commons</div></main><script>(()=>{const A=document.getElementById('arena'),R=document.getElementById('rb'),M=document.getElementById('mb'),RS=document.getElementById('rs'),MS=document.getElementById('ms'),RSD=document.getElementById('rsd'),MSD=document.getElementById('msd'),F=document.getElementById('flash'),MSG=document.getElementById('msg'),MB=document.getElementById('music');let score={r:0,m:0},q,last=performance.now();const C=()=>({x:A.clientWidth/2,y:A.clientHeight*.48});function make(s){let c=C(),x=c.x+(s==='r'?-Math.min(A.clientWidth*.43,240):Math.min(A.clientWidth*.43,240)),speed=420,ang=s==='r'?-0.3:-Math.PI+0.3;return{x,y:10,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed,spin:0}}function start(){q={r:make('r'),m:make('m'),done:false}}function draw(e,p){e.style.left=p.x+'px';e.style.top=p.y+'px';e.style.transform=`translate(-50%,-50%) rotate(${p.spin}rad)`}function sh(e,p){e.style.left=p.x+'px';e.style.top=p.y+10+'px';e.style.transform='translate(-50%,-50%)'}function goal(s){if(q.done)return;q.done=true;score[s]++;(s==='r'?RS:MS).textContent=score[s];MSG.textContent='⚽ '+(s==='r'?'RONALDO':'MESSI')+' SCORES!';MSG.classList.remove('on');void MSG.offsetWidth;MSG.classList.add('on');F.classList.remove('on');void F.offsetWidth;F.classList.add('on');setTimeout(start,500)}function frame(t){let dt=Math.min(.018,(t-last)/1000);last=t;if(q){let w=A.clientWidth,h=A.clientHeight,c=C(),goalR=Math.min(w*.105,68),a=q.r,b=q.m;[a,b].forEach(p=>{let dx=c.x-p.x,dy=c.y-p.y,r2=dx*dx+dy*dy,r=Math.sqrt(r2)||1,acc=500000/(r2+500);p.vx+=dx/r*acc*dt;p.vy+=dy/r*acc*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.spin+=Math.hypot(p.vx,p.vy)*dt/.08;if(p.y>h-28){p.y=h-28;p.vy*=-.55;p.vx*=.82}if(p.y<24){p.y=24;p.vy=Math.abs(p.vy)*.72}if(p.x<24){p.x=24;p.vx=Math.abs(p.vx)*.72}if(p.x>w-24){p.x=w-24;p.vx=-Math.abs(p.vx)*.72}});let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,min=Math.max(48,w*.095);if(d<min){let nx=dx/d,ny=dy/d,rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){let j=-rel;a.vx-=j*nx;a.vy-=j*ny;b.vx+=j*nx;b.vy+=j*ny}let push=(min-d)/2;a.x-=nx*push;a.y-=ny*push;b.x+=nx*push;b.y+=ny*push}if(!q.done){if(Math.hypot(a.x-c.x,a.y-c.y)<goalR)goal('r');else if(Math.hypot(b.x-c.x,b.y-c.y)<goalR)goal('m')}draw(R,a);draw(M,b);sh(RSD,a);sh(MSD,b)}requestAnimationFrame(frame)}start();requestAnimationFrame(frame);let ac=null,gain=null,on=false,timer;function musicOn(){if(on)return;ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();gain=ac.createGain();gain.gain.value=.045;gain.connect(ac.destination);let notes=[110,130.81,146.83,164.81,146.83,130.81,98];let i=0;function beat(){if(!on)return;let now=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=notes[i++%notes.length];g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.12,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+.14);o.connect(g);g.connect(gain);o.start(now);o.stop(now+.16);timer=setTimeout(beat,170)}on=true;MB.textContent='🔊';beat()}function musicOff(){on=false;clearTimeout(timer);if(gain)gain.gain.setTargetAtTime(.0001,ac.currentTime,.03);MB.textContent='🔇'}MB.onclick=e=>{e.stopPropagation();on?musicOff():musicOn()};A.onclick=musicOn})();</script></body></html>
