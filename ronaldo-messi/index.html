<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030712">
<title>Ronaldo vs Messi — Black Hole Arena</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;overflow:hidden;background:#01030a;color:#fff;font-family:Inter,system-ui,Arial,sans-serif}.game{position:relative;width:min(100vw,540px);height:min(100vh,960px);aspect-ratio:9/16;overflow:hidden;background:radial-gradient(circle at 50% 38%,#143d4a 0,#081b2a 28%,#050c17 62%,#02050b 100%);box-shadow:0 0 0 1px #ffffff22,0 28px 80px #000b;isolation:isolate}.game:before{content:"";position:absolute;inset:0;z-index:30;pointer-events:none;background:linear-gradient(180deg,#0008 0,transparent 16%,transparent 76%,#000a 100%)}
.hud{position:absolute;inset:0;z-index:12;pointer-events:none}.top{height:30%;padding:10px 12px 0}.topline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}.brand{font-weight:1000;font-size:clamp(16px,4.5vw,25px);line-height:.9;text-transform:uppercase;text-shadow:0 3px 14px #000}.brand i{display:block;color:#ffd84d;font-style:normal}.round{padding:6px 12px;text-align:center;border:1px solid #ffffff2e;border-radius:12px;background:#07111dcc;box-shadow:0 8px 25px #0006}.round small{display:block;color:#9ddfff;font-size:9px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.round b{font-size:18px}.live{justify-self:end;border:1px solid #ff8aa0aa;border-radius:99px;background:#d9143cee;padding:7px 11px;font-size:11px;font-weight:1000;letter-spacing:.12em;box-shadow:0 0 25px #ff315955}.live:before{content:"";display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:#fff;animation:blink .8s infinite}@keyframes blink{50%{opacity:.25}}
.players{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:7px}.player{position:relative;display:grid;justify-items:center;align-content:start;padding:7px 7px 8px;overflow:hidden;border:1px solid #ffffff2d;border-radius:12px;background:linear-gradient(180deg,#ffffff19,#ffffff07);box-shadow:0 15px 35px #0006,inset 0 1px #fff3}.player:after{content:"";position:absolute;inset:auto 0 0;height:42%;background:linear-gradient(0deg,var(--accent),transparent);opacity:.13}.avatar{position:relative;width:clamp(64px,19vw,105px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 3px var(--accent),0 0 30px var(--accent)}.avatar img{width:100%;height:100%;object-fit:cover}.avatar .messi{object-position:center 18%}.name{position:relative;margin-top:6px;font-size:clamp(14px,3.8vw,21px);font-weight:1000;text-transform:uppercase;text-shadow:0 2px 9px #000}.score{position:relative;font-size:clamp(40px,11vw,68px);line-height:.88;font-weight:1000;text-shadow:0 4px 0 #0004,0 0 25px var(--accent)}.meter{position:relative;width:92%;height:7px;margin-top:6px;border-radius:99px;background:#fff2;border:1px solid #fff3;overflow:hidden}.meter span{display:block;height:100%;width:50%;background:linear-gradient(90deg,#fff,var(--accent));box-shadow:0 0 15px var(--accent);transition:width .35s ease}
.centerBanner{position:absolute;top:28.8%;left:50%;z-index:18;transform:translate(-50%,-50%);white-space:nowrap;border:1px solid #fff3;border-radius:99px;background:#06101dcc;padding:8px 15px;font-size:clamp(11px,3vw,15px);font-weight:1000;text-transform:uppercase;box-shadow:0 10px 25px #0007}.centerBanner.hot{animation:banner .35s ease}@keyframes banner{50%{transform:translate(-50%,-50%) scale(1.08)}}
.arena{position:absolute;left:0;right:0;top:28%;bottom:15%;z-index:2;overflow:hidden}.stadium{position:absolute;inset:0;background:radial-gradient(circle at 50% 13%,#ffffff18 0 2px,transparent 3px),radial-gradient(circle at 12% 22%,#ffffff14 0 1px,transparent 2px),radial-gradient(circle at 87% 28%,#ffffff14 0 1px,transparent 2px),repeating-linear-gradient(90deg,#102b43 0 22px,#0b2033 22px 44px);opacity:.8}.field{position:absolute;left:-20%;right:-20%;bottom:-18%;height:76%;transform:rotateX(57deg);transform-origin:bottom;background:repeating-linear-gradient(90deg,#125b3d 0 52px,#0f4e35 52px 104px);border-top:4px solid #ffffff66;box-shadow:inset 0 0 0 4px #fff3,0 -18px 50px #0008}.field:after{content:"";position:absolute;inset:10% 26%;border:3px solid #fff5;border-radius:50%}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}.blackhole{position:absolute;left:50%;top:43%;z-index:6;width:clamp(72px,18vw,100px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#000;box-shadow:0 0 0 4px #ffffff55,0 0 0 10px #7c35ff33,0 0 35px #000,0 0 75px #7c35ff55}.blackhole:before{content:"";position:absolute;inset:-13px;border-radius:50%;border:4px solid transparent;border-top-color:#ff3458;border-right-color:#ffd84d;border-bottom-color:#21d4ff;animation:spin 1.8s linear infinite;filter:drop-shadow(0 0 8px #a76bff)}.blackhole:after{content:"BLACK HOLE";position:absolute;left:50%;top:calc(100% + 13px);transform:translateX(-50%);font-size:8px;font-weight:1000;letter-spacing:.18em;color:#d8cfff;white-space:nowrap;text-shadow:0 2px 8px #000}@keyframes spin{to{transform:rotate(360deg)}}
.ball{position:absolute;z-index:9;width:clamp(43px,10vw,59px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:clamp(16px,4.5vw,25px);font-weight:1000;border:3px solid #fff;box-shadow:0 10px 17px #0009,0 0 28px var(--accent);will-change:left,top,transform}.ball:before{content:"";position:absolute;inset:6px;border-radius:50%;border:2px dashed #fff9}.ball:after{content:"";position:absolute;inset:9px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff8,transparent 30%)}.r{background:radial-gradient(circle at 30% 25%,#ffb2be,#ff3458 48%,#720b20)}.m{background:radial-gradient(circle at 30% 25%,#e6fbff,#21d4ff 48%,#075087)}
.big{position:absolute;left:50%;top:48%;z-index:20;transform:translate(-50%,-50%) scale(.7);opacity:0;width:100%;text-align:center;font-size:clamp(52px,15vw,92px);line-height:.82;font-weight:1000;text-transform:uppercase;text-shadow:0 5px #0005,0 0 35px #ffd84d}.big.show{animation:big .95s ease both}@keyframes big{18%,72%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2)}}.count{position:absolute;left:50%;top:48%;z-index:21;transform:translate(-50%,-50%) scale(.7);opacity:0;width:110px;height:110px;border-radius:50%;display:grid;place-items:center;border:4px solid #fff;background:#06101ddd;font-size:54px;font-weight:1000;box-shadow:0 0 40px #ffd84d66}.count.show{animation:count .65s ease both}@keyframes count{15%,78%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}
.bottom{position:absolute;left:12px;right:12px;bottom:12px;z-index:15;display:grid;gap:7px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{padding:7px 5px;text-align:center;border:1px solid #fff2;border-radius:10px;background:#06101dcc;box-shadow:0 8px 22px #0006}.stat small{display:block;color:#a8dfff;font-size:8px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.stat b{font-size:clamp(14px,3.8vw,20px)}.ticker{min-height:34px;display:flex;align-items:center;justify-content:center;padding:7px 10px;text-align:center;border:1px solid #fff2;border-radius:10px;background:#ffffff12;font-size:clamp(11px,3vw,14px);font-weight:900;text-shadow:0 2px 8px #000}
.controls{position:absolute;left:12px;right:12px;bottom:12px;z-index:50;display:grid;grid-template-columns:1fr auto auto;gap:7px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.game:not(.started) .controls,.game.showControls .controls{opacity:1;transform:none;pointer-events:auto}.btn{min-height:44px;border:1px solid #fff4;border-radius:10px;background:#06101dee;color:#fff;font-weight:1000;text-transform:uppercase;cursor:pointer;box-shadow:0 10px 28px #0007,inset 0 1px #fff2}.primary{background:linear-gradient(135deg,#ff3458,#8a5cff,#21d4ff)}.icon{width:48px;font-size:17px}.overlay{position:absolute;inset:0;z-index:45;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#02060a99,#02060aee);text-align:center}.card{width:min(100%,390px);padding:24px;border:1px solid #fff3;border-radius:18px;background:#07111de8;box-shadow:0 30px 70px #000b}.card h1{margin:0;font-size:clamp(38px,11vw,64px);line-height:.82;text-transform:uppercase;text-shadow:0 5px #0005,0 0 30px #ffd84d66}.card p{margin:15px 0 18px;color:#d9f4ff;font-size:13px;line-height:1.5;font-weight:750}.hidden{display:none}@media(max-height:720px){.top{height:28%}.arena{top:27%;bottom:14%}.bottom{bottom:7px}}
</style>
</head>
<body>
<main class="game" id="game">
<div class="hud">
<header class="top">
<div class="topline"><div class="brand">Ronaldo <i>vs Messi</i></div><div class="round"><small>Round</small><b id="round">1</b></div><div class="live">LIVE</div></div>
<div class="players">
<div class="player" style="--accent:#ff3458"><div class="avatar"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Cristiano_Ronaldo_2275_(cropped).jpg" alt=""></div><div class="name">Ronaldo</div><div class="score" id="rScore">0</div><div class="meter"><span id="rMeter"></span></div></div>
<div class="player" style="--accent:#21d4ff"><div class="avatar"><img class="messi" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Lionel_Messi_20180626_(cropped).jpg" alt=""></div><div class="name">Messi</div><div class="score" id="mScore">0</div><div class="meter"><span id="mMeter"></span></div></div>
</div>
</header>
<div class="centerBanner" id="banner">First to 10 wins</div>
<div class="bottom"><div class="stats"><div class="stat"><small>Leader</small><b id="leader">Even</b></div><div class="stat"><small>Streak</small><b id="streak">0</b></div><div class="stat"><small>Heat</small><b id="heat">50%</b></div></div><div class="ticker" id="ticker">The arena is waiting for the first launch.</div></div>
</div>
<section class="arena" id="arena"><div class="stadium"></div><div class="field"></div><canvas id="fx"></canvas><div class="blackhole" id="hole"></div><div class="ball r" id="rBall" style="--accent:#ff3458">CR7</div><div class="ball m" id="mBall" style="--accent:#21d4ff">LM</div></section>
<div class="big" id="big">GOAL</div><div class="count" id="count">3</div>
<div class="controls"><button class="btn primary" id="start">Start Match</button><button class="btn icon" id="sound" aria-label="Sound">🔊</button><button class="btn icon" id="reset" aria-label="Reset">↻</button></div>
<div class="overlay" id="overlay"><div class="card"><h1>Black Hole<br>Arena</h1><p>Two balls launch from the players, fight the gravity well and try to intercept each other. First to 10 goals wins.</p><button class="btn primary" id="go">GO LIVE</button></div></div>
</main>
<audio id="music" preload="auto" loop playsinline><source src="../Graveyard%20Drift.mp3" type="audio/mpeg"></audio>
<script>
(()=>{
const $=id=>document.getElementById(id),game=$('game'),arena=$('arena'),canvas=$('fx'),ctx=canvas.getContext('2d'),hole=$('hole'),rEl=$('rBall'),mEl=$('mBall'),music=$('music');
const state={started:false,locked:false,sound:true,round:1,scores:{r:0,m:0},streak:{side:null,n:0},heat:50,q:null,last:performance.now(),particles:[],controls:null};
music.volume=.3;
function center(){return{x:arena.clientWidth/2,y:arena.clientHeight*.43}}
function resize(){canvas.width=arena.clientWidth*devicePixelRatio;canvas.height=arena.clientHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);if(state.q){state.q.r.x=state.q.r.x/Math.max(1,state.q.oldW)*arena.clientWidth;state.q.m.x=state.q.m.x/Math.max(1,state.q.oldW)*arena.clientWidth;state.q.oldW=arena.clientWidth}}
function ball(side){const c=center(),lane=Math.min(arena.clientWidth*.36,175);return{x:c.x+(side==='r'?-lane:lane),y:7+Math.random()*18,vx:side==='r'?35:-35,vy:5+Math.random()*8,side,phase:Math.random()*7,stun:0,trail:[]}}
function msg(t){$('ticker').textContent=t;$('banner').textContent=t;$('banner').classList.remove('hot');void $('banner').offsetWidth;$('banner').classList.add('hot')}
function hud(){const r=state.scores.r,m=state.scores.m,total=Math.max(1,r+m);$('rScore').textContent=r;$('mScore').textContent=m;$('rMeter').style.width=Math.max(7,r/total*100)+'%';$('mMeter').style.width=Math.max(7,m/total*100)+'%';$('round').textContent=state.round;$('leader').textContent=r===m?'Even':r>m?'CR7':'Messi';$('streak').textContent=state.streak.n?`${state.streak.side==='r'?'CR7':'LM'} ×${state.streak.n}`:'0';$('heat').textContent=Math.round(state.heat)+'%'}
function audio(){if(!state.ac)state.ac=new(window.AudioContext||window.webkitAudioContext)();state.ac.resume();return state.ac}
function sfx(f=.2,g=.05,d=.12,type='triangle'){if(!state.sound)return;const ac=audio(),o=ac.createOscillator(),v=ac.createGain(),n=ac.currentTime;o.type=type;o.frequency.setValueAtTime(f,n);v.gain.setValueAtTime(.0001,n);v.gain.exponentialRampToValueAtTime(g,n+.015);v.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(v);v.connect(ac.destination);o.start(n);o.stop(n+d+.02)}
function cheer(){if(!state.sound)return;sfx(130,.12,.28,'sawtooth');setTimeout(()=>sfx(195,.08,.25),70);setTimeout(()=>sfx(260,.06,.28),145)}
function speak(t,done){if(!state.sound||!speechSynthesis){done&&setTimeout(done,100);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-IN';u.rate=1.04;u.pitch=1.02;u.volume=.9;u.onend=()=>done&&done();u.onerror=()=>done&&done();speechSynthesis.speak(u)}
function particles(side,x,y,n=34){const c=side==='r'?'#ff3458':'#21d4ff';for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,d=35+Math.random()*110;state.particles.push({x,y,vx:Math.cos(a)*d,vy:Math.sin(a)*d,life:.65,max:.65,c})}}
function drawFX(dt){const w=arena.clientWidth,h=arena.clientHeight;ctx.clearRect(0,0,w,h);for(const p of state.q?[state.q.r,state.q.m]:[]){if(!p)continue;ctx.save();for(let i=0;i<p.trail.length;i++){const t=p.trail[i],alpha=(i/p.trail.length)*.16;ctx.fillStyle=p.side==='r'?`rgba(255,52,88,${alpha})`:`rgba(33,212,255,${alpha})`;ctx.beginPath();ctx.arc(t.x,t.y,3+i*.18,0,Math.PI*2);ctx.fill()}ctx.restore()}for(let i=state.particles.length-1;i>=0;i--){const p=state.particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.965;p.vy*=.965;if(p.life<=0){state.particles.splice(i,1);continue}ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.c;ctx.shadowBlur=12;ctx.shadowColor=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0}
function physics(p,o,dt){const c=center(),dx=c.x-p.x,dy=c.y-p.y,d=Math.hypot(dx,dy)||1;const holeForce=Math.min(1550/(d*d+75),190);p.vx+=dx/d*holeForce*dt;p.vy+=dy/d*holeForce*dt;
const odx=o.x-p.x,ody=o.y-p.y,od=Math.hypot(odx,ody)||1;const ahead=p.side==='r'?o.x>p.x:o.x<p.x;if(ahead&&od<210){const force=(210-od)*1.9;p.vx+=odx/od*force*dt;p.vy+=ody/od*force*dt}
p.phase+=dt*3;p.vx+=Math.sin(p.phase)*9*dt;p.vy+=Math.cos(p.phase*.8)*5*dt;p.stun=Math.max(0,p.stun-dt);const drag=Math.pow(.994,dt*60);p.vx*=drag;p.vy*=drag;const speed=Math.hypot(p.vx,p.vy),max=145;if(speed>max){p.vx=p.vx/speed*max;p.vy=p.vy/speed*max}if(!p.stun){p.x+=p.vx*dt;p.y+=p.vy*dt}p.trail.push({x:p.x,y:p.y});if(p.trail.length>11)p.trail.shift()}
function walls(p){const r=Math.max(22,arena.clientWidth*.052),w=arena.clientWidth,h=arena.clientHeight;if(p.x<r){p.x=r;p.vx=Math.abs(p.vx)*.78;sfx(95,.018,.04)}if(p.x>w-r){p.x=w-r;p.vx=-Math.abs(p.vx)*.78;sfx(95,.018,.04)}if(p.y<r){p.y=r;p.vy=Math.abs(p.vy)*.78}if(p.y>h-r){p.y=h-r;p.vy=-Math.abs(p.vy)*.72}}
function collide(a,b){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,min=Math.max(44,arena.clientWidth*.1);if(d>=min)return;const nx=dx/d,ny=dy/d,rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){const impulse=-rel*.96;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny;a.stun=.14;b.stun=.14;state.heat=Math.min(99,state.heat+1);particles('r', (a.x+b.x)/2,(a.y+b.y)/2,9);sfx(180,.055,.09,'square');msg('BLOCK! They stopped each other.') }const push=(min-d)/2;a.x-=nx*push;a.y-=ny*push;b.x+=nx*push;b.y+=ny*push}
function render(){if(!state.q)return;const q=state.q;for(const [el,p] of [[rEl,q.r],[mEl,q.m]]){el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.transform=`translate(-50%,-50%) rotate(${(p.x+p.y)*.03}deg)`}}
function goal(side){if(state.q.done||state.locked)return;state.q.done=true;state.locked=true;state.scores[side]++;if(state.streak.side===side)state.streak.n++;else state.streak={side,n:1};state.heat=Math.min(99,state.heat+8+state.streak.n*2);hud();const c=center();particles(side,c.x,c.y,70);$('big').textContent=side==='r'?'CR7 GOAL':'MESSI GOAL';$('big').classList.remove('show');void $('big').offsetWidth;$('big').classList.add('show');cheer();sfx(520,.1,.35,'sawtooth');const name=side==='r'?'Ronaldo':'Messi';msg(`${name} found the black hole!`);speak(`${name} scores! The black hole pulls it home.`,()=>setTimeout(()=>{if(state.scores[side]>=10){msg(`${name} wins the match! Tap reset for another battle.`);state.locked=false;return}state.round++;countdown();},450))}
function countdown(){state.locked=true;let n=3;const tick=()=>{ $('count').textContent=n>0?n:'GO';$('count').classList.remove('show');void $('count').offsetWidth;$('count').classList.add('show');sfx(n>0?260+n*70:620,.045,.12);if(n-->0)setTimeout(tick,650);else setTimeout(()=>{state.locked=false;launch()},430)};tick()}
function launch(){if(!state.started)return;state.heat=Math.max(35,state.heat-3);state.q={r:ball('r'),m:ball('m'),done:false,oldW:arena.clientWidth};msg('Both launched. Who gets pulled into the black hole?');}
function start(){if(state.started)return;state.started=true;game.classList.add('started');$('overlay').classList.add('hidden');$('start').textContent='Running';state.locked=true;music.currentTime=0;music.volume=.3;music.play().catch(()=>{});speak('Ronaldo versus Messi. Black Hole Arena is live.',countdown)}
function reset(){speechSynthesis&&speechSynthesis.cancel();state.round=1;state.scores={r:0,m:0};state.streak={side:null,n:0};state.heat=50;state.q=null;state.locked=false;state.particles=[];hud();msg('Fresh match. First to 10 wins.');if(state.started){music.currentTime=0;if(state.sound)music.play().catch(()=>{});countdown()}}
function sound(){state.sound=!state.sound;$('sound').textContent=state.sound?'🔊':'🔇';music.muted=!state.sound;if(state.sound){music.volume=.3;if(state.started)music.play().catch(()=>{});sfx(420,.05,.1)}}
function frame(t){const dt=Math.min(.032,(t-state.last)/1000);state.last=t;if(state.q&&!state.q.done){const a=state.q.r,b=state.q.m;const steps=Math.max(1,Math.ceil(dt/.005)),step=dt/steps;for(let i=0;i<steps;i++){physics(a,b,step);physics(b,a,step);collide(a,b);walls(a);walls(b)}if(!state.locked){const c=center(),ar=Math.hypot(a.x-c.x,a.y-c.y),br=Math.hypot(b.x-c.x,b.y-c.y);const radius=Math.max(25,arena.clientWidth*.045);if(ar<radius||br<radius)goal(ar<=br?'r':'m');else if(t-state.qStart>10000)goal(ar<=br?'r':'m')}render()}drawFX(dt);requestAnimationFrame(frame)}
$('start').onclick=start;$('go').onclick=start;$('reset').onclick=reset;$('sound').onclick=sound;game.addEventListener('pointermove',()=>{game.classList.add('showControls');clearTimeout(state.controls);state.controls=setTimeout(()=>game.classList.remove('showControls'),1800)});window.addEventListener('resize',resize);document.addEventListener('keydown',e=>{if(e.key===' '&&!state.started)start();if(e.key.toLowerCase()==='m')sound();if(e.key.toLowerCase()==='r')reset()});
const oldLaunch=launch;launch=()=>{oldLaunch();state.qStart=performance.now()};resize();hud();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
