<script>
(()=>{

function center(){return{x:arena.clientWidth/2,y:arena.clientHeight*.43}}

function updateHud(){rScore.textContent=state.scores.r;mScore.textContent=state.scores.m;roundEl.textContent=state.round;const total=Math.max(1,state.scores.r+state.scores.m);rMeter.style.width=Math.max(8,Math.round(state.scores.r/total*100))+'%';mMeter.style.width=Math.max(8,Math.round(state.scores.m/total*100))+'%';leaderEl.textContent=state.scores.r===state.scores.m?'Even':state.scores.r>state.scores.m?'CR7':'Messi';streakEl.textContent=state.streak.count?`${state.streak.side==='r'?'CR7':'LM'} x${state.streak.count}`:'0';heatEl.textContent=Math.round(state.heat)+'%'}
function speak(text,onEnd){if(!state.sound||!('speechSynthesis'in window)){if(onEnd)setTimeout(onEnd,120);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-IN';u.rate=1.03;u.pitch=1.02;u.volume=.95;u.onend=()=>onEnd&&onEnd();u.onerror=()=>onEnd&&onEnd();speechSynthesis.speak(u)}

function startBeat(){clearTimeout(state.beatTimer);if(!state.sound||!state.started)return;let step=0;const notes=[82,98,110,147,123,110,98,73];const loop=()=>{if(!state.sound||!state.started)return;pulse(notes[step++%notes.length],.025,.08);state.beatTimer=setTimeout(loop,285)};loop()}
function particles(side){const c=center(),color=side==='r'?'#ff3458':'#21d4ff';for(let i=0;i<28;i++){const p=document.createElement('i'),a=Math.random()*Math.PI*2,d=42+Math.random()*118;p.className='particle';p.style.left=c.x+'px';p.style.top=c.y+'px';p.style.setProperty('--c',color);p.style.setProperty('--x',Math.cos(a)*d+'px');p.style.setProperty('--y',Math.sin(a)*d+'px');arena.appendChild(p);setTimeout(()=>p.remove(),820)}}

function updateStreak(side){if(state.streak.side===side)state.streak.count++;else state.streak={side,count:1}}
function finish(side){if(!state.q||state.q.done||state.locked)return;state.q.done=true;state.locked=true;state.scores[side]++;updateStreak(side);state.heat=Math.min(99,state.heat+7+state.streak.count*2);updateHud();cheer();particles(side);flashGoal(side);const player=side==='r'?'Ronaldo':'Messi',text=comments[side][Math.floor(Math.random()*comments[side].length)],winner=state.scores[side]>=10;setMessage(text);const call=winner?`${player} wins the stream match. What a final score.`:`${player} scores. ${text}`;speak(call,()=>setTimeout(()=>{if(winner){setMessage(`${player} wins! Tap reset for a rematch.`);state.locked=false;return}state.round++;countdownRound()},450))}
function countdownRound(){state.locked=true;let n=3;const tick=()=>{countdown.textContent=n>0?n:'GO';countdown.classList.remove('show');void countdown.offsetWidth;countdown.classList.add('show');pulse(n>0?220+n*80:520,.045,.12);if(n-->0)setTimeout(tick,720);else setTimeout(()=>{state.locked=false;launch()},540)};tick()}

function physics(p,op,dt){const c=center();let tx=c.x,ty=c.y;const dx=op.x-p.x,dy=op.y-p.y,od=Math.hypot(dx,dy)||1;const opponentAhead=(p.side==='r'?op.x>p.x:op.x<p.x)&&od<220;if(opponentAhead){tx=op.x;ty=op.y}const x=tx-p.x,y=ty-p.y,d=Math.hypot(x,y)||1;const steer=opponentAhead?185:135;p.vx+=(x/d)*steer*dt;p.vy+=(y/d)*steer*dt;p.vy+=24*dt;p.phase+=dt*3.1;p.vx+=Math.sin(p.phase)*11*dt;p.vy+=Math.cos(p.phase*.73)*5*dt;p.stun=Math.max(0,p.stun-dt);const drag=Math.pow(.993,dt*60);p.vx*=drag;p.vy*=drag;const speed=Math.hypot(p.vx,p.vy),max=opponentAhead?92:82;if(speed>max){p.vx=p.vx/speed*max;p.vy=p.vy/speed*max}if(!p.stun){p.x+=p.vx*dt;p.y+=p.vy*dt}p.spin+=Math.hypot(p.vx,p.vy)*dt*.038}

function walls(p){const w=arena.clientWidth,h=arena.clientHeight,r=Math.max(25,w*.055),bounce=.72;if(p.x<r){p.x=r;p.vx=Math.abs(p.vx)*bounce}if(p.x>w-r){p.x=w-r;p.vx=-Math.abs(p.vx)*bounce}if(p.y<r){p.y=r;p.vy=Math.abs(p.vy)*bounce}if(p.y>h-r){p.y=h-r;p.vy=-Math.abs(p.vy)*bounce}}
function frame(t){const elapsed=Math.min(.04,(t-state.last)/1000);state.last=t;if(state.q){const a=state.q.r,b=state.q.m,steps=Math.max(1,Math.ceil(elapsed/.006)),dt=elapsed/steps;for(let i=0;i<steps;i++){physics(a,b,dt);physics(b,a,dt);collide(a,b);walls(a);walls(b)}if(state.started&&!state.q.done&&!state.locked){const c=center(),target=Math.min(arena.clientWidth*.125,62),ar=Math.hypot(a.x-c.x,a.y-c.y),br=Math.hypot(b.x-c.x,b.y-c.y);if(ar<target||br<target)finish(ar<=br?'r':'m');else if(state.roundStart&&t-state.roundStart>9000)finish(ar<=br?'r':'m')}drawBall(rBall,a);drawBall(mBall,b);drawShadow(rShadow,a);drawShadow(mShadow,b)}requestAnimationFrame(frame)}
function start(){if(state.started)return;state.started=true;state.locked=true;state.q=null;game.classList.add('live-mode');overlay.classList.add('hidden');startBtn.textContent='Running';revealControls();startBeat();bgMusic.currentTime=0;bgMusic.volume=.3;bgMusic.play().catch(()=>{});setMessage('Match starting. Keep the arena centered on stream.');speak('Ronaldo versus Messi. The live arena starts now.',countdownRound)}
function reset(){if('speechSynthesis'in window)speechSynthesis.cancel();state.locked=false;state.round=1;state.heat=50;state.scores={r:0,m:0};state.streak={side:null,count:0};state.q=null;updateHud();setMessage('Fresh match. First to 10 wins.');if(state.started){bgMusic.currentTime=0;if(state.sound)bgMusic.play().catch(()=>{});countdownRound()}}
function toggleSound(){state.sound=!state.sound;soundBtn.textContent=state.sound?'🔊':'🔇';bgMusic.muted=!state.sound;if(state.sound){bgMusic.volume=.3;if(state.started)bgMusic.play().catch(()=>{});startBeat()}else{clearTimeout(state.beatTimer);if('speechSynthesis'in window)speechSynthesis.cancel()}}
function revealControls(){if(!state.started)return;game.classList.add('show-controls');clearTimeout(state.controlsTimer);state.controlsTimer=setTimeout(()=>game.classList.remove('show-controls'),2200)}
startBtn.addEventListener('click',start);overlayStart.addEventListener('click',start);resetBtn.addEventListener('click',reset);soundBtn.addEventListener('click',toggleSound);game.addEventListener('pointermove',revealControls);game.addEventListener('pointerdown',revealControls);document.addEventListener('keydown',e=>{if(e.key===' '&&!state.started)start();if(e.key.toLowerCase()==='m')toggleSound();if(e.key.toLowerCase()==='r')reset()});window.addEventListener('resize',()=>{if(state.q){state.q.r=makeBall('r');state.q.m=makeBall('m')}});updateHud();state.q={r:makeBall('r'),m:makeBall('m'),done:false};requestAnimationFrame(frame);
})();
</script>
