<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff1744"><title>Ronaldo vs Messi</title><style>*{box-sizing:border-box}html,body{margin:0;background:#08000d;font-family:Arial,sans-serif}body{display:flex;justify-content:center}.game{width:min(100vw,560px);height:100vh;aspect-ratio:9/16;position:relative;overflow:hidden;background:linear-gradient(180deg,#ff1970 0,#ff4b00 17%,#ffe600 36%,#00d9ff 65%,#24005e 100%);color:#fff}.top{height:7%;display:grid;place-items:center;font-size:clamp(18px,5vw,28px);font-weight:1000;text-shadow:0 3px 0 #6b005e}.top span{color:#fff}.vs{position:absolute;z-index:12;top:1.5%;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#ff006e,#7b00ff);color:#fff;border:4px solid #fff;border-radius:50%;padding:11px 7px;font-weight:1000;box-shadow:0 0 20px #fff}.live{position:absolute;right:10px;top:10px;z-index:14;background:#ff1744;color:#fff;border:2px solid #fff;border-radius:12px;padding:5px 8px;font-size:10px;font-weight:900;box-shadow:0 0 14px #ff1744}.players{height:20%;display:grid;grid-template-columns:1fr 1fr}.p{text-align:center;font-weight:1000}.pic{width:min(28vw,150px);height:min(28vw,150px);min-width:82px;min-height:82px;border-radius:50%;object-fit:cover;background:#fff;border:7px solid currentColor;box-shadow:0 0 0 4px #fff,0 0 28px currentColor}.r{color:#ff1744}.m{color:#ffe600}.name{font-size:clamp(14px,4vw,23px);margin-top:3px;text-shadow:0 2px 4px #000}.pill{display:inline-block;margin-top:4px;border-radius:20px;padding:6px 14px;color:#fff;font-size:11px;border:2px solid #fff;box-shadow:0 0 12px currentColor}.red{background:#ff1744}.green{background:#00c853}.scores{height:14%;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 8px}.box{display:grid;place-items:center;border-radius:0 0 18px 18px;border:3px solid #fff;box-shadow:0 8px 20px #0006,inset 0 0 30px #fff3}.box:first-child{background:linear- ansform:translate(-50%,-50%) scale(1.8);opacity:0}}.msg{position:absolute;left:50%;top:9%;transform:translateX(-50%);z-index:13;background:#16002f;color:#fff;border:2px solid #fff;border-radius:18px;padding:8px 14px;font-size:12px;font-weight:1000;opacity:0;box-shadow:0 0 20px #ff00aa}.msg.on{animation:msg 1s}@keyframes msg{20%,75%{opacity:1}100%{opacity:0}}.music{position:absolute;right:10px;bottom:10px;z-index:20;border:3px solid #fff;border-radius:50%;width:42px;height:42px;background:#7b00ff;color:#fff;font-size:18px;box-shadow:0 0 16px #fff}.start{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);z-index:30;background:#16002f;color:#fff;border:3px solid #fff;border-radius:22px;padding:14px 22px;font-size:15px;font-weight:1000;box-shadow:0 0 30px #ff00aa;animation:pulse 1s infinite}.start.hide{display:none}@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.05)}}.credit{position:absolute;bottom:5px;left:0;right:0;text-align:center;color:#fff9;font-size:8px;text-shadow:0 1px 2px #000;z-index:15}</style></head><body><main class="game"><div class="top">RONALDO <span>VS</span> MESSI</div><div class="vs">VS</div><div class="live">● LIVE</div><section class="players"><div class="p r"><img class="pic" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Cristiano_Ronaldo_2275_(cropped).jpg"><div class="name">RONALDO</div><span class="pill red">⚽ GOAL</span></div><div class="p m"><img class="pic" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Lionel_Messi_NYCFC_Miami_24_Sep_2025-096.jpg"><div class="name">MESSI</div><span class="pill green">⚽ GOAL</span></div></section><section class="scores"><div class="box"><div id="rs" class="num">0</div></div><div class="box"><div id="ms" class="num">0</div></div></section><section id="arena" class="arena"><div class="floor"></div><div class="goal"></div><div id="rsd" class="shadow"></div><div id="msd" class="shadow"></div><div id="rb" class="ball rb"></div><div id="mb" class="ball mb"></div><div id="flash" class="flash"></div><div id="msg" class="msg"></div></section><button id="music" class="music">🔇</button><button id="start" class="start">▶ TAP TO START</button><div class="credit">Black circle = gravity centre • Voice + music • Physics</div></main><script>(()=>{const A=document.getElementById('arena'),R=document.getElementById('rb'),M=document.getElementById('mb'),RS=document.getElementById('rs'),MS=document.getElementById('ms'),RSD=document.getElementById('rsd'),MSD=document.getElementById('msd'),F=document.getElementById('flash'),MSG=document.getElementById('msg'),MB=document.getElementById('music'),START=document.getElementById('start');let score={r:0,m:0},q,last=performance.now(),started=false;const C=()=>({x:A.clientWidth/2,y:A.clientHeight*.48});function make(s){let c=C(),x=c.x+(s==='r'?-Math.min(A.clientWidth*.43,240):Math.min(A.clientWidth*.43,240));/* Real throw: inward horizontal velocity plus a small upward component. */let speed=320,ang=s==='r'?-0.20:-Math.PI+0.20;return{x,y:8,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed,spin:0}}function startRound(){q={r:make('r'),m:make('m'),done:false};if(started)say('Ronaldo versus Messi. Who will score?')}function draw(e,p){e.style.left=p.x+'px';e.style.top=p.y+'px';e.style.transform=`translate(-50%,-50%) rotate(${p.spin}rad)`}function sh(e,p){e.style.left=p.x+'px';e.style.top=p.y+10+'px';e.style.transform='translate(-50%,-50%)'}function say(text){if(!started||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-IN';u.rate=.98;u.pitch=1.02;u.volume=.9;speechSynthesis.speak(u)}function goal(s){if(q.done)return;q.done=true;score[s]++;(s==='r'?RS:MS).textContent=score[s];let winner=s==='r'?'Ronaldo':'Messi';MSG.textContent='⚽ '+winner.toUpperCase()+' SCORES!';MSG.classList.remove('on');void MSG.offsetWidth;MSG.classList.add('on');F.classList.remove('on');void F.offsetWidth;F.classList.add('on');say(winner+' scores! What a finish!');setTimeout(startRound,800)}function physics(p,c,dt){let dx=c.x-p.x,dy=c.y-p.y,r2=dx*dx+dy*dy,r=Math.sqrt(r2)||1;/* Black circle is the sole gravitational source. Softened inverse-square law prevents singularity. */let G=115000,soft=900,a=G/(r2+soft);p.vx+=dx/r*a*dt;p.vy+=dy/r*a*dt;/* light air resistance: speed slowly decays, but gravity remains dominant */let drag=Math.pow(.997,dt*60);p.vx*=drag;p.vy*=drag;p.x+=p.vx*dt;p.y+=p.vy*dt;p.spin+=Math.hypot(p.vx,p.vy)*dt/.08}function frame(t){let elapsed=Math.min(.04,(t-last)/1000);last=t;if(q){let w=A.clientWidth,h=A.clientHeight,c=C(),goalR=Math.min(w*.105,68),a=q.r,b=q.m;/* 120-240 Hz physics substeps make fast collisions stable and frame-rate independent. */let steps=Math.max(1,Math.ceil(elapsed/.005)),dt=elapsed/steps;for(let s=0;s<steps;s++){physics(a,c,dt);physics(b,c,dt);let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,min=Math.max(48,w*.095);if(d<min){let nx=dx/d,ny=dy/d,rvx=b.vx-a.vx,rvy=b.vy-a.vy,rel=rvx*nx+rvy*ny;if(rel<0){/* Equal-mass elastic collision. Tangential velocity is preserved. */a.vx+=rel*nx;a.vy+=rel*ny;b.vx-=rel*nx;b.vy-=rel*ny}let overlap=min-d;a.x-=nx*overlap/2;a.y-=ny*overlap/2;b.x+=nx*overlap/2;b.y+=ny*overlap/2}}/* Soft walls: balls bounce with restitution rather than sticking. */[a,b].forEach(p=>{let r=32,restitution=.72;if(p.x<r){p.x=r;p.vx=Math.abs(p.vx)*restitution}if(p.x>w-r){p.x=w-r;p.vx=-Math.abs(p.vx)*restitution}if(p.y<r){p.y=r;p.vy=Math.abs(p.vy)*restitution}if(p.y>h-r){p.y=h-r;p.vy=-Math.abs(p.vy)*restitution}});if(!q.done){if(Math.hypot(a.x-c.x,a.y-c.y)<goalR)goal('r');else if(Math.hypot(b.x-c.x,b.y-c.y)<goalR)goal('m')}draw(R,a);draw(M,b);sh(RSD,a);sh(MSD,b)}requestAnimationFrame(frame)}startRound();requestAnimationFrame(frame);let ac=null,master=null,on=false,seqTimer=null;function musicOn(){if(on)return;ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();master=master||ac.createGain();master.gain.value=.035;master.connect(ac.destination);let notes=[82.41,98,110,123.47,146.83,123.47,110,98],i=0;function beat(){if(!on)return;let now=ac.currentTime;[0,2,4,6].forEach((off,k)=>{let o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=notes[(i+off)%notes.length];g.gain.setValueAtTime(.0001,now+k*.055);g.gain.exponentialRampToValueAtTime(.09,now+k*.055+.008);g.gain.exponentialRampToValueAtTime(.0001,now+k*.055+.07);o.connect(g);g.connect(master);o.start(now+k*.055);o.stop(now+k*.055+.08)});i=(i+1)%notes.length;seqTimer=setTimeout(beat,360)}on=true;MB.textContent='🔊';beat()}function musicOff(){on=false;clearTimeout(seqTimer);if(master&&ac)master.gain.setTargetAtTime(.0001,ac.currentTime,.04);MB.textContent='🔇'}function activate(){if(started)return;started=true;START.classList.add('hide');musicOn();say('Ronaldo versus Messi! Let the battle begin!');startRound()}START.onclick=activate;A.onclick=()=>{if(!started)activate()};MB.onclick=e=>{e.stopPropagation();if(!started)activate();else on?musicOff():musicOn()}})();</script></body></html>
