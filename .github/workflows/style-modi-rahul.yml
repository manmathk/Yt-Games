name: Style Modi Rahul Game

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  style:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve UI and shrink arena
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('modi-rahul/index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            '.game{position:relative;width:min(100vw,540px);height:min(100vh,960px);aspect-ratio:9/16;overflow:hidden;background:#050505;box-shadow:0 0 0 1px #fff2,0 25px 80px #000}':
            '.game{position:relative;width:min(100vw,540px);height:min(100vh,960px);aspect-ratio:9/16;overflow:hidden;background:radial-gradient(circle at 50% 18%,#192f40 0,#08131d 34%,#020307 76%);border:1px solid #ffffff22;border-radius:24px;box-shadow:0 0 0 1px #ffffff10,0 18px 70px #000,0 0 60px #19c6ff10}',
            '.top{position:absolute;inset:0 0 auto;height:31%;padding:10px 12px;z-index:20}':
            '.top{position:absolute;inset:0 0 auto;height:31%;padding:8px 10px;z-index:20}',
            '.players{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:7px}':
            '.players{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:6px}',
            '.player{display:grid;justify-items:center;padding:7px;border:1px solid #fff3;border-radius:14px;background:linear-gradient(180deg,#ffffff1b,#ffffff06);box-shadow:0 14px 35px #0007}':
            '.player{display:grid;justify-items:center;padding:6px;border:1px solid #ffffff28;border-radius:16px;background:linear-gradient(145deg,#ffffff18,#ffffff05);box-shadow:0 10px 28px #0009,inset 0 1px #fff2}',
            '.avatar{width:clamp(65px,18.5vw,102px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 3px var(--c),0 0 28px var(--c)}':
            '.avatar{width:clamp(58px,16.5vw,90px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 3px var(--c),0 0 24px var(--c)}',
            '.score{font-size:clamp(38px,10.5vw,66px);line-height:.88;font-weight:1000;text-shadow:0 3px #0008,0 0 22px var(--c)}':
            '.score{font-size:clamp(32px,9vw,56px);line-height:.88;font-weight:1000;text-shadow:0 3px #0008,0 0 22px var(--c)}',
            '.arena{position:absolute;inset:27.5% 0 14%;overflow:hidden;background:#000}':
            '.arena{position:absolute;inset:31% 5% 24%;overflow:hidden;background:linear-gradient(180deg,#050a10,#010204);border:1px solid #ffffff24;border-radius:20px;box-shadow:inset 0 0 35px #19c6ff08,0 12px 30px #0008}',
            '.ground{position:absolute;inset:0;background:#000}':
            '.ground{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,#173244 0,#07111a 45%,#010205 100%)}',
            '.platform{position:absolute;left:-18%;right:-18%;bottom:-18%;height:78%;transform:rotateX(58deg);transform-origin:bottom;background:#000;border-top:4px solid #fff9;box-shadow:inset 0 0 0 2px #fff3,0 -20px 50px #000}':
            '.platform{position:absolute;left:8%;right:8%;bottom:-35%;height:68%;transform:rotateX(58deg);transform-origin:bottom;background:linear-gradient(180deg,#07111a,#020406);border:1px solid #ffffff18;border-top:3px solid #ffffffaa;border-radius:18px;box-shadow:inset 0 0 0 1px #ffffff12,0 -18px 38px #000}',
            '.hole{position:absolute;left:50%;top:43%;width:clamp(82px,20vw,110px);aspect-ratio:1;z-index:10;transform:translate(-50%,-50%);border-radius:50%;background:#000;box-shadow:0 0 0 3px #fff5,0 0 0 12px #ffb00022,0 0 45px #000,0 0 80px #ffb00033}':
            '.hole{position:absolute;left:50%;top:43%;width:clamp(70px,17vw,96px);aspect-ratio:1;z-index:10;transform:translate(-50%,-50%);border-radius:50%;background:#000;box-shadow:0 0 0 2px #fff5,0 0 0 9px #ffb00022,0 0 35px #000,0 0 60px #ffb00033}',
            '.bottom{position:absolute;left:12px;right:12px;bottom:10px;z-index:22;display:grid;gap:7px}':
            '.bottom{position:absolute;left:10px;right:10px;bottom:8px;z-index:22;display:grid;gap:6px}',
            '.stat{padding:6px;text-align:center;border:1px solid #fff2;border-radius:10px;background:#061015e8}':
            '.stat{padding:5px;text-align:center;border:1px solid #ffffff22;border-radius:11px;background:linear-gradient(180deg,#0a1720ee,#04090eee);box-shadow:inset 0 1px #fff1}',
            '.ticker{min-height:34px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 9px;border:1px solid #fff2;border-radius:10px;background:#ffffff12;font-size:clamp(10px,2.8vw,14px);font-weight:900}':
            '.ticker{min-height:31px;display:flex;align-items:center;justify-content:center;text-align:center;padding:5px 8px;border:1px solid #ffffff22;border-radius:11px;background:linear-gradient(90deg,#ffffff0b,#19c6ff10,#ffffff0b);font-size:clamp(9px,2.6vw,13px);font-weight:900;box-shadow:inset 0 1px #fff1}'
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'Missing expected UI text: {old[:80]}')
            s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modi-rahul/index.html
          git rm .github/workflows/style-modi-rahul.yml
          git commit -m 'Make Modi Rahul UI eye-catching and shrink ground'
          git push
