name: Boost Modi Rahul Ball Speed

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  boost-speed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase ball speed
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('modi-rahul/index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'v=170+rand()*38': 'v=380+rand()*120',
              'let strength=235000/Math.max(1600,d*d)': 'let strength=360000/Math.max(1200,d*d)',
              'const sp=Math.hypot(p.vx,p.vy),max=300': 'const sp=Math.hypot(p.vx,p.vy),max=700',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modi-rahul/index.html
          git rm .github/workflows/boost-modi-rahul-speed.yml
          git commit -m 'Increase Modi Rahul ball speed'
          git push
