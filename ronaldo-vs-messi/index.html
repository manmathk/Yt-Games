<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOAT WAR — Ronaldo vs Messi</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:Arial,Helvetica,sans-serif}body{display:grid;place-items:center}.stage{width:100vw;aspect-ratio:16/9;max-height:100vh;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 30%,#183229,#07110f 43%,#030508)}canvas{position:absolute;inset:0;width:100%;height:100%}.hud{position:absolute;inset:0;pointer-events:none}.title{position:absolute;top:2%;left:50%;transform:translateX(-50%);font-size:clamp(18px,3vw,45px);font-weight:1000;letter-spacing:.08em;text-shadow:0 3px 18px #000;text-align:center}.subtitle{display:block;font-size:.34em;letter-spacing:.22em;opacity:.72}.score{position:absolute;top:3%;display:flex;align-items:center;gap:12px;font-weight:900}.score.left{left:2.7%}.score.right{right:2.7%}.badge{padding:8px 13px;border:1px solid #ffffff24;background:#0009;border-radius:12px}.scoreNum{font-size:clamp(30px,5vw,70px);line-height:1}.timer{position:absolute;top:10%;left:50%;transform:translateX(-50%);font-weight:1000;font-size:clamp(18px,3vw,40px);padding:6px 17px;border-radius:12px;background:#000b;border:1px solid #ffffff22}.bar{position:absolute;top:17%;left:18%;right:18%;height:13px;border-radius:99px;background:#111a;overflow:hidden;border:1px solid #ffffff22}.bar i{display:block;height:100%;width:50%;background:linear-gradient(90deg,#278cff,#fff,#ff3c5a);transform-origin:center}.event{position:absolute;top:20%;left:50%;transform:translateX(-50%) scale(.9);font-weight:1000;font-size:clamp(13px,2.2vw,32px);letter-spacing:.08em;padding:9px 20px;border-radius:999px;background:#000b;border:1px solid #ffffff22;opacity:0;transition:.22s}.event.show{opacity:1;transform:translateX(-50%) scale(1)}.bottom{position:absolute;left:2.7%;right:2.7%;bottom:2.8%;display:flex;gap:14px;align-items:flex-end;justify-content:space-between}.panel{background:#0009;border:1px solid #ffffff18;border-radius:14px;padding:11px 14px;min-width:235px;backdrop-filter:blur(8px)}.panel h3{margin:0 0 6px;font-size:11px;letter-spacing:.18em;opacity:.65}.names{font-size:13px;line-height:1.45;max-height:82px;overflow:hidden}.centerMsg{text-align:center;flex:1;font-weight:1000;font-size:clamp(12px,1.7vw,24px);text-shadow:0 2px 10px #000}.centerMsg small{display:block;opacity:.55;font-size:.56em;margin-top:4px}.mvp{text-align:right}.flash{position:absolute;inset:0;background:#fff;opacity:0}.flash.on{animation:flash .45s ease-out}.goal{position:absolute;inset:0;display:grid;place-items:center;opacity:0}.goal.show{animation:goal 2.7s ease-out}.goal div{text-align:center}.goal span{font-size:clamp(40px,9.5vw,145px);font-weight:1000;text-shadow:0 8px 35px #000}.goal small{display:block;font-size:.2em;letter-spacing:.25em}.controls{position:absolute;top:2.6%;right:2.7%;display:flex;gap:6px;pointer-events:auto}.controls button{background:#000a;color:#fff;border:1px solid #fff2;border-radius:9px;padding:7px 10px;font-weight:800;cursor:pointer}@keyframes goal{0%{opacity:0;transform:scale(.72)}12%{opacity:1;transform:scale(1.02)}55%{opacity:1}100%{opacity:0;transform:scale(1.08)}}@keyframes flash{25%{opacity:.85}100%{opacity:0}}@media(max-width:800px){.panel{min-width:175px;padding:8px}.bottom{gap:7px}.bar{left:10%;right:10%}}</style></head><body><main class="stage"><canvas id="c"></canvas><div class="hud"><div class="title">GOAT WAR<span class="subtitle">RONALDO VS MESSI • LIVE ARENA</span></div><div class="score left"><div class="badge">⚡ RONALDO</div><div id="rs" class="scoreNum">0</div></div><div class="score right"><div id="ms" class="scoreNum">0</div><div class="badge">🔥 MESSI</div></div><div id="timer" class="timer">01:30</div><div class="bar"><i id="momentum"></i></div><div id="event" class="event">MATCH START</div><div class="bottom"><section class="panel"><h3>TOP SUPPORTERS</h3><div id="supporters" class="names"></div></section><div class="centerMsg"><div id="status">CHOOSE YOUR GOAT</div><small>Autoplay • commentator • adaptive stadium music</small></div><section class="panel mvp"><h3>FAN MVP</h3><div id="mvp" class="names">—</div></section></div><div id="goal" class="goal"><div><span id="goalText">GOAL!</span><small id="goalSub">THE GOAT STRIKES</small></div></div><div id="flash" class="flash"></div><div class="controls"><button id="sound">🔊 SOUND</button><button id="skip">NEXT MATCH</button></div></div></main><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let W=1280,H=720,score={r:0,m:0},t=90,last=performance.now(),ball={x:.5,y:.55,vx:.0018,vy:0},particles=[],supporters=new Map(),momentum=0,commentary=0,muted=false,audio=null,musicTimer=null;
const roster=['Aryan','Rahul','MK','Ravi','LeoFan','GoatKing','MessiMagic','C7Legend','FootballPro','Neeraj','Sam','Alex','Vikram','RonaldoBoy','Messi10'];
const lines=['WHAT A CHANCE!','THE CROWD IS ERUPTING!','END-TO-END ACTION!','THE PRESSURE IS BUILDING!','WHO WANTS IT MORE?','THIS IS ABSOLUTE CHAOS!','THE GOAT WAR IS HEATING UP!'];
function resize(){const d=Math.min(devicePixelRatio||1,2);W=Math.floor(c.clientWidth*d);H=Math.floor(c.clientHeight*d);c.width=W;c.height=H}addEventListener('resize',resize);resize();
const rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];function say(x){$('status').textContent=x}
function voice(text,priority=false){if(muted||!('speechSynthesis'in window))return;if(!priority&&Math.random()>.75)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=1.02;u.pitch=.82;u.volume=.75;speechSynthesis.speak(u)}catch{}}
function tone(f,d=.1,type='sine',vol=.045){if(muted)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(vol,audio.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d+.02)}catch{}}
function startMusic(){if(musicTimer||muted)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();let step=0;musicTimer=setInterval(()=>{if(muted)return;const notes=[110,130.81,146.83,164.81,146.83,130.81,98,123.47];tone(notes[step++%notes.length],.22,'triangle',.018);if(Math.random()<.16)tone(220,.08,'square',.012)},250)}catch{}}
function renderSupporters(){const arr=[...supporters.entries()].sort((a,b)=>b[1].pts-a[1].pts).slice(0,5);$('supporters').innerHTML=arr.map(([n,v],i)=>`${i+1}. ${n} <b>${v.pts}</b> <span style="opacity:.55">${v.side==='r'?'⚡R':'🔥M'}</span>`).join('<br>');$('mvp').textContent=arr[0]?`${arr[0][0]} • ${arr[0][1].pts} pts`:'—'}
function seed(){supporters.clear();roster.forEach((n,i)=>supporters.set(n,{side:i%2?'m':'r',pts:Math.floor(rand(10,90))}));renderSupporters()}
function addPoints(){const side=Math.random()<.5?'r':'m',n=pick(roster),v=supporters.get(n)||{side,pts:0};v.side=side;v.pts+=Math.floor(rand(4,18));supporters.set(n,v);momentum+=side==='r'?.018:-.018;momentum=Math.max(-1,Math.min(1,momentum));renderSupporters()}
function field(){ctx.fillStyle='#06120d';ctx.fillRect(0,0,W,H);ctx.fillStyle='#0c2b1d';ctx.fillRect(W*.06,H*.21,W*.88,H*.68);ctx.strokeStyle='#dff6e955';ctx.lineWidth=3;ctx.strokeRect(W*.06,H*.21,W*.88,H*.68);ctx.beginPath();ctx.moveTo(W*.5,H*.21);ctx.lineTo(W*.5,H*.89);ctx.arc(W*.5,H*.55,H*.11,0,Math.PI*2);ctx.stroke();ctx.strokeRect(W*.06,H*.39,W*.09,H*.32);ctx.strokeRect(W*.85,H*.39,W*.09,H*.32);for(let i=0;i<9;i++){ctx.fillStyle=`rgba(255,255,255,${.02+i*.004})`;ctx.fillRect(0,H*(.18-i*.014),W,3)}}
function player(x,y,side,label,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.fillStyle=side==='r'?'#238fff':'#ff3e59';ctx.beginPath();ctx.arc(0,-17,11,0,Math.PI*2);ctx.fill();ctx.fillRect(-9,-7,18,26);ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-4,19);ctx.lineTo(-11,37);ctx.moveTo(4,19);ctx.lineTo(11,37);ctx.stroke();ctx.fillStyle='#fff';ctx.font='900 10px Arial';ctx.textAlign='center';ctx.fillText(label,0,-31);ctx.restore()}
function ballDraw(){ctx.save();ctx.shadowBlur=18;ctx.shadowColor='#fff';ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x*W,ball.y*H,Math.max(5,W*.006),0,Math.PI*2);ctx.fill();ctx.restore()}
function burst(x,y){for(let i=0;i<65;i++)particles.push({x,y,vx:rand(-6,6),vy:rand(-6,1),life:rand(25,65),s:rand(2,7)})}
function parts(){particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life--});particles=particles.filter(p=>p.life>0);particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/65);ctx.fillStyle='#fff';ctx.fillRect(p.x,p.y,p.s,p.s)});ctx.globalAlpha=1}
function event(){const e=pick(['⚡ POWER SURGE','🧊 ICE DEFENSE','🔥 2X MOMENTUM','🌪️ CHAOS BOUNCE','👑 GOAT MODE']);$('event').textContent=e;$('event').classList.add('show');setTimeout(()=>$('event').classList.remove('show'),1450);momentum=Math.max(-1,Math.min(1,momentum+rand(-.28,.28)));say(e);voice(e.replace(/[⚡🧊🔥🌪️👑]/g,''),true);tone(260,.12,'square',.05)}
function goal(side){score[side]++;$('rs').textContent=score.r;$('ms').textContent=score.m;ball.x=side==='r'?.34:.66;ball.vx=side==='r'?.0018:-.0018;$('goalText').textContent=side==='r'?'RONALDO GOAL!':'MESSI GOAL!';$('goalSub').textContent=side==='r'?'POWER FINISH':'MAGIC FINISH';$('goal').classList.remove('show');void $('goal').offsetWidth;$('goal').classList.add('show');$('flash').classList.remove('on');void $('flash').offsetWidth;$('flash').classList.add('on');burst(side==='r'?W*.92:W*.08,H*.55);const text=side==='r'?'RONALDO STRIKES!':'MESSI MAGIC!';say(text);voice(side==='r'?'GOAL! Ronaldo strikes!':'GOAL! Messi with magic!',true);tone(side==='r'?440:523,.24,'sawtooth',.075);setTimeout(()=>{voice('The match continues!',false);say('MATCH CONTINUES...')},1900)}
function reset(){score={r:0,m:0};t=90;momentum=0;ball={x:.5,y:.55,vx:Math.random()<.5?.0018:-.0018,vy:0};seed();say('CHOOSE YOUR GOAT');voice('Welcome to the Goat War! Ronaldo versus Messi.');startMusic()}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;t-=dt;if(t<=0){const w=score.r===score.m?(Math.random()<.5?'r':'m'):(score.r>score.m?'r':'m');goal(w);setTimeout(reset,3200);t=90}addPoints();if(Math.random()<dt*.10)event();ball.x+=ball.vx*(1+Math.abs(momentum)*2);ball.y+=Math.sin(now*.002)*.00035;if(ball.x<.075||ball.x>.925){const side=ball.x>.925?'r':'m';if(Math.random()<.43)goal(side);else{ball.vx*=-1;momentum+=side==='r'?.12:-.12}}ball.y=Math.max(.3,Math.min(.82,ball.y));commentary+=dt;if(commentary>6){commentary=0;say(pick(lines));voice(pick(lines),false)}field();const rr=Math.max(.10,Math.min(.90,.24+Math.sin(now*.0011)*.12+momentum*.12)),mm=Math.max(.10,Math.min(.90,.76+Math.cos(now*.001)*.1+momentum*.1));player(rr*W,H*.55,'r','R');player(mm*W,H*.55,'m','M');player(W*.33,H*.39,'r','',.9);player(W*.67,H*.72,'m','',.9);ballDraw();parts();$('momentum').style.width=(50+momentum*42)+'%';$('momentum').style.transform=momentum>=0?'translateX(0)':'translateX('+momentum*42+'%)';$('timer').textContent=`01:${String(Math.max(0,Math.ceil(t))).padStart(2,'0')}`.slice(-5);requestAnimationFrame(loop)}
$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇 SOUND':'🔊 SOUND';if(!muted){startMusic();voice('Sound on. Let the Goat War begin!',true);tone(520,.1)}};$('skip').onclick=()=>{reset();tone(330,.1)};seed();requestAnimationFrame(loop);</script></body></html>
