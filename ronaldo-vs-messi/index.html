<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOAT WAR — Ronaldo vs Messi</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:Arial,Helvetica,sans-serif}body{display:grid;place-items:center}.stage{width:100vw;aspect-ratio:16/9;max-height:100vh;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 30%,#183229 0,#07110f 42%,#030508 100%)}canvas{position:absolute;inset:0;width:100%;height:100%}.hud{position:absolute;inset:0;pointer-events:none}.title{position:absolute;top:2.3%;left:50%;transform:translateX(-50%);font-size:clamp(18px,3vw,44px);font-weight:900;letter-spacing:.09em;text-shadow:0 3px 15px #000;text-align:center}.subtitle{display:block;font-size:.35em;letter-spacing:.22em;opacity:.7;margin-top:4px}.score{position:absolute;top:3%;display:flex;align-items:center;gap:14px;font-weight:900}.score.left{left:3%}.score.right{right:3%}.badge{display:flex;align-items:center;gap:10px;padding:9px 14px;border:1px solid #ffffff22;background:#0008;border-radius:14px;backdrop-filter:blur(8px)}.dot{width:12px;height:12px;border-radius:50%;background:currentColor;box-shadow:0 0 18px currentColor}.scoreNum{font-size:clamp(30px,5vw,72px);line-height:1}.timer{position:absolute;top:10%;left:50%;transform:translateX(-50%);font-weight:900;font-size:clamp(18px,3vw,42px);padding:7px 18px;border-radius:12px;background:#0009;border:1px solid #ffffff22}.bar{position:absolute;top:17%;left:18%;right:18%;height:14px;border-radius:99px;background:#111a;overflow:hidden;border:1px solid #ffffff22}.bar i{display:block;height:100%;width:50%;background:linear-gradient(90deg,#1e88ff,#fff 50%,#ff3d55);transform-origin:center}.event{position:absolute;top:20%;left:50%;transform:translateX(-50%) scale(.9);font-weight:1000;font-size:clamp(14px,2.4vw,34px);letter-spacing:.08em;padding:10px 22px;border-radius:999px;background:#000b;border:1px solid #ffffff22;opacity:0;transition:.25s}.event.show{opacity:1;transform:translateX(-50%) scale(1)}.bottom{position:absolute;left:3%;right:3%;bottom:3%;display:flex;gap:18px;align-items:flex-end;justify-content:space-between}.panel{background:#0008;border:1px solid #ffffff18;border-radius:16px;padding:12px 16px;min-width:240px;backdrop-filter:blur(10px)}.panel h3{margin:0 0 7px;font-size:12px;letter-spacing:.18em;opacity:.65}.names{font-size:14px;line-height:1.45;max-height:80px;overflow:hidden}.centerMsg{text-align:center;flex:1;font-weight:900;font-size:clamp(12px,1.7vw,24px);text-shadow:0 2px 10px #000}.centerMsg small{display:block;opacity:.55;font-size:.58em;margin-top:4px}.mvp{text-align:right}.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.flash.on{animation:flash .45s ease-out}@keyframes flash{0%{opacity:0}.12%{opacity:.0}25%{opacity:.8}100%{opacity:0}}.goal{position:absolute;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none}.goal.show{animation:goal 2.8s ease-out}.goal span{font-size:clamp(42px,10vw,150px);font-weight:1000;text-shadow:0 8px 35px #000;letter-spacing:.04em}.goal small{display:block;font-size:.2em;letter-spacing:.25em;text-align:center}.controls{position:absolute;top:2.8%;right:3%;display:flex;gap:6px;pointer-events:auto}.controls button{background:#000a;color:#fff;border:1px solid #fff2;border-radius:10px;padding:8px 11px;font-weight:800;cursor:pointer}@keyframes goal{0%{opacity:0;transform:scale(.72)}12%{opacity:1;transform:scale(1.02)}55%{opacity:1}100%{opacity:0;transform:scale(1.08)}}@media(max-width:800px){.panel{min-width:180px;padding:8px}.bottom{gap:8px}.bar{left:10%;right:10%}}</style></head><body><main class="stage"><canvas id="c"></canvas><div class="hud"><div class="title">GOAT WAR<span class="subtitle">RONALDO VS MESSI • LIVE ARENA</span></div><div class="score left"><div class="badge" style="color:#3ca7ff"><span class="dot"></span>RONALDO</div><div id="rs" class="scoreNum">0</div></div><div class="score right"><div id="ms" class="scoreNum">0</div><div class="badge" style="color:#ff4764"><span class="dot"></span>MESSI</div></div><div id="timer" class="timer">01:30</div><div class="bar"><i id="momentum"></i></div><div id="event" class="event">MATCH START</div><div class="bottom"><section class="panel"><h3>TOP SUPPORTERS</h3><div id="supporters" class="names"></div></section><div class="centerMsg"><div id="status">CHOOSE YOUR GOAT</div><small id="hint">Autoplay simulation • Chat adapter ready for later</small></div><section class="panel mvp"><h3>FAN MVP</h3><div id="mvp" class="names">—</div></section></div><div id="goal" class="goal"><div><span id="goalText">GOAL!</span><small id="goalSub">THE GOAT STRIKES</small></div></div><div class="flash" id="flash"></div><div class="controls"><button id="sound">🔊 SOUND</button><button id="skip">NEXT MATCH</button></div></div></main><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let W=1280,H=720,score={r:0,m:0},t=90,last=performance.now(),running=true,ball={x:.5,y:.53,vx:.002,vy:0},players=[],particles=[],supporters=new Map(),momentum=0,commentaryTimer=0,muted=false,audioCtx=null;
function resize(){const r=Math.min(devicePixelRatio||1,2);W=Math.floor(c.clientWidth*r);H=Math.floor(c.clientHeight*r);c.width=W;c.height=H}addEventListener('resize',resize);resize();
function rand(a,b){return a+Math.random()*(b-a)}function pick(a){return a[Math.floor(Math.random()*a.length)]}
function say(text){$('status').textContent=text}
const names=['Aryan','Rahul','MK','Ravi','LeoFan','GoatKing','MessiMagic','C7Legend','FootballPro','Neeraj','Sam','Alex','Vikram','RonaldoBoy','Messi10'];
function seedCrowd(){supporters.clear();names.forEach((n,i)=>supporters.set(n,{side:i%2?'m':'r',pts:Math.floor(rand(10,90))}));renderSupporters()}
function renderSupporters(){const arr=[...supporters.entries()].sort((a,b)=>b[1].pts-a[1].pts).slice(0,5);$('supporters').innerHTML=arr.map(([n,v],i)=>`${i+1}. ${n} <b>${v.pts}</b> <span style="opacity:.55">${v.side==='r'?'⚡R':'🔥M'}</span>`).join('<br>');const top=arr[0];$('mvp').textContent=top?`${top[0]} • ${top[1].pts} pts`:'—'}
function addPoints(){let side=Math.random()<.5?'r':'m';let idx=Math.floor(rand(0,names.length)),n=names[idx];let v=supporters.get(n)||{side,pts:0};v.side=side;v.pts+=Math.floor(rand(4,18));supporters.set(n,v);momentum+=side==='r'?.018:-.018;momentum=Math.max(-1,Math.min(1,momentum));renderSupporters()}
function field(){ctx.fillStyle='#0b241a';ctx.fillRect(0,0,W,H);const pad=W*.06;ctx.fillStyle='#0f3424';ctx.fillRect(pad,H*.21,W-pad*2,H*.68);ctx.strokeStyle='#c9e8d844';ctx.lineWidth=3;ctx.strokeRect(pad,H*.21,W-pad*2,H*.68);ctx.beginPath();ctx.moveTo(W*.5,H*.21);ctx.lineTo(W*.5,H*.89);ctx.stroke();ctx.beginPath();ctx.arc(W*.5,H*.55,H*.11,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#dff';ctx.beginPath();ctx.arc(W*.5,H*.55,4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.strokeRect(pad,H*.39,W*.09,H*.32);ctx.strokeRect(W-pad-W*.09,H*.39,W*.09,H*.32);for(let i=0;i<8;i++){ctx.fillStyle=`rgba(255,255,255,${.025+i*.005})`;ctx.fillRect(0,H*(.18-i*.017),W,3)}}
function player(x,y,side,label){ctx.save();ctx.translate(x,y);ctx.fillStyle=side==='r'?'#2b8cff':'#ff3f59';ctx.beginPath();ctx.arc(0,-17,11,0,Math.PI*2);ctx.fill();ctx.fillRect(-9,-7,18,26);ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-4,19);ctx.lineTo(-11,37);ctx.moveTo(4,19);ctx.lineTo(11,37);ctx.stroke();ctx.fillStyle='#fff';ctx.font='900 11px Arial';ctx.textAlign='center';ctx.fillText(label,0,-32);ctx.restore()}
function ballDraw(){ctx.save();ctx.shadowBlur=18;ctx.shadowColor='#fff';ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x*W,ball.y*H,Math.max(5,W*.006),0,Math.PI*2);ctx.fill();ctx.restore()}
function burst(x,y){for(let i=0;i<55;i++)particles.push({x,y,vx:rand(-5,5),vy:rand(-5,5),life:rand(25,60),s:rand(2,6)})}
function updateParticles(){particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life--});particles=particles.filter(p=>p.life>0)}function drawParticles(){particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/60);ctx.fillStyle='#fff';ctx.fillRect(p.x,p.y,p.s,p.s)});ctx.globalAlpha=1}
function goal(side){score[side]++;$('rs').textContent=score.r;$('ms').textContent=score.m;ball.x=side==='r'?.34:.66;ball.vx=side==='r'?.0018:-.0018;ball.vy=rand(-.002,.002);$('goalText').textContent=side==='r'?'RONALDO GOAL!':'MESSI GOAL!';$('goalSub').textContent=side==='r'?'POWER FINISH':'MAGIC FINISH';$('goal').classList.remove('show');void $('goal').offsetWidth;$('goal').classList.add('show');$('flash').classList.remove('on');void $('flash').offsetWidth;$('flash').classList.add('on');burst(side==='r'?W*.92:W*.08,H*.55);say(side==='r'?'RONALDO STRIKES!':'MESSI MAGIC!');playTone(side==='r'?440:523,.15);setTimeout(()=>say('MATCH CONTINUES...'),1800)}
function event(){const e=pick(['⚡ POWER SURGE','🧊 ICE DEFENSE','🔥 2X MOMENTUM','🌪️ CHAOS BOUNCE','👑 GOAT MODE']);$('event').textContent=e;$('event').classList.add('show');setTimeout(()=>$('event').classList.remove('show'),1450);momentum+=rand(-.28,.28);momentum=Math.max(-1,Math.min(1,momentum));say(e);playTone(260,.08)}
function reset(){score={r:0,m:0};t=90;momentum=0;ball={x:.5,y:.55,vx:pick([-.0018,.0018]),vy:0};seedCrowd();say('CHOOSE YOUR GOAT');}
function tick(now){const dt=Math.min(0.05,(now-last)/1000);last=now;if(running){t-=dt;if(t<=0){const winner=score.r===score.m?(Math.random()<.5?'r':'m'):(score.r>score.m?'r':'m');goal(winner);setTimeout(reset,3300);t=90}addPoints();if(Math.random()<dt*.11)event();ball.x+=ball.vx*(1+Math.abs(momentum)*2);ball.y+=Math.sin(now*.002)*.00035;if(ball.x<.07||ball.x>.93){const side=ball.x>.93?'r':'m';if(Math.random()<.45)goal(side);else{ball.vx*=-1;momentum+=(side==='r'?.12:-.12)}}ball.y=Math.max(.3,Math.min(.82,ball.y));commentaryTimer+=dt;if(commentaryTimer>5){commentaryTimer=0;const lines=['WHAT A CHANCE!','THE CROWD IS ERUPTING!','END-TO-END ACTION!','WHO WANTS IT MORE?','THE PRESSURE IS BUILDING!'];say(pick(lines))}}field();const rr=Math.max(.08,Math.min(.92,.24+Math.sin(now*.0011)*.12+momentum*.12));const mm=Math.max(.08,Math.min(.92,.76+Math.cos(now*.001)*.1+momentum*.1));player(rr*W,H*.55,'r','RONALDO');player(mm*W,H*.55,'m','MESSI');player(W*.33,H*.39,'r','');player(W*.67,H*.72,'m','');ballDraw();updateParticles();drawParticles();$('momentum').style.width=(50+momentum*42)+'%';$('momentum').style.transform=momentum>=0?'translateX(0)':'translateX(-'+(-momentum*100)+'%)';$('timer').textContent=`${String(Math.max(0,Math.ceil(t))).padStart(2,'0')}`;requestAnimationFrame(tick)}requestAnimationFrame(tick)}
function playTone(freq,dur){if(muted)return;try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type='sawtooth';g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.07,audioCtx.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur+.02)}catch{}}
$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇 SOUND':'🔊 SOUND';if(!muted)playTone(520,.08)};$('skip').onclick=()=>{reset();playTone(330,.08)};reset();tick(performance.now());
</script></body></html>
