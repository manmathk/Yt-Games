<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modi vs Rahul AI Ping Pong</title><style>html,body{margin:0;background:#050914;color:white;font-family:Arial;min-height:100%}body{display:grid;place-items:center;padding:10px}.app{width:min(1200px,100%)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}h1{font-size:clamp(24px,5vw,48px);margin:0;background:linear-gradient(90deg,#ff9d27,#fff,#49a9ff);color:transparent;background-clip:text}.btn{background:#ffffff12;border:1px solid #ffffff30;color:#fff;padding:10px 14px;border-radius:10px;font-weight:900}.card{background:#0b1322;border:1px solid #ffffff20;border-radius:24px;padding:10px}.players{display:grid;grid-template-columns:1fr 100px 1fr;gap:10px;align-items:center;margin-bottom:10px}.p{display:flex;align-items:center;gap:10px;background:#ffffff08;padding:8px;border-radius:15px}.p.r{flex-direction:row-reverse;text-align:right}.photo{width:62px;height:62px;object-fit:cover;object-position:top;border-radius:50%;border:3px solid}.m .photo{border-color:#ff9d27}.r .photo{border-color:#49a9ff}.name{font-weight:1000}.sub{font-size:9px;opacity:.5}.score{font:900 48px monospace}.m .score{color:#ffb45c}.r .score{color:#70bdff}.vs{text-align:center;font-weight:900;letter-spacing:3px}canvas{width:100%;display:block;aspect-ratio:16/9;border-radius:18px;background:#061525}.status{text-align:center;font-size:11px;font-weight:900;letter-spacing:1px;margin:9px}</style></head><body><main class="app"><header><h1>AI PING PONG</h1><button class="btn" id="new">↻ NEW MATCH</button></header><section class="card"><div class="players"><div class="p m"><img class="photo" src="https://commons.wikimedia.org/wiki/Special:FilePath/Official%20portrait%20of%20Narendra%20Modi%202022.jpg"><div><div class="name">MODI</div><div class="sub">BAT: MODI</div></div><div class="score" id="a">0</div></div><div class="vs">VS<br><small>FIRST 7</small></div><div class="p r"><img class="photo" src="https://commons.wikimedia.org/wiki/Special:FilePath/Rahul%20Gandhi%20%28Portrait%29.png"><div><div class="name">RAHUL</div><div class="sub">BAT: RAHUL</div></div><div class="score" id="b">0</div></div></div><canvas id="c" width="1200" height="675"></canvas><div class="status" id="st">🤖 AUTOMATIC AI MATCH</div></section></main><script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=1200,H=675;let A={y:250,h:160},B={y:250,h:160},ball,s1=0,s2=0,run=true,last=0,fx=[];const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function newBall(dir){ball={x:W/2,y:H/2,vx:dir*(8+Math.random()*2),vy:(Math.random()-.5)*7,r:13,hit:0}}function reset(){s1=s2=0;a.textContent=b.textContent=0;A.y=B.y=H/2-80;run=true;newBall(Math.random()<.5?-1:1);st.textContent='🤖 AUTOMATIC AI MATCH'}function ai(p,targetX){let d=(targetX-ball.x)/ball.vx,ty=ball.y+ball.vy*Math.max(0,d),lo=30,hi=H-30;while(ty<lo||ty>hi){if(ty<lo)ty=lo+(lo-ty);if(ty>hi)ty=hi-(ty-hi)}p.y=clamp(p.y+clamp(ty-(p.y+p.h/2),-11,11),25,H-p.h-25)}function burst(X,Y){for(let i=0;i<15;i++){let q=Math.random()*6.28;fx.push({x:X,y:Y,vx:Math.cos(q)*4,vy:Math.sin(q)*4,l:1})}}function point(n){if(n===1)s1++;else s2++;a.textContent=s1;b.textContent=s2;burst(n===1?W-80:80,H/2);if(s1>=7||s2>=7){run=false;st.textContent='🏆 '+(s1>=7?'MODI':'RAHUL')+' WINS • NEW MATCH'}else{newBall(n===1?1:-1)}}function bat(X,Y,h,name,flip){x.save();x.shadowBlur=25;x.shadowColor=flip?'#49a9ff':'#ff9d27';let g=x.createLinearGradient(X,Y,X+25,Y+h);g.addColorStop(0,flip?'#a8dcff':'#ffd17d');g.addColorStop(1,flip?'#167bd0':'#e97816');x.fillStyle=g;x.roundRect(X,Y,25,h,12);x.fill();x.shadowBlur=0;x.fillStyle='#07101b';x.font='bold 12px Arial';x.translate(X+12,Y+h/2);x.rotate(-1.57);x.fillText(name,0,4);x.restore()}function draw(t){let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#092c48');g.addColorStop(1,'#030914');x.fillStyle=g;x.fillRect(0,0,W,H);x.strokeStyle='#ffffff18';x.lineWidth=3;x.setLineDash([14,18]);x.beginPath();x.moveTo(W/2,20);x.lineTo(W/2,H-20);x.stroke();x.setLineDash([]);x.strokeStyle='#ffffff20';x.lineWidth=5;x.strokeRect(20,20,W-40,H-40);bat(38,A.y,A.h,'MODI',0);bat(W-63,B.y,B.h,'RAHUL',1);for(let i=0;i<ball.trail.length;i++){let q=ball.trail[i];x.globalAlpha=i/ball.trail.length*.35;x.fillStyle='#fff';x.beginPath();x.arc(q.x,q.y,ball.r*i/ball.trail.length,0,7);x.fill()}x.globalAlpha=1;x.shadowBlur=30;x.shadowColor='#fff';x.fillStyle='#fff';x.beginPath();x.arc(ball.x,ball.y,ball.r,0,7);x.fill();x.shadowBlur=0;fx.forEach(q=>{x.globalAlpha=q.l;x.fillStyle='#ffd166';x.fillRect(q.x,q.y,5,5)});x.globalAlpha=1}function loop(t){let dt=Math.min(2,(t-last)/16.67||1);last=t;if(run){ai(A,60);ai(B,W-60);let ox=ball.x,oy=ball.y;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.trail=ball.trail||[];ball.trail.push({x:ox,y:oy});if(ball.trail.length>10)ball.trail.shift();if(ball.y-ball.r<20||ball.y+ball.r>H-20){ball.vy=-ball.vy;ball.y=clamp(ball.y,20+ball.r,H-20-ball.r);burst(ball.x,ball.y)}let leftPlane=63,rightPlane=W-63;if(ball.vx<0&&ox-ball.r>=leftPlane&&ball.x-ball.r<=leftPlane&&ball.y>=A.y-8&&ball.y<=A.y+A.h+8){ball.x=leftPlane+ball.r;ball.vx=Math.abs(ball.vx)*1.03;ball.vy=((ball.y-(A.y+A.h/2))/(A.h/2))*9;burst(leftPlane,ball.y)}if(ball.vx>0&&ox+ball.r<=rightPlane&&ball.x+ball.r>=rightPlane&&ball.y>=B.y-8&&ball.y<=B.y+B.h+8){ball.x=rightPlane-ball.r;ball.vx=-Math.abs(ball.vx)*1.03;ball.vy=((ball.y-(B.y+B.h/2))/(B.h/2))*9;burst(rightPlane,ball.y)}if(ball.x<-50)point(2);if(ball.x>W+50)point(1)}fx.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.1;q.l-=.035});fx=fx.filter(q=>q.l>0);draw(t);requestAnimationFrame(loop)}document.getElementById('new').onclick=reset;reset();requestAnimationFrame(loop);
</script></body></html>
