<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modi vs Rahul — AI Ping Pong</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,Arial,sans-serif;color:#fff;background:#050914}
body{padding:16px;display:grid;place-items:center;background:radial-gradient(circle at 50% -10%,#1b3555 0,#09101d 42%,#03050b 100%)}
.app{width:min(1180px,100%)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.brand{font-weight:1000;font-size:clamp(24px,5vw,46px);letter-spacing:-2px}.brand b{background:linear-gradient(90deg,#ff9f2d,#fff,#48a7ff);-webkit-background-clip:text;color:transparent}.live{font-size:10px;letter-spacing:2px;padding:7px 10px;border:1px solid #ff475755;border-radius:999px;color:#ff7580;background:#ff47500d}.actions{display:flex;gap:8px}.btn{border:1px solid #ffffff25;background:#ffffff10;color:#fff;border-radius:11px;padding:10px 14px;font-weight:900;cursor:pointer}.btn:hover{background:#ffffff20}
.arena-card{border:1px solid #ffffff20;border-radius:28px;padding:12px;background:linear-gradient(145deg,#111b2b,#070b14);box-shadow:0 25px 90px #000b;overflow:hidden}.players{display:grid;grid-template-columns:1fr 180px 1fr;align-items:center;gap:12px;margin-bottom:12px}.player{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:18px;background:#ffffff08;border:1px solid #ffffff12}.player.right{flex-direction:row-reverse;text-align:right}.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;object-position:center top;border:3px solid;box-shadow:0 0 25px #0008}.modi .avatar{border-color:#ff9f2d}.rahul .avatar{border-color:#4aa8ff}.name{font-size:clamp(18px,3vw,27px);font-weight:1000}.role{font-size:9px;letter-spacing:1.5px;opacity:.55;margin-top:3px}.score{font:1000 clamp(38px,6vw,60px)/1 monospace}.modi .score{color:#ffad4d}.rahul .score{color:#69b8ff}.vs{text-align:center;font-size:13px;letter-spacing:4px;font-weight:1000;opacity:.65}.best{font-size:9px;letter-spacing:1px;margin-top:4px;opacity:.4}canvas{display:block;width:100%;aspect-ratio:16/9;border-radius:20px;border:1px solid #ffffff22;background:#061321}.status{text-align:center;font-weight:900;letter-spacing:1.5px;font-size:11px;margin:11px 0 3px}.hint{text-align:center;font-size:10px;opacity:.4}@media(max-width:700px){body{padding:7px}.arena-card{padding:7px;border-radius:20px}.players{grid-template-columns:1fr 70px 1fr;gap:5px}.player{padding:6px;display:grid;justify-items:center;text-align:center!important;gap:3px}.player.right{display:grid}.avatar{width:52px;height:52px}.role{display:none}.name{font-size:13px}.score{font-size:28px}.vs{font-size:10px;letter-spacing:1px}.top{align-items:flex-start}.actions .btn{padding:8px 9px;font-size:11px}}
</style></head>
<body><main class="app">
<div class="top"><div class="brand"><b>AI PING PONG</b> <span class="live">● LIVE</span></div><div class="actions"><button class="btn" id="new">↻ NEW MATCH</button><button class="btn" id="sound">🔊 SOUND</button></div></div>
<section class="arena-card"><div class="players">
<div class="player modi"><img class="avatar" alt="Narendra Modi" src="https://commons.wikimedia.org/wiki/Special:FilePath/Official%20portrait%20of%20Narendra%20Modi%202022.jpg"><div><div class="name">NARENDRA MODI</div><div class="role">AI PLAYER • BAT: MODI</div></div><div class="score" id="s1">0</div></div>
<div class="vs">VS<div class="best">FIRST TO 7</div></div>
<div class="player right rahul"><img class="avatar" alt="Rahul Gandhi" src="https://commons.wikimedia.org/wiki/Special:FilePath/Rahul%20Gandhi%20%28Portrait%29.png"><div><div class="name">RAHUL GANDHI</div><div class="role">AI PLAYER • BAT: RAHUL</div></div><div class="score" id="s2">0</div></div>
</div><canvas id="game" width="1200" height="675"></canvas><div class="status" id="status">🤖 AI PLAYERS ARE READY • AUTOMATED MATCH</div><div class="hint">No controls required • Rally, spin, bounce and scoring are automatic</div></section>
</main>
<script>
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height,img1=new Image(),img2=new Image();img1.crossOrigin='anonymous';img2.crossOrigin='anonymous';img1.src='https://commons.wikimedia.org/wiki/Special:FilePath/Official%20portrait%20of%20Narendra%20Modi%202022.jpg';img2.src='https://commons.wikimedia.org/wiki/Special:FilePath/Rahul%20Gandhi%20%28Portrait%29.png';
let p1,p2,ball,score1=0,score2=0,running=true,last=0,particles=[],soundOn=true,audio;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const status=document.getElementById('status'),s1=document.getElementById('s1'),s2=document.getElementById('s2');
function audioInit(){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch{}}
function beep(f,d=.05,v=.035,type='sine'){if(!soundOn)return;try{audioInit();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}
function music(){if(!soundOn)return;[196,247,294,392].forEach((f,i)=>setTimeout(()=>beep(f,.18,.012,'triangle'),i*55));setTimeout(()=>{if(running&&soundOn)music()},1500)}
function resetBall(dir){ball={x:W/2,y:H/2,vx:dir*(7.1+Math.random()*1.3),vy:(Math.random()-.5)*5.5,r:13,trail:[]}}
function reset(){score1=score2=0;p1={y:H/2-78,h:156,vy:0};p2={y:H/2-78,h:156,vy:0};particles=[];resetBall(Math.random()<.5?-1:1);running=true;status.textContent='🤖 AI PLAYERS ARE READY • AUTOMATED MATCH';s1.textContent=0;s2.textContent=0}
function predictY(x){const dx=(x-ball.x)/ball.vx;let y=ball.y+ball.vy*Math.max(0,dx),a=28+ball.r,b=H-28-ball.r;while(y<a||y>b){if(y<a)y=a+(a-y);if(y>b)y=b-(y-b)}return y}
function moveAI(p,x,dt,skill){p.y=clamp(p.y+clamp(predictY(x)-(p.y+p.h/2),-8.8*skill*dt,8.8*skill*dt),26,H-p.h-26)}
function burst(x,y,n=14){for(let i=0;i<n;i++){let a=Math.random()*7,s=2+Math.random()*5;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1})}}
function point(who){if(who===1)score1++;else score2++;s1.textContent=score1;s2.textContent=score2;burst(who===1?W-90:90,H/2,30);beep(who===1?740:430,.15,.06,'square');if(score1>=7||score2>=7){running=false;status.textContent=(score1>=7?'🏆 NARENDRA MODI':'🏆 RAHUL GANDHI')+' WINS THE AI MATCH • NEW MATCH';return}status.textContent=(who===1?'RAHUL':'MODI')+' MISSED • NEXT RALLY';resetBall(who===1?1:-1)}
function bat(x,y,h,label,side){ctx.save();ctx.shadowBlur=25;ctx.shadowColor=side===1?'#ff9f2d':'#4aa8ff';let g=ctx.createLinearGradient(x,y,x+18,y+h);g.addColorStop(0,side===1?'#ffc46a':'#9bd2ff');g.addColorStop(1,side===1?'#e87516':'#1477ce');ctx.fillStyle=g;ctx.roundRect(x,y,22,h,11);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#07101c';ctx.font='900 11px Arial';ctx.textAlign='center';ctx.translate(x+11,y+h/2);ctx.rotate(-Math.PI/2);ctx.fillText(label,0,4);ctx.restore()}
function draw(t){let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#082944');g.addColorStop(.5,'#071827');g.addColorStop(1,'#040a12');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffffff08';for(let i=0;i<25;i++){let x=(i*97+t*.018)%W,y=(i*53)%H;ctx.beginPath();ctx.arc(x,y,2,0,7);ctx.fill()}ctx.strokeStyle='#ffffff16';ctx.lineWidth=3;ctx.setLineDash([13,17]);ctx.beginPath();ctx.moveTo(W/2,25);ctx.lineTo(W/2,H-25);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#ffffff18';ctx.lineWidth=5;ctx.strokeRect(20,25,W-40,H-50);bat(38,p1.y,p1.h,'MODI',1);bat(W-60,p2.y,p2.h,'RAHUL',2);ball.trail.forEach((q,i)=>{ctx.globalAlpha=i/ball.trail.length*.3;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(q.x,q.y,ball.r*(i/ball.trail.length),0,7);ctx.fill()});ctx.globalAlpha=1;ctx.shadowBlur=30;ctx.shadowColor='#fff';ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill();ctx.shadowBlur=0;ctx.font='900 42px Arial';ctx.textAlign='center';ctx.fillStyle='#ffffff09';ctx.fillText('AUTOMATED ARENA',W/2,H-43);particles.forEach(q=>{ctx.globalAlpha=q.life;ctx.fillStyle='#ffd166';ctx.fillRect(q.x,q.y,4,4)});ctx.globalAlpha=1}
function loop(t){let dt=Math.min(2.5,(t-last)/16.67||1);last=t;if(running){moveAI(p1,58,dt,.98);moveAI(p2,W-58,dt,.96);ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>9)ball.trail.shift();ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.y-ball.r<28||ball.y+ball.r>H-28){ball.vy*=-1;ball.y=clamp(ball.y,28+ball.r,H-28-ball.r);burst(ball.x,ball.y,5);beep(250,.025,.02)}if(ball.vx<0&&ball.x-ball.r<60&&ball.x>35&&ball.y>p1.y-ball.r&&ball.y<p1.y+p1.h+ball.r){let rel=(ball.y-(p1.y+p1.h/2))/(p1.h/2);ball.vx=Math.abs(ball.vx)*1.035;ball.vy=rel*8.2;ball.x=60+ball.r;burst(60,ball.y,7);beep(540,.035)}if(ball.vx>0&&ball.x+ball.r>W-60&&ball.x<W-35&&ball.y>p2.y-ball.r&&ball.y<p2.y+p2.h+ball.r){let rel=(ball.y-(p2.y+p2.h/2))/(p2.h/2);ball.vx=-Math.abs(ball.vx)*1.035;ball.vy=rel*8.2;ball.x=W-60-ball.r;burst(W-60,ball.y,7);beep(620,.035)}if(ball.x<-40)point(2);if(ball.x>W+40)point(1)}particles.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.12;q.life-=.035});particles=particles.filter(q=>q.life>0);draw(t);requestAnimationFrame(loop)}
document.getElementById('new').onclick=()=>{audioInit();reset();beep(360,.08,.05);music()};document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 SOUND':'🔇 SOUND';if(soundOn){audioInit();music()}};reset();requestAnimationFrame(loop);
</script></body></html>
