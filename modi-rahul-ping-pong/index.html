<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MODI vs RAHUL — AI Ping Pong</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
body{display:grid;place-items:center;padding:14px}.wrap{width:min(100%,1100px)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(22px,4vw,42px);letter-spacing:2px}h1 span{opacity:.7;font-size:.55em;letter-spacing:1px}
.controls{display:flex;gap:8px}.btn{border:1px solid #ffffff30;background:#ffffff12;color:#fff;border-radius:10px;padding:9px 13px;font-weight:800;cursor:pointer}.btn:hover{background:#ffffff22}
.card{background:linear-gradient(145deg,#101e33,#081321);border:1px solid #ffffff1c;border-radius:24px;padding:14px;box-shadow:0 25px 70px #0008}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:10px}.player{text-align:center;font-weight:900}.player small{display:block;opacity:.65;font-size:10px;letter-spacing:2px}.p1{color:#ff9f43}.p2{color:#62b0ff}.points{font:900 clamp(30px,7vw,58px)/1 monospace}.dash{font-size:24px;opacity:.35}
canvas{display:block;width:100%;max-width:1000px;margin:auto;aspect-ratio:16/9;background:#071b2b;border-radius:16px;border:1px solid #ffffff20}
.status{text-align:center;margin:10px 0 2px;font-size:12px;letter-spacing:1.5px;font-weight:800;opacity:.75}.note{text-align:center;margin-top:8px;font-size:11px;opacity:.5}
@media(max-width:600px){body{padding:7px}.card{padding:9px;border-radius:18px}header{margin-bottom:8px}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>MODI <span>VS</span> RAHUL</h1><div class="controls"><button class="btn" id="new">NEW MATCH</button><button class="btn" id="sound">🔊 SOUND</button></div></header>
<section class="card">
<div class="score"><div class="player p1"><small>AI PLAYER 1</small>MODI<div class="points" id="s1">0</div></div><div class="dash">:</div><div class="player p2"><small>AI PLAYER 2</small>RAHUL<div class="points" id="s2">0</div></div></div>
<canvas id="game" width="1000" height="562" aria-label="Automated ping pong game"></canvas>
<div class="status" id="status">AI MATCH • LIVE</div><div class="note">Fully automated • First to 7 wins • Press NEW MATCH to restart</div>
</section>
</div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),W=c.width,H=c.height;
let ball,p1,p2,score1=0,score2=0,running=true,last=0,soundOn=true,audio;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function audioInit(){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch{}}
function tone(f,d=.05){if(!soundOn)return;try{audioInit();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.type='square';g.gain.value=.025;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}
function resetBall(dir){ball={x:W/2,y:H/2,vx:dir*(5.3+Math.random()*1.2),vy:(Math.random()-.5)*5.2,r:10}}
function reset(){score1=score2=0;p1={y:H/2-70,h:140};p2={y:H/2-70,h:140};resetBall(Math.random()<.5?-1:1);running=true;document.getElementById('status').textContent='AI MATCH • LIVE';updateScore()}
function updateScore(){s1.textContent=score1;s2.textContent=score2}
function ai(p,target,skill){const center=p.y+p.h/2;const desired=target.y+target.r*.15;const max=7.0*skill; p.y+=clamp(desired-center,-max,max);p.y=clamp(p.y,20,H-p.h-20)}
function point(who){if(who===1)score1++;else score2++;updateScore();tone(who===1?660:440,.12);if(score1>=7||score2>=7){running=false;document.getElementById('status').textContent=(score1>=7?'MODI':'RAHUL')+' AI WINS • NEW MATCH TO PLAY';return}resetBall(who===1?1:-1)}
function draw(){
ctx.clearRect(0,0,W,H);
const grd=ctx.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#08243a');grd.addColorStop(1,'#061524');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#ffffff16';ctx.setLineDash([10,14]);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(W/2,18);ctx.lineTo(W/2,H-18);ctx.stroke();ctx.setLineDash([]);
ctx.fillStyle='#ff9f43';ctx.shadowBlur=18;ctx.shadowColor='#ff9f43';ctx.fillRect(30,p1.y,18,p1.h);ctx.fillStyle='#62b0ff';ctx.shadowColor='#62b0ff';ctx.fillRect(W-48,p2.y,18,p2.h);
ctx.fillStyle='#fff';ctx.shadowBlur=20;ctx.shadowColor='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
ctx.fillStyle='#ffffff0a';ctx.font='900 70px system-ui';ctx.textAlign='center';ctx.fillText('AI',W/2,H-38);
}
function loop(t){const dt=Math.min(2,(t-last)/16.67||1);last=t;if(running){
ai(p1,ball,.94);ai(p2,ball,.91);ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
if(ball.y-ball.r<12||ball.y+ball.r>H-12){ball.vy*=-1;ball.y=clamp(ball.y,12+ball.r,H-12-ball.r);tone(240,.025)}
if(ball.vx<0&&ball.x-ball.r<48&&ball.x>25&&ball.y>p1.y-8&&ball.y<p1.y+p1.h+8){const rel=(ball.y-(p1.y+p1.h/2))/(p1.h/2);ball.vx=Math.abs(ball.vx)*1.025;ball.vy=rel*7;tone(520,.025)}
if(ball.vx>0&&ball.x+ball.r>W-48&&ball.x<W-25&&ball.y>p2.y-8&&ball.y<p2.y+p2.h+8){const rel=(ball.y-(p2.y+p2.h/2))/(p2.h/2);ball.vx=-Math.abs(ball.vx)*1.025;ball.vy=rel*7;tone(620,.025)}
if(ball.x<-25)point(2);if(ball.x>W+25)point(1)}
draw();requestAnimationFrame(loop)}
document.getElementById('new').onclick=()=>{audioInit();reset();tone(360,.07)};
document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 SOUND':'🔇 SOUND';if(soundOn){audioInit();tone(500,.06)}};
reset();requestAnimationFrame(loop);
</script>
</body>
</html>
