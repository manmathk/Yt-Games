<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ronaldo vs Messi — Auto Tic Tac Toe</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;overflow:hidden;background:#030507;color:#fff;font-family:system-ui,Arial,sans-serif}.game{position:relative;width:min(100vw,540px);height:min(100vh,960px);aspect-ratio:9/16;overflow:hidden;background:radial-gradient(circle at 50% 38%,#182b3d,#071018 48%,#020304 100%);box-shadow:0 0 0 1px #fff2,0 25px 80px #000}.game:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:20;background:linear-gradient(#0006,transparent 20%,transparent 78%,#000b)}
.top{position:absolute;top:0;left:0;right:0;padding:12px;z-index:10}.title{text-align:center;font-size:clamp(22px,6vw,34px);font-weight:1000;line-height:.9;text-shadow:0 3px 12px #000}.title span{color:#ffd23f}.sub{text-align:center;margin-top:6px;color:#a9dff0;font-size:10px;font-weight:800;letter-spacing:.12em}.players{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:12px}.player{padding:7px;border:1px solid #fff3;border-radius:14px;background:#07131be8;text-align:center}.avatar{width:clamp(54px,15vw,82px);height:clamp(54px,15vw,82px);margin:auto;border-radius:50%;overflow:hidden;border:3px solid #fff}.avatar img{width:100%;height:100%;object-fit:cover}.pname{font-size:clamp(11px,3vw,15px);font-weight:1000;margin-top:4px}.score{font-size:clamp(28px,8vw,48px);font-weight:1000;line-height:.9}.x{color:#ffb000;text-shadow:0 0 18px #ff8a00}.o{color:#19c6ff;text-shadow:0 0 18px #19c6ff}.vs{font-weight:1000;font-size:11px;color:#fff8}.boardWrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-48%);width:min(86vw,410px);aspect-ratio:1;z-index:8}.board{width:100%;height:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:9px;border-radius:22px;background:linear-gradient(135deg,#ffffff18,#ffffff05);border:1px solid #fff3;box-shadow:0 25px 70px #000a,inset 0 0 30px #fff1}.cell{position:relative;border:2px solid #ffffff18;border-radius:16px;background:radial-gradient(circle,#173246,#08131b 75%);display:grid;place-items:center;font-size:clamp(45px,16vw,92px);font-weight:1000;cursor:default;overflow:hidden}.cell.x{color:#ff8a00}.cell.o{color:#19c6ff}.cell.pop{animation:pop .35s ease}@keyframes pop{50%{transform:scale(1.08);filter:brightness(1.8)}}.win{box-shadow:0 0 0 3px #ffd33d,0 0 35px #ffd33d,inset 0 0 30px #ffd33d33}.status{position:absolute;left:50%;bottom:13%;transform:translateX(-50%);width:90%;text-align:center;padding:10px 12px;border:1px solid #fff3;border-radius:13px;background:#061015ed;font-size:clamp(11px,3.1vw,15px);font-weight:900;z-index:10}.round{position:absolute;top:7%;right:5%;padding:6px 10px;border-radius:99px;background:#d7193fdd;font-size:10px;font-weight:1000;z-index:11}.live:before{content:"";display:inline-block;width:7px;height:7px;background:#fff;border-radius:50%;margin-right:5px;animation:blink .7s infinite}@keyframes blink{50%{opacity:.2}}.controls{position:absolute;bottom:3%;left:12px;right:12px;display:grid;grid-template-columns:1fr auto;gap:8px;z-index:30}.btn{min-height:43px;border:1px solid #fff4;border-radius:11px;background:#071015f5;color:#fff;font-weight:1000}.primary{background:linear-gradient(135deg,#ff7a00,#ffb000,#d71939)}.hidden{display:none}.overlay{position:absolute;inset:0;z-index:40;display:grid;place-items:center;padding:22px;background:#020507eF;text-align:center}.card{width:min(100%,390px);padding:25px;border:1px solid #fff3;border-radius:20px;background:#071015f5;box-shadow:0 30px 70px #000}.card h1{margin:0;font-size:clamp(36px,11vw,64px);line-height:.85}.card p{color:#d9f5ff;font-size:13px;line-height:1.55;font-weight:700}.pulse{animation:pulse .7s ease}@keyframes pulse{50%{filter:brightness(1.8);transform:scale(1.03)}}
</style>
</head>
<body><main class="game" id="game"><header class="top"><div class="title">RONALDO <span>VS</span> MESSI</div><div class="sub">AUTO TIC TAC TOE • LIVE MATCH</div><div class="players"><div class="player"><div class="avatar"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Cristiano_Ronaldo_2018.jpg"></div><div class="pname">RONALDO · X</div><div class="score x" id="sx">0</div></div><div class="vs">VS</div><div class="player"><div class="avatar"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Lionel_Messi_20180626.jpg"></div><div class="pname">MESSI · O</div><div class="score o" id="so">0</div></div></div></header><div class="round live" id="round">ROUND 1</div><section class="boardWrap"><div class="board" id="board"><div class="cell" data-i="0"></div><div class="cell" data-i="1"></div><div class="cell" data-i="2"></div><div class="cell" data-i="3"></div><div class="cell" data-i="4"></div><div class="cell" data-i="5"></div><div class="cell" data-i="6"></div><div class="cell" data-i="7"></div><div class="cell" data-i="8"></div></div></section><div class="status" id="status">Starting automatic match…</div><div class="controls"><button class="btn primary" id="reset">↻ RESET MATCH</button><button class="btn" id="sound">🔊</button></div><div class="overlay" id="overlay"><div class="card"><h1>AUTO<br>TIC TAC TOE</h1><p>Ronaldo and Messi play automatically. Watch every move, win, draw and rematch — continuously.</p><button class="btn primary" id="go">START LIVE</button></div></div></main><audio id="music" preload="auto" loop playsinline><source src="../Graveyard%20Drift.mp3" type="audio/mpeg"></audio>
<script>
(()=>{const $=id=>document.getElementById(id),cells=[...document.querySelectorAll('.cell')],music=$('music'),S={on:false,sound:true,board:Array(9).fill(''),turn:'X',round:1,x:0,o:0,draw:0,move:0,t:null,ac:null};music.volume=.28;const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function tone(f=440,v=.05,d=.09){if(!S.sound)return;S.ac??=new(window.AudioContext||window.webkitAudioContext)();S.ac.resume();let o=S.ac.createOscillator(),g=S.ac.createGain(),n=S.ac.currentTime;o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.001,n);g.gain.exponentialRampToValueAtTime(v,n+.01);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(S.ac.destination);o.start(n);o.stop(n+d+.02)}function speak(t){if(!S.sound||!window.speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=1.08;u.pitch=1;speechSynthesis.speak(u)}function hud(){$('sx').textContent=S.x;$('so').textContent=S.o;$('round').textContent='ROUND '+S.round}function status(t,pulse=false){$('status').textContent=t;if(pulse){$('status').classList.remove('pulse');void $('status').offsetWidth;$('status').classList.add('pulse')}}function render(){cells.forEach((c,i)=>{c.textContent=S.board[i];c.className='cell'+(S.board[i]?(' '+(S.board[i]==='X'?'x':'o')):'')});hud()}function result(){for(const w of wins){const[a,b,c]=w;if(S.board[a]&&S.board[a]===S.board[b]&&S.board[a]===S.board[c])return{winner:S.board[a],w};}if(S.board.every(Boolean))return{winner:null,w:null};return null}function smartMove(p){let empt=S.board.map((v,i)=>v?null:i).filter(i=>i!==null);for(const i of empt){S.board[i]=p;if(result()?.winner===p){S.board[i]='';return i}S.board[i]=''}let q=p==='X'?'O':'X';for(const i of empt){S.board[i]=q;if(result()?.winner===q){S.board[i]='';return i}S.board[i]=''}if(!S.board[4])return 4;let corners=[0,2,6,8].filter(i=>!S.board[i]);if(corners.length)return corners[Math.floor(Math.random()*corners.length)];return empt[Math.floor(Math.random()*empt.length)]}function move(){if(!S.on)return;let i=smartMove(S.turn);if(i==null)return;S.board[i]=S.turn;S.move++;render();cells[i].classList.add('pop');setTimeout(()=>cells[i].classList.remove('pop'),400);tone(S.turn==='X'?520:700,.06,.08);status((S.turn==='X'?'Ronaldo':'Messi')+' plays '+(i+1));let r=result();if(r){setTimeout(()=>finish(r),550);return}S.turn=S.turn==='X'?'O':'X';S.t=setTimeout(move,650)}function finish(r){if(r.winner){let name=r.winner==='X'?'Ronaldo':'Messi';r.w.forEach(i=>cells[i].classList.add('win'));if(r.winner==='X')S.x++;else S.o++;status(name+' WINS! New round starting…',true);tone(r.winner==='X'?760:920,.12,.35);speak(name+' wins the round. Next round starts now.')}else{S.draw++;status('DRAW! New round starting…',true);tone(360,.08,.25);speak('Draw game. Next round starts now.')}hud();S.t=setTimeout(nextRound,1500)}function nextRound(){S.round++;S.board=Array(9).fill('');S.turn=S.round%2?'X':'O';S.move=0;cells.forEach(c=>c.className='cell');status((S.turn==='X'?'Ronaldo':'Messi')+' starts round '+S.round+'…',true);S.t=setTimeout(move,650)}function start(){if(S.on)return;S.on=true;$('overlay').classList.add('hidden');music.play().catch(()=>{});status('Match started — Ronaldo and Messi are playing automatically.',true);speak('Ronaldo versus Messi. The automatic Tic Tac Toe match begins.');S.t=setTimeout(move,900)}function reset(){clearTimeout(S.t);S.board=Array(9).fill('');S.turn='X';S.round=1;S.x=S.o=S.draw=S.move=0;cells.forEach(c=>c.className='cell');hud();status('Fresh match — Ronaldo starts.',true);if(S.on)S.t=setTimeout(move,500)}function sound(){S.sound=!S.sound;$('sound').textContent=S.sound?'🔊':'🔇';music.muted=!S.sound;if(!S.sound)speechSynthesis?.cancel()}$('go').onclick=start;$('reset').onclick=reset;$('sound').onclick=sound;hud();})();
</script></body></html>
